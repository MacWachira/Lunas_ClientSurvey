<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUNAS Beauty Salon - Client Survey & Analytics System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #006850;
            --secondary-color: #FBB040;
            --dark-color: #000000;
            --light-color: #FFFFFF;
            --light-bg: #f8f9fa;
            --card-bg: #ffffff;
            --text-dark: #333333;
            --text-light: #666666;
            --border-color: #e0e0e0;
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
            --warning-color: #f39c12;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', 'Segoe UI', sans-serif; }
        body { background: linear-gradient(145deg, #f0f4f8 0%, #e8edf2 100%); min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        .main-header { background: linear-gradient(135deg, var(--primary-color), #00875a); padding: 20px 0; margin-bottom: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .header-content { max-width: 1400px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { font-family: 'Playfair Display', serif; font-size: 2.8rem; font-weight: 700; color: white; letter-spacing: 2px; text-transform: uppercase; }
        .tagline { font-size: 1rem; color: rgba(255,255,255,0.9); letter-spacing: 4px; text-transform: uppercase; margin-top: 5px; }
        .nav-buttons { display: flex; gap: 15px; }
        .nav-btn { padding: 12px 25px; background-color: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 40px; font-weight: 600; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 10px; }
        .nav-btn:hover { background-color: rgba(255,255,255,0.25); transform: translateY(-2px); }
        .nav-btn.active { background-color: var(--secondary-color); color: var(--dark-color); border-color: transparent; }
        
        #surveySection { display: block; }
        #dashboardSection { display: none; }
        
        .survey-header { text-align: center; margin-bottom: 40px; padding: 35px; background: linear-gradient(135deg, rgba(0,104,80,0.08), rgba(251,176,64,0.08)); border-radius: 28px; }
        .survey-title { font-size: 2.5rem; color: var(--primary-color); margin-bottom: 15px; }
        .survey-subtitle { font-size: 1.1rem; color: var(--text-light); max-width: 700px; margin: 0 auto; }
        
        .progress-container { margin-bottom: 35px; }
        .progress-bar { height: 8px; background-color: var(--border-color); border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(to right, var(--primary-color), var(--secondary-color)); width: 0%; transition: width 0.5s ease; border-radius: 10px; }
        
        .survey-card { background-color: var(--card-bg); border-radius: 32px; padding: 44px 48px; box-shadow: 0 20px 35px -12px rgba(0,0,0,0.12); margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.6); display: none; }
        .survey-card.active { display: block; animation: fadeInUp 0.5s ease; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-header { margin-bottom: 30px; border-left: 4px solid var(--secondary-color); padding-left: 20px; }
        .card-header h2 { font-size: 1.8rem; color: var(--primary-color); margin-bottom: 8px; }
        
        .form-group { margin-bottom: 25px; }
        label { display: block; font-weight: 600; margin-bottom: 10px; color: var(--dark-color); }
        .required { color: var(--danger-color); }
        input, select, textarea { width: 100%; padding: 16px 20px; border: 2px solid var(--border-color); border-radius: 20px; font-size: 1rem; transition: all 0.3s; background: white; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 4px rgba(0,104,80,0.1); }
        textarea { min-height: 100px; resize: vertical; }
        
        /* Per-Service Rating Cards */
        .services-enhanced { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin: 20px 0; }
        .service-card-enh { background: #fafcff; border-radius: 20px; border: 2px solid var(--border-color); transition: all 0.25s ease; overflow: hidden; cursor: pointer; }
        .service-card-enh:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        .service-card-enh.selected { border-color: var(--primary-color); background: white; box-shadow: 0 8px 20px rgba(0,104,80,0.12); }
        .service-header-enh { display: flex; align-items: center; padding: 16px 18px; }
        .service-header-enh input { width: 22px; height: 22px; margin-right: 14px; cursor: pointer; accent-color: var(--primary-color); }
        .service-header-enh span { font-weight: 600; font-size: 1rem; flex: 1; cursor: pointer; }
        .service-rating-enh { padding: 0 18px 18px 18px; background: white; border-top: 1px dashed var(--border-color); display: none; }
        .service-card-enh.selected .service-rating-enh { display: block; animation: slideDown 0.25s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .stars-enh { display: flex; gap: 8px; margin: 12px 0 10px 0; }
        .stars-enh span { font-size: 1.6rem; cursor: pointer; color: #cbd5e1; transition: 0.1s; }
        .stars-enh span.active { color: var(--secondary-color); text-shadow: 0 0 3px rgba(251,176,64,0.4); }
        .comment-enh input { width: 100%; padding: 10px 14px; border-radius: 40px; border: 1px solid var(--border-color); font-size: 0.85rem; }
        
        .rating-container { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin: 15px 0; }
        .rating-option { flex: 1; min-width: 100px; text-align: center; padding: 14px 10px; background: #f8f9fa; border-radius: 50px; cursor: pointer; border: 2px solid var(--border-color); font-weight: 500; transition: 0.2s; }
        .rating-option.selected { background: var(--primary-color); color: white; border-color: var(--primary-color); }
        .rating-option i { font-size: 1.4rem; margin-bottom: 4px; display: block; }
        
        .btn-container { display: flex; justify-content: space-between; margin-top: 40px; gap: 20px; }
        .btn { padding: 16px 35px; border: none; border-radius: 50px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; flex: 1; }
        .btn-primary { background: linear-gradient(135deg, var(--primary-color), #00875a); color: white; box-shadow: 0 5px 15px rgba(0,104,80,0.2); }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,104,80,0.3); }
        .btn-secondary { background: #f0f0f0; color: var(--dark-color); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: #e0e0e0; transform: translateY(-2px); }
        .btn-danger { background: linear-gradient(135deg, var(--danger-color), #c0392b); color: white; }
        
        .thank-you-card { text-align: center; padding: 60px 40px; display: none; }
        .thank-you-card.active { display: block; }
        .thank-you-icon { font-size: 5rem; color: var(--primary-color); margin-bottom: 25px; }
        
        .social-icons { display: flex; justify-content: center; gap: 35px; flex-wrap: wrap; margin: 30px 0; }
        .social-icon { display: flex; flex-direction: column; align-items: center; text-decoration: none; transition: 0.3s; }
        .social-icon:hover { transform: translateY(-5px); }
        .social-circle { width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; font-size: 2rem; color: white; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .instagram { background: linear-gradient(45deg, #405DE6, #833AB4, #E1306C); }
        .tiktok { background: linear-gradient(45deg, #000000, #25F4EE, #FE2C55); }
        .whatsapp { background: linear-gradient(45deg, #25D366, #128C7E); }
        
        /* Dashboard Styles */
        .dashboard-header { background: linear-gradient(135deg, var(--primary-color), #00875a); border-radius: 28px; padding: 28px 35px; color: white; display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; }
        .logout-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); padding: 12px 25px; border-radius: 40px; font-weight: 600; cursor: pointer; color: white; }
        .logout-btn:hover { background: rgba(255,255,255,0.3); transform: translateY(-2px); }
        
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 60vh; }
        .login-card { background: white; border-radius: 32px; padding: 50px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        .login-error { color: var(--danger-color); margin-top: 15px; display: none; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .stat-card { background: white; border-radius: 24px; padding: 22px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); transition: 0.3s; border-bottom: 4px solid var(--secondary-color); }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .stat-number { font-size: 2.5rem; font-weight: 800; color: var(--primary-color); line-height: 1; margin-bottom: 5px; }
        .stat-label { color: var(--text-light); font-weight: 500; }
        
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 28px; margin-bottom: 35px; }
        @media (max-width: 1000px) { .dashboard-grid { grid-template-columns: 1fr; } }
        
        .dashboard-card { background: white; border-radius: 28px; padding: 28px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        .chart-container { height: 280px; margin-top: 15px; }
        .service-item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eef2f8; }
        .service-count { background: rgba(0,104,80,0.1); color: var(--primary-color); padding: 5px 14px; border-radius: 30px; font-weight: 600; }
        .feedback-item { padding: 18px; border-radius: 20px; margin-bottom: 14px; background: #fafcff; border-left: 5px solid var(--primary-color); }
        .per-service-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eef2f8; }
        
        @media (max-width: 768px) { .container { padding: 15px; } .survey-card { padding: 28px 24px; } .services-enhanced { grid-template-columns: 1fr; } .btn-container { flex-direction: column; } .btn { width: 100%; } }
        
        .toast-success { position: fixed; bottom: 30px; right: 30px; background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; padding: 16px 28px; border-radius: 50px; display: flex; align-items: center; gap: 12px; font-weight: 600; z-index: 1000; transform: translateX(400px); transition: 0.3s; cursor: pointer; }
        .toast-success.show { transform: translateX(0); }
    </style>
</head>
<body>
    <div class="main-header">
        <div class="header-content">
            <div><div class="logo">LUNAS</div><div class="tagline">Beauty Salon & Spa</div></div>
            <div class="nav-buttons">
                <button class="nav-btn active" id="navSurvey"><i class="fas fa-clipboard-list"></i> Client Survey</button>
                <button class="nav-btn" id="navDashboard"><i class="fas fa-chart-line"></i> Analytics Dashboard</button>
            </div>
        </div>
    </div>
    
    <div class="container">
        <section id="surveySection"></section>
        <section id="dashboardSection"></section>
    </div>

    <div id="toastMsg" class="toast-success"><i class="fas fa-check-circle"></i><span>Thank you! Your feedback has been recorded.</span><i class="fas fa-times-circle" style="margin-left: 12px;"></i></div>

    <script>
        function showToast(msg) {
            const toast = document.getElementById('toastMsg');
            toast.querySelector('span').textContent = msg || '✨ Thank you for your feedback! ✨';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
            toast.onclick = (e) => { if(e.target.classList.contains('fa-times-circle')) toast.classList.remove('show'); };
        }
        
        if (!localStorage.getItem('lunasBusinessData')) {
            localStorage.setItem('lunasBusinessData', JSON.stringify({
                clients: [], services: [], feedback: [], servicePerceptions: [], employeeShoutouts: [],
                newClientsCount: 0, returningClientsCount: 0, startDate: new Date().toISOString()
            }));
        }
        
        document.getElementById('navSurvey').onclick = () => switchSection('survey');
        document.getElementById('navDashboard').onclick = () => switchSection('dashboard');
        
        function switchSection(section) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if (section === 'survey') {
                document.getElementById('navSurvey').classList.add('active');
                document.getElementById('surveySection').style.display = 'block';
                document.getElementById('dashboardSection').style.display = 'none';
                loadSurveyTool();
            } else {
                document.getElementById('navDashboard').classList.add('active');
                document.getElementById('surveySection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                loadDashboard();
            }
        }
        
        const SERVICES = ["Gel Polish","Tips","Builder Gel","Gumgel Overlay","Gumgel Sculpting","Pedicure","Manicure","Piercing","Wig Installation and Styling","Wig Laundry","Eyelash Extension","Waxing","Facial","Massage","Braiding","Wash and Blow","Brow Shaping","Dreadlock Installation/Retouch","Flat Ironing","Other"];
        
        function loadSurveyTool() {
            let servicesHtml = `<div class="services-enhanced">`;
            SERVICES.forEach(svc => {
                servicesHtml += `
                    <div class="service-card-enh" data-svc="${svc}">
                        <div class="service-header-enh">
                            <input type="checkbox" name="service" class="service-check" value="${svc}">
                            <span>${svc}</span>
                        </div>
                        <div class="service-rating-enh">
                            <div class="stars-enh">${[1,2,3,4,5].map(s => `<span data-star="${s}">★</span>`).join('')}</div>
                            <div class="comment-enh"><input type="text" class="svc-comment" placeholder="Your experience with ${svc}..."></div>
                        </div>
                    </div>
                `;
            });
            servicesHtml += `</div><div class="form-group"><label for="otherServiceField">If "Other", please specify:</label><input type="text" id="otherServiceField" placeholder="Describe the service"></div>`;
            
            const surveyHTML = `
                <div class="survey-header"><h1 class="survey-title">✨ Client Satisfaction Survey ✨</h1><p class="survey-subtitle">Thank you for choosing LUNAS. Your feedback helps us improve.</p></div>
                <div class="progress-container"><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div>
                
                <div class="survey-card active" id="card1">
                    <div class="card-header"><h2><i class="fas fa-user"></i> Contact Information</h2><p>We'd love to stay in touch</p></div>
                    <form id="clientInfoForm">
                        <div class="form-group"><label>Phone Number</label><input type="tel" id="clientPhone" placeholder="Enter your phone number"></div>
                        <div class="form-group"><label>Date of Visit <span class="required">*</span></label><input type="date" id="visitDate" required></div>
                        <div class="form-group"><label>Is this your first visit to LUNAS? <span class="required">*</span></label><select id="clientType" required><option value="">Select an option</option><option value="new">✨ Yes, first time</option><option value="returning">💎 No, I've been here before</option></select></div>
                    </form>
                    <div class="btn-container"><button class="btn btn-secondary" disabled>Previous</button><button class="btn btn-primary" id="next1">Next <i class="fas fa-arrow-right"></i></button></div>
                </div>
                
                <div class="survey-card" id="card2">
                    <div class="card-header"><h2><i class="fas fa-spa"></i> Services Received & Your Experience</h2><p>Click on any service, rate it with stars, and add a comment</p></div>
                    <form id="servicesForm">${servicesHtml}</form>
                    <div class="form-group" style="margin-top:25px; background: linear-gradient(115deg, #FFF9EF, #FFF5E6); padding: 22px; border-radius: 24px;">
                        <label><i class="fas fa-star-of-life" style="color: var(--secondary-color);"></i> 🌟 Shout-out to an amazing employee!</label>
                        <textarea id="employeeShoutoutField" rows="2" placeholder="e.g., Sarah made my nails perfect! Her attention to detail was incredible..." style="resize: vertical;"></textarea>
                        <small style="color: var(--text-light);">Recognize any team member who provided exceptional service</small>
                    </div>
                    <div class="btn-container"><button class="btn btn-secondary" id="prev2"><i class="fas fa-arrow-left"></i> Previous</button><button class="btn btn-primary" id="next2">Next <i class="fas fa-arrow-right"></i></button></div>
                </div>
                
                <div class="survey-card" id="card3">
                    <div class="card-header"><h2><i class="fas fa-star"></i> Service Quality</h2><p>How would you rate the quality of services you received?</p></div>
                    <form id="qualityForm">
                        <div class="form-group"><label>Overall Service Quality <span class="required">*</span></label><div class="rating-container" id="ratingContainer"><div class="rating-option poor" data-value="1"><i class="fas fa-frown"></i><div>Poor</div></div><div class="rating-option fair" data-value="2"><i class="fas fa-meh"></i><div>Fair</div></div><div class="rating-option good" data-value="3"><i class="fas fa-smile"></i><div>Good</div></div><div class="rating-option very-good" data-value="4"><i class="fas fa-smile-beam"></i><div>Very Good</div></div><div class="rating-option excellent" data-value="5"><i class="fas fa-grin-stars"></i><div>Excellent</div></div></div><input type="hidden" id="overallRating" required></div>
                        <div class="form-group"><label>Staff Friendliness & Professionalism</label><select id="staffRating"><option value="">Select rating</option><option value="5">Excellent</option><option value="4">Very Good</option><option value="3">Good</option><option value="2">Fair</option><option value="1">Poor</option></select></div>
                        <div class="form-group"><label>Cleanliness of the Salon/Spa</label><select id="cleanlinessRating"><option value="">Select rating</option><option value="5">Excellent</option><option value="4">Very Good</option><option value="3">Good</option><option value="2">Fair</option><option value="1">Poor</option></select></div>
                        <div class="form-group"><label>Wait Time & Appointment Punctuality</label><select id="waitTimeRating"><option value="">Select rating</option><option value="5">Excellent - No wait</option><option value="4">Very Good - Minimal wait</option><option value="3">Good - Reasonable wait</option><option value="2">Fair - Longer than expected</option><option value="1">Poor - Excessive wait</option></select></div>
                    </form>
                    <div class="btn-container"><button class="btn btn-secondary" id="prev3"><i class="fas fa-arrow-left"></i> Previous</button><button class="btn btn-primary" id="next3">Next <i class="fas fa-arrow-right"></i></button></div>
                </div>
                
                <div class="survey-card" id="card4">
                    <div class="card-header"><h2><i class="fas fa-comment-dots"></i> Your Feedback</h2><p>Please share any additional comments, suggestions, or concerns</p></div>
                    <form id="feedbackForm">
                        <div class="form-group"><label>Type of Feedback <span class="required">*</span></label><select id="feedbackType" required><option value="">Select feedback type</option><option value="compliment">💖 Compliment</option><option value="suggestion">💡 Suggestion</option><option value="complaint">⚠️ Complaint</option></select></div>
                        <div class="form-group"><label>Your Detailed Feedback <span class="required">*</span></label><textarea id="feedbackText" placeholder="Please share your detailed feedback..." required></textarea></div>
                        <div class="form-group"><label>Would you recommend us to friends or family? <span class="required">*</span></label><select id="recommendation" required><option value="">Select an option</option><option value="yes-definitely">Yes, definitely</option><option value="yes-probably">Yes, probably</option><option value="not-sure">Not sure</option><option value="probably-not">Probably not</option><option value="no">No</option></select></div>
                        <div class="form-group"><label>How can we improve our services?</label><textarea id="improvementSuggestions" placeholder="Any suggestions for improvement?"></textarea></div>
                    </form>
                    <div class="btn-container"><button class="btn btn-secondary" id="prev4"><i class="fas fa-arrow-left"></i> Previous</button><button class="btn btn-primary" id="submitSurveyBtn">Submit Survey <i class="fas fa-paper-plane"></i></button></div>
                </div>
                
                <div class="survey-card thank-you-card" id="thankYouCard">
                    <div class="thank-you-icon"><i class="fas fa-heart"></i></div>
                    <h2>Thank You!</h2>
                    <p>Your feedback has been successfully submitted. We truly value your input and will use it to enhance our services.</p>
                    <div class="social-media-section">
                        <div style="font-size:1.3rem; margin-bottom:20px;">Stay Connected With LUNAS</div>
                        <div class="social-icons">
                            <a href="https://www.instagram.com/lunas_parlour?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank" class="social-icon"><div class="social-circle instagram"><i class="fab fa-instagram"></i></div><div style="font-weight:600;">Instagram</div><div style="font-size:0.8rem;">@lunas_parlour</div></a>
                            <a href="https://www.tiktok.com/@lunasbeautyparlour?is_from_webapp=1&sender_device=pc" target="_blank" class="social-icon"><div class="social-circle tiktok"><i class="fab fa-tiktok"></i></div><div style="font-weight:600;">TikTok</div><div style="font-size:0.8rem;">@lunasbeautyparlour</div></a>
                            <a href="https://wa.me/233700422752" target="_blank" class="social-icon"><div class="social-circle whatsapp"><i class="fab fa-whatsapp"></i></div><div style="font-weight:600;">WhatsApp</div><div style="font-size:0.8rem;">0700 422 752</div></a>
                        </div>
                    </div>
                    <button class="btn btn-primary" id="newSurveyBtn" style="max-width:300px; margin:30px auto 0;"><i class="fas fa-redo"></i> Submit Another Feedback</button>
                </div>
            `;
            document.getElementById('surveySection').innerHTML = surveyHTML;
            initializeSurvey();
        }
        
        function initializeSurvey() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('visitDate').value = today;
            document.getElementById('visitDate').max = today;
            
            // Make service cards clickable
            document.querySelectorAll('.service-card-enh').forEach(card => {
                const chk = card.querySelector('.service-check');
                card.addEventListener('click', (e) => {
                    if (e.target.tagName !== 'INPUT' && !e.target.classList.contains('star') && !e.target.classList.contains('svc-comment')) {
                        chk.checked = !chk.checked;
                        if (chk.checked) card.classList.add('selected');
                        else card.classList.remove('selected');
                    }
                });
                chk.addEventListener('change', (e) => { e.stopPropagation(); if (chk.checked) card.classList.add('selected'); else card.classList.remove('selected'); });
            });
            
            // Star ratings
            document.querySelectorAll('.stars-enh').forEach(stars => {
                const starSpans = stars.querySelectorAll('span');
                starSpans.forEach(star => {
                    star.addEventListener('click', function(e) { e.stopPropagation(); const val = parseInt(this.dataset.star); starSpans.forEach((s, i) => { if (i < val) s.classList.add('active'); else s.classList.remove('active'); }); });
                });
            });
            
            // Overall rating
            document.querySelectorAll('#ratingContainer .rating-option').forEach(opt => {

        function submitSurveyData() {
            // Collect per-service ratings
            const serviceRatings = [];
            document.querySelectorAll('.service-check:checked').forEach(cb => {
                let svc = cb.value;
                const card = cb.closest('.service-card-enh');
                const starCount = card.querySelectorAll('.stars-enh span.active').length;
                const comment = card.querySelector('.svc-comment')?.value || '';
                serviceRatings.push({ service: svc, rating: starCount, comment: comment });
            });
            
            const otherVal = document.getElementById('otherServiceField')?.value;
            if (otherVal && serviceRatings.some(s => s.service === 'Other')) {
                const idx = serviceRatings.findIndex(s => s.service === 'Other');
                if (idx !== -1) serviceRatings[idx].service = otherVal;
            }
            
            const surveyData = {
                clientInfo: { phone: document.getElementById('clientPhone').value, visitDate: document.getElementById('visitDate').value, clientType: document.getElementById('clientType').value },
                services: serviceRatings.map(s => s.service),
                ratings: { overall: document.getElementById('overallRating').value, staff: document.getElementById('staffRating').value, cleanliness: document.getElementById('cleanlinessRating').value, waitTime: document.getElementById('waitTimeRating').value },
                feedback: { type: document.getElementById('feedbackType').value, text: document.getElementById('feedbackText').value, recommendation: document.getElementById('recommendation').value, improvements: document.getElementById('improvementSuggestions').value, date: new Date().toISOString() },
                employeeShoutout: document.getElementById('employeeShoutoutField').value,
                servicePerceptions: serviceRatings
            };
            
            const clientId = 'LUN' + Date.now().toString().slice(-8);
            const businessData = JSON.parse(localStorage.getItem('lunasBusinessData'));
            
            businessData.clients.push({
                id: clientId, type: surveyData.clientInfo.clientType, phone: surveyData.clientInfo.phone, visitDate: surveyData.clientInfo.visitDate,
                services: surveyData.services, rating: parseInt(surveyData.ratings.overall),
                staffRating: surveyData.ratings.staff ? parseInt(surveyData.ratings.staff) : null,
                cleanlinessRating: surveyData.ratings.cleanliness ? parseInt(surveyData.ratings.cleanliness) : null,
                waitTimeRating: surveyData.ratings.waitTime ? parseInt(surveyData.ratings.waitTime) : null,
                employeeShoutout: surveyData.employeeShoutout, submissionDate: new Date().toISOString()
            });
            
            if (surveyData.clientInfo.clientType === 'new') businessData.newClientsCount++; else businessData.returningClientsCount++;
            
            surveyData.services.forEach(svc => { const ex = businessData.services.find(s => s.name === svc); if(ex) ex.count++; else businessData.services.push({ name: svc, count: 1 }); });
            surveyData.servicePerceptions.forEach(sp => businessData.servicePerceptions.push({ clientId, service: sp.service, rating: sp.rating, comment: sp.comment }));
            if (surveyData.employeeShoutout) businessData.employeeShoutouts.push({ clientId, employee: surveyData.employeeShoutout, date: new Date().toISOString() });
            businessData.feedback.push({ id: clientId, type: surveyData.feedback.type, text: surveyData.feedback.text, recommendation: surveyData.feedback.recommendation, improvements: surveyData.feedback.improvements, employeeShoutout: surveyData.employeeShoutout, date: new Date().toISOString() });
            
            localStorage.setItem('lunasBusinessData', JSON.stringify(businessData));
            
            document.getElementById('thankYouCard').classList.add('active');
            document.getElementById('card4').classList.remove('active');
            document.getElementById('progressFill').style.width = '100%';
            showToast('✨ Thank you! Your feedback with service ratings has been recorded! ✨');
        }

                <div class="dashboard-card"><div style="display:flex; gap:15px; flex-wrap:wrap;"><button class="btn btn-primary" id="exportCsvBtn"><i class="fas fa-download"></i> Export CSV</button><button class="btn btn-danger" id="deleteAllBtn"><i class="fas fa-trash-alt"></i> Delete All</button><button class="btn btn-secondary" id="refreshDashBtn"><i class="fas fa-sync-alt"></i> Refresh</button></div></div>
                <div style="text-align:center; padding:20px; color:var(--text-light);"><p>LUNAS Analytics | Updated: ${new Date().toLocaleString()}</p></div>
            `;

            document.getElementById('exportCsvBtn').onclick = () => { let csv = "Client,Rating,Shoutout\n"; data.clients.forEach(c => csv += `${c.id},${c.rating},"${c.employeeShoutout || ''}"\n`); const blob = new Blob([csv], {type:'text/csv'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'lunas_data.csv'; a.click(); alert('✅ CSV exported!'); };
            document.getElementById('deleteAllBtn').onclick = () => { if(confirm('⚠️ Delete ALL data? Cannot be undone.')) { localStorage.setItem('lunasBusinessData', JSON.stringify({ clients:[], services:[], feedback:[], servicePerceptions:[], employeeShoutouts:[], newClientsCount:0, returningClientsCount:0, startDate:new Date().toISOString() })); showDashboard(); alert('✅ All data deleted.'); } };
            document.getElementById('refreshDashBtn').onclick = () => showDashboard();
            
            setTimeout(() => {

                const retC = data.clients.filter(c=>c.type==='returning').length;
                new Chart(document.getElementById('clientChart'), { type: 'doughnut', data: { labels: ['New Clients', 'Returning'], datasets: [{ data: [newC, retC], backgroundColor: ['#006850', '#FBB040'] }] }, options: { responsive: true } });
                const topSvcs = data.services.sort((a,b)=>b.count-a.count).slice(0,6);
                if(topSvcs.length) new Chart(document.getElementById('serviceChart'), { type: 'bar', data: { labels: topSvcs.map(s=>s.name), datasets: [{ label: 'Times Received', data: topSvcs.map(s=>s.count), backgroundColor: '#006850', borderRadius: 10 }] }, options: { responsive: true, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } } });
