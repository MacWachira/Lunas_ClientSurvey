<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUNAS Beauty Salon - Client Survey</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #006850;
            --secondary-color: #FBB040;
            --dark-color: #000000;
            --light-color: #FFFFFF;
            --light-bg: #f8f9fa;
            --card-bg: #ffffff;
            --text-dark: #333333;
            --text-light: #666666;
            --border-color: #e0e0e0;
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
            --warning-color: #f39c12;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', 'Segoe UI', sans-serif; }
        body { background-color: var(--light-bg); min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        .main-header { background: linear-gradient(135deg, var(--primary-color), #00875a); padding: 20px 0; margin-bottom: 30px; }
        .header-content { max-width: 1400px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { font-family: 'Playfair Display', serif; font-size: 2.8rem; font-weight: 700; color: white; text-transform: uppercase; }
        .tagline { font-size: 1rem; color: rgba(255,255,255,0.9); letter-spacing: 4px; margin-top: 5px; }
        .nav-buttons { display: flex; gap: 15px; }
        .nav-btn { padding: 12px 25px; background-color: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .nav-btn.active { background-color: var(--secondary-color); color: var(--dark-color); }
        
        #surveySection { display: block; }
        #dashboardSection { display: none; }
        
        .survey-header { text-align: center; margin-bottom: 40px; padding: 30px; background: linear-gradient(135deg, rgba(0,104,80,0.1), rgba(251,176,64,0.1)); border-radius: 16px; }
        .survey-title { font-size: 2.5rem; color: var(--primary-color); margin-bottom: 15px; }
        .survey-subtitle { font-size: 1.1rem; color: var(--text-light); }
        
        .progress-container { margin-bottom: 40px; }
        .progress-bar { height: 6px; background-color: var(--border-color); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(to right, var(--primary-color), var(--secondary-color)); width: 0%; transition: width 0.5s ease; }
        
        .survey-card { background-color: var(--card-bg); border-radius: 16px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-bottom: 30px; border: 1px solid var(--border-color); display: none; }
        .survey-card.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-header { margin-bottom: 30px; }
        .card-header h2 { font-size: 1.8rem; color: var(--primary-color); margin-bottom: 10px; }
        
        .form-group { margin-bottom: 25px; }
        label { display: block; font-weight: 600; margin-bottom: 10px; }
        .required { color: var(--danger-color); }
        input, select, textarea { width: 100%; padding: 16px; border: 2px solid var(--border-color); border-radius: 10px; font-size: 1rem; background: white; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary-color); }
        textarea { min-height: 120px; resize: vertical; }
        
        .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 10px; }
        .service-checkbox { display: flex; align-items: center; padding: 15px; background-color: #f8f9fa; border-radius: 10px; cursor: pointer; border: 2px solid var(--border-color); }
        .service-checkbox:hover { border-color: var(--primary-color); }
        .service-checkbox input { width: auto; margin-right: 12px; }
        
        .rating-container { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .rating-option { flex: 1; min-width: 100px; text-align: center; padding: 15px 10px; background-color: #f8f9fa; border-radius: 10px; cursor: pointer; border: 2px solid var(--border-color); }
        .rating-option.selected { border-color: var(--primary-color); background-color: rgba(0,104,80,0.08); }
        .rating-option i { font-size: 1.5rem; margin-bottom: 6px; display: block; }
        
        .btn-container { display: flex; justify-content: space-between; margin-top: 40px; gap: 20px; }
        .btn { padding: 16px 35px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; flex: 1; }
        .btn-primary { background: linear-gradient(to right, var(--primary-color), #00875a); color: white; }
        .btn-primary:hover { transform: translateY(-3px); }
        .btn-secondary { background-color: #f0f0f0; color: var(--dark-color); }
        
        .thank-you-card { text-align: center; padding: 60px 40px; display: none; }
        .thank-you-card.active { display: block; }
        .thank-you-icon { font-size: 5rem; color: var(--primary-color); margin-bottom: 30px; }
        
        .social-icons { display: flex; justify-content: center; gap: 30px; margin: 30px 0; }
        .social-icon { display: flex; flex-direction: column; align-items: center; text-decoration: none; }
        .social-circle { width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; font-size: 2rem; color: white; }
        .instagram { background: linear-gradient(45deg, #405DE6, #833AB4, #E1306C); }
        .tiktok { background: linear-gradient(45deg, #000000, #25F4EE, #FE2C55); }
        .whatsapp { background: #25D366; }
        
        .dashboard-header { background: linear-gradient(135deg, var(--primary-color), #00875a); color: white; padding: 25px 30px; border-radius: 16px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .logout-btn { background-color: rgba(255,255,255,0.2); padding: 12px 25px; border-radius: 8px; cursor: pointer; color: white; }
        
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 60vh; }
        .login-card { background: white; border-radius: 20px; padding: 50px; width: 100%; max-width: 450px; text-align: center; }
        .login-error { color: var(--danger-color); margin-top: 15px; display: none; }
        
        .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .stat-card { background: white; border-radius: 12px; padding: 25px; display: flex; align-items: center; gap: 20px; }
        .stat-icon { width: 70px; height: 70px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: white; }
        .stat-icon.clients { background: linear-gradient(135deg, var(--primary-color), #00875a); }
        .stat-icon.rating { background: linear-gradient(135deg, var(--secondary-color), #f8a62b); }
        .stat-icon.services { background: linear-gradient(135deg, #3498db, #2980b9); }
        .stat-icon.feedback { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        .stat-info h3 { font-size: 2.5rem; font-weight: 700; line-height: 1; margin-bottom: 5px; }
        
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 30px; margin-bottom: 40px; }
        @media (max-width: 1000px) { .dashboard-grid { grid-template-columns: 1fr; } }
        .dashboard-card { background: white; border-radius: 16px; padding: 30px; }
        .chart-container { height: 300px; margin-top: 20px; }
        .service-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; }
        .service-count { background: rgba(0,104,80,0.1); color: var(--primary-color); padding: 4px 12px; border-radius: 20px; }
        .feedback-item { padding: 18px; border-radius: 10px; margin-bottom: 15px; background: #f8f9fa; border-left: 4px solid var(--primary-color); }
        
        @media (max-width: 768px) { .container { padding: 15px; } .survey-card { padding: 20px; } .services-grid { grid-template-columns: 1fr; } .btn-container { flex-direction: column; } .btn { width: 100%; } }
        
        .sync-status { position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.7); color: white; padding: 5px 10px; border-radius: 15px; font-size: 10px; z-index: 1000; }
    </style>
</head>
<body>
    <div class="sync-status" id="syncStatus">🔄 Connecting...</div>
    
    <div class="main-header">
        <div class="header-content">
            <div><div class="logo">LUNAS</div><div class="tagline">Beauty Salon & Spa</div></div>
            <div class="nav-buttons">
                <button class="nav-btn active" id="navSurvey"><i class="fas fa-clipboard-list"></i> Client Survey</button>
                <button class="nav-btn" id="navDashboard"><i class="fas fa-chart-line"></i> Analytics Dashboard</button>
            </div>
        </div>
    </div>
    
    <div class="container">
        <section id="surveySection"></section>
        <section id="dashboardSection"></section>
    </div>

    <script>
        // ============================================
        // YOUR SUPABASE CREDENTIALS - ALREADY SET
        // ============================================
        const SUPABASE_URL = "https://jxbyfvghztsnvcixnzlr.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4YnlmdmdoenRzbnZjaXhuemxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NTg3NzUsImV4cCI6MjA5NjIzNDc3NX0.2zweytKYGXnvnnXa2W1t48Rb4f08N8qSIrZuw0ZFEAo";
        
        let supabase;
        let dbConnected = false;
        
        async function initSupabase() {
            const statusEl = document.getElementById('syncStatus');
            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                const { error } = await supabase.from('clients').select('id').limit(1);
                if (error) {
                    statusEl.innerHTML = "⚠️ Run SQL in Supabase first";
                    dbConnected = false;
                } else {
                    statusEl.innerHTML = "✅ Cloud ready";
                    dbConnected = true;
                }
            } catch(e) {
                statusEl.innerHTML = "⚠️ Check connection";
                dbConnected = false;
            }
        }
        
        async function saveToSupabase(surveyData, clientId) {
            if (!dbConnected) return false;
            try {
                await supabase.from('clients').insert([{
                    id: clientId,
                    client_type: surveyData.clientInfo.clientType,
                    phone: surveyData.clientInfo.phone,
                    visit_date: surveyData.clientInfo.visitDate,
                    services: JSON.stringify(surveyData.services),
                    rating: parseInt(surveyData.ratings.overall),
                    staff_rating: surveyData.ratings.staff ? parseInt(surveyData.ratings.staff) : null,
                    cleanliness_rating: surveyData.ratings.cleanliness ? parseInt(surveyData.ratings.cleanliness) : null,
                    wait_time_rating: surveyData.ratings.waitTime ? parseInt(surveyData.ratings.waitTime) : null,
                    submission_date: new Date().toISOString()
                }]);
                
                await supabase.from('feedback').insert([{
                    id: clientId + '_fb',
                    client_id: clientId,
                    type: surveyData.feedback.type,
                    text: surveyData.feedback.text,
                    recommendation: surveyData.feedback.recommendation,
                    improvements: surveyData.feedback.improvements,
                    date: new Date().toISOString()
                }]);
                
                for (const svc of surveyData.services) {
                    const { data: existing } = await supabase.from('service_counts').select('count').eq('service', svc);
                    if (existing && existing.length > 0) {
                        await supabase.from('service_counts').update({ count: existing[0].count + 1 }).eq('service', svc);
                    } else {
                        await supabase.from('service_counts').insert([{ service: svc, count: 1 }]);
                    }
                }
                return true;
            } catch(e) {
                console.error(e);
                return false;
            }
        }
        
        // ========== ORIGINAL WORKING SURVEY CODE ==========
        if (!localStorage.getItem('lunasBusinessData')) {
            localStorage.setItem('lunasBusinessData', JSON.stringify({
                clients: [], services: [], feedback: [], newClientsCount: 0, returningClientsCount: 0, startDate: new Date().toISOString()
            }));
        }
        
        function switchSection(section) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if (section === 'survey') {
                document.getElementById('navSurvey').classList.add('active');
                document.getElementById('surveySection').style.display = 'block';
                document.getElementById('dashboardSection').style.display = 'none';
                loadSurveyTool();
            } else {
                document.getElementById('navDashboard').classList.add('active');
                document.getElementById('surveySection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                loadDashboard();
            }
        }
        
        function loadSurveyTool() {
            const surveyHTML = `
                <div class="survey-header">
                    <h1 class="survey-title">Client Satisfaction Survey</h1>
                    <p class="survey-subtitle">Thank you for choosing LUNAS. Your feedback helps us improve.</p>
                </div>
                <div class="progress-container"><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div>
                
                <div class="survey-card active" id="card1">
                    <div class="card-header"><h2><i class="fas fa-user"></i> Contact Information</h2></div>
                    <form id="clientInfoForm">
                        <div class="form-group"><label>Phone Number</label><input type="tel" id="clientPhone"></div>
                        <div class="form-group"><label>Date of Visit <span class="required">*</span></label><input type="date" id="visitDate" required></div>
                        <div class="form-group"><label>Is this your first visit? <span class="required">*</span></label><select id="clientType" required><option value="">Select</option><option value="new">Yes, first time</option><option value="returning">No, I've been here before</option></select></div>
                    </form>
                    <div class="btn-container"><button class="btn btn-secondary" disabled>Previous</button><button class="btn btn-primary" id="next1">Next →</button></div>
                </div>
                
                <div class="survey-card" id="card2">
                    <div class="card-header"><h2><i class="fas fa-spa"></i> Services Received</h2><p>Select all that apply</p></div>
                    <form id="servicesForm">
                        <div class="services-grid">
                            \${["Gel Polish","Tips","Builder Gel","Gumgel Overlay","Gumgel Sculpting","Pedicure","Manicure","Piercing","Wig Installation and Styling","Wig Laundry","Eyelash Extension","Waxing","Facial","Massage","Braiding","Wash and Blow","Brow Shaping","Dreadlock Installation/Retouch","Flat Ironing","Other"].map(s => `<label class="service-checkbox"><input type="checkbox" name="service" value="\${s}"><span>\${s}</span></label>`).join('')}
                        </div>
                        <div class="form-group" style="margin-top:25px;"><label>If "Other", please specify:</label><input type="text" id="otherService"></div>
                    </form>
                    <div class="btn-container"><button class="btn btn-secondary" id="prev2">← Back</button><button class="btn btn-primary" id="next2">Next →</button></div>
                </div>
                
                <div class="survey-card" id="card3">
                    <div class="card-header"><h2><i class="fas fa-star"></i> Service Quality</h2></div>
                    <form id="qualityForm">
                        <div class="form-group"><label>Overall Service Quality <span class="required">*</span></label><div class="rating-container"><div class="rating-option poor" data-value="1"><i class="fas fa-frown"></i>Poor</div><div class="rating-option fair" data-value="2"><i class="fas fa-meh"></i>Fair</div><div class="rating-option good" data-value="3"><i class="fas fa-smile"></i>Good</div><div class="rating-option very-good" data-value="4"><i class="fas fa-smile-beam"></i>Very Good</div><div class="rating-option excellent" data-value="5"><i class="fas fa-grin-stars"></i>Excellent</div></div><input type="hidden" id="overallRating" required></div>
                        <div class="form-group"><label>Staff Friendliness</label><select id="staffRating"><option value="">Select</option><option value="5">Excellent</option><option value="4">Very Good</option><option value="3">Good</option><option value="2">Fair</option><option value="1">Poor</option></select></div>
                        <div class="form-group"><label>Cleanliness</label><select id="cleanlinessRating"><option value="">Select</option><option value="5">Excellent</option><option value="4">Very Good</option><option value="3">Good</option><option value="2">Fair</option><option value="1">Poor</option></select></div>
                        <div class="form-group"><label>Wait Time</label><select id="waitTimeRating"><option value="">Select</option><option value="5">Excellent - No wait</option><option value="4">Very Good - Minimal</option><option value="3">Good - Reasonable</option><option value="2">Fair - Longer</option><option value="1">Poor - Excessive</option></select></div>
                    </form>
                    <div class="btn-container"><button class="btn btn-secondary" id="prev3">← Back</button><button class="btn btn-primary" id="next3">Next →</button></div>
                </div>
                
                <div class="survey-card" id="card4">
                    <div class="card-header"><h2><i class="fas fa-comment-dots"></i> Your Feedback</h2></div>
                    <form id="feedbackForm">
                        <div class="form-group"><label>Feedback Type <span class="required">*</span></label><select id="feedbackType" required><option value="">Select</option><option value="compliment">Compliment</option><option value="suggestion">Suggestion</option><option value="complaint">Complaint</option></select></div>
                        <div class="form-group"><label>Your Feedback <span class="required">*</span></label><textarea id="feedbackText" required></textarea></div>
                        <div class="form-group"><label>Would you recommend us? <span class="required">*</span></label><select id="recommendation" required><option value="">Select</option><option value="yes-definitely">Yes, definitely</option><option value="yes-probably">Yes, probably</option><option value="not-sure">Not sure</option><option value="probably-not">Probably not</option><option value="no">No</option></select></div>
                        <div class="form-group"><label>How can we improve?</label><textarea id="improvementSuggestions"></textarea></div>
                    </form>
                    <div class="btn-container"><button class="btn btn-secondary" id="prev4">← Back</button><button class="btn btn-primary" id="submitSurvey">Submit Survey →</button></div>
                </div>
                
                <div class="survey-card thank-you-card" id="thankYouCard">
                    <div class="thank-you-icon"><i class="fas fa-heart"></i></div>
                    <h2>Thank You!</h2>
                    <p>Your feedback has been submitted successfully.</p>
                    <div class="social-icons">
                        <a href="https://www.instagram.com/lunas_parlour" target="_blank" class="social-icon"><div class="social-circle instagram"><i class="fab fa-instagram"></i></div><div>Instagram</div></a>
                        <a href="https://www.tiktok.com/@lunasbeautyparlour" target="_blank" class="social-icon"><div class="social-circle tiktok"><i class="fab fa-tiktok"></i></div><div>TikTok</div></a>
                        <a href="https://wa.me/233700422752" target="_blank" class="social-icon"><div class="social-circle whatsapp"><i class="fab fa-whatsapp"></i></div><div>WhatsApp</div></a>
                    </div>
                    <button class="btn btn-primary" id="newSurvey" style="max-width:300px; margin:30px auto 0;">Submit Another</button>
                </div>
            `;
            document.getElementById('surveySection').innerHTML = surveyHTML;
            initializeSurvey();
        }
        
        function initializeSurvey() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('visitDate').value = today;
            document.getElementById('visitDate').max = today;
            
            document.querySelectorAll('.rating-option').forEach(opt => {
                opt.onclick = function() {
                    document.getElementById('overallRating').value = this.dataset.value;
                    document.querySelectorAll('.rating-option').forEach(o => o.classList.remove('selected'));
                    this.classList.add('selected');
                };
            });
            
            let current = 1;
            const showCard = (n) => {
                document.querySelectorAll('.survey-card').forEach(c => c.classList.remove('active'));
                document.getElementById(`card${n}`).classList.add('active');
                document.getElementById('progressFill').style.width = `\${((n-1)/4)*100}%`;
            };
            
            document.getElementById('next1').onclick = () => { if(document.getElementById('clientInfoForm').checkValidity()) showCard(2); else document.getElementById('clientInfoForm').reportValidity(); };
            document.getElementById('next2').onclick = () => { if(document.querySelectorAll('input[name="service"]:checked').length > 0) showCard(3); else alert('Please select at least one service.'); };
            document.getElementById('next3').onclick = () => { if(document.getElementById('overallRating').value) showCard(4); else alert('Please rate overall service quality.'); };
            document.getElementById('prev2').onclick = () => showCard(1);
            document.getElementById('prev3').onclick = () => showCard(2);
            document.getElementById('prev4').onclick = () => showCard(3);
            
            document.getElementById('submitSurvey').onclick = async function() {
                if (document.getElementById('feedbackForm').checkValidity()) {
                    await submitSurveyData();
                } else {
                    document.getElementById('feedbackForm').reportValidity();
                }
            };
            
            document.getElementById('newSurvey').onclick = () => location.reload();
        }
        
        async function submitSurveyData() {
            const surveyData = {
                clientInfo: {
                    phone: document.getElementById('clientPhone').value || null,
                    visitDate: document.getElementById('visitDate').value,
                    clientType: document.getElementById('clientType').value
                },
                services: Array.from(document.querySelectorAll('input[name="service"]:checked')).map(cb => {
                    if (cb.value === 'Other') return document.getElementById('otherService').value || cb.value;
                    return cb.value;
                }),
                ratings: {
                    overall: document.getElementById('overallRating').value,
                    staff: document.getElementById('staffRating').value || null,
                    cleanliness: document.getElementById('cleanlinessRating').value || null,
                    waitTime: document.getElementById('waitTimeRating').value || null
                },
                feedback: {
                    type: document.getElementById('feedbackType').value,
                    text: document.getElementById('feedbackText').value,
                    recommendation: document.getElementById('recommendation').value,
                    improvements: document.getElementById('improvementSuggestions').value || null,
                    date: new Date().toISOString()
                }
            };
            
            const clientId = 'LUN' + Date.now().toString().slice(-8);
            
            // Save to cloud
            await saveToSupabase(surveyData, clientId);
            
            // Save to local backup
            const businessData = JSON.parse(localStorage.getItem('lunasBusinessData'));
            businessData.clients.push({
                id: clientId, type: surveyData.clientInfo.clientType, phone: surveyData.clientInfo.phone,
                visitDate: surveyData.clientInfo.visitDate, services: surveyData.services,
                rating: parseInt(surveyData.ratings.overall),
                staffRating: surveyData.ratings.staff ? parseInt(surveyData.ratings.staff) : null,
                cleanlinessRating: surveyData.ratings.cleanliness ? parseInt(surveyData.ratings.cleanliness) : null,
                waitTimeRating: surveyData.ratings.waitTime ? parseInt(surveyData.ratings.waitTime) : null,
                submissionDate: new Date().toISOString()
            });
            if (surveyData.clientInfo.clientType === 'new') businessData.newClientsCount++;
            else businessData.returningClientsCount++;
            surveyData.services.forEach(svc => {
                const ex = businessData.services.find(s => s.name === svc);
                if (ex) ex.count++;
                else businessData.services.push({ name: svc, count: 1 });
            });
            businessData.feedback.push({
                id: clientId, type: surveyData.feedback.type, text: surveyData.feedback.text,
                recommendation: surveyData.feedback.recommendation, improvements: surveyData.feedback.improvements,
                date: new Date().toISOString()
            });
            localStorage.setItem('lunasBusinessData', JSON.stringify(businessData));
            
            document.getElementById('thankYouCard').classList.add('active');
            document.getElementById('card4').classList.remove('active');
            document.getElementById('progressFill').style.width = '100%';
            alert('Thank you for your feedback!');
        }
        
        // Dashboard (your original working code)
        function loadDashboard() {
            if (localStorage.getItem('lunasLoggedIn') !== 'true') showLogin();
            else showDashboard();
        }
        
        function showLogin() {
            document.getElementById('dashboardSection').innerHTML = `
                <div class="login-container"><div class="login-card"><i class="fas fa-chart-line" style="font-size:3rem; color:var(--primary-color);"></i><h2>LUNAS Analytics</h2><div class="form-group"><input type="text" id="username" placeholder="Username"></div><div class="form-group"><input type="password" id="password" placeholder="Password"></div><button class="btn btn-primary" id="loginBtn">Login</button><div class="login-error" id="loginError">Username: admin | Password: lunas2025</div></div></div>`;
            document.getElementById('loginBtn').onclick = () => {
                if (document.getElementById('username').value === 'admin' && document.getElementById('password').value === 'lunas2025') {
                    localStorage.setItem('lunasLoggedIn', 'true');
                    showDashboard();
                } else document.getElementById('loginError').style.display = 'block';
            };
        }
        
        function showDashboard() {
            const data = JSON.parse(localStorage.getItem('lunasBusinessData'));
            const avgRating = data.clients.length ? (data.clients.reduce((a,b)=>a+(b.rating||0),0)/data.clients.length).toFixed(1) : '0.0';
            
            document.getElementById('dashboardSection').innerHTML = `
                <div class="dashboard-header"><div><h1>Analytics Dashboard</h1><p>Client Feedback Insights</p></div><button class="logout-btn" id="logoutBtn">Logout</button></div>
                <div class="stats-container">
                    <div class="stat-card"><div class="stat-icon clients"><i class="fas fa-users"></i></div><div class="stat-info"><h3>\s{data.clients.length}</h3><p>Total Clients</p></div></div>
                    <div class="stat-card"><div class="stat-icon rating"><i class="fas fa-star"></i></div><div class="stat-info"><h3>\s{avgRating}</h3><p>Average Rating</p></div></div>
                    <div class="stat-card"><div class="stat-icon services"><i class="fas fa-spa"></i></div><div class="stat-info"><h3>\s{data.clients.reduce((a,c)=>a+(c.services?.length||0),0)}</h3><p>Services Used</p></div></div>
                    <div class="stat-card"><div class="stat-icon feedback"><i class="fas fa-comments"></i></div><div class="stat-info"><h3>\s{data.feedback.length}</h3><p>Feedbacks</p></div></div>
                </div>
                <div class="dashboard-card"><h2>Recent Feedback</h2>\s{data.feedback.slice(-5).reverse().map(f => `<div class="feedback-item"><strong>\s{f.type}</strong><br>\s{f.text.substring(0,100)}<br><small>👍 \s{f.recommendation}</small></div>`).join('') || '<p>No feedback yet</p>'}</div>
                <div class="dashboard-card"><button class="btn btn-primary" id="exportBtn">Export CSV</button><button class="btn btn-danger" id="deleteBtn" style="margin-left:15px;">Delete All</button></div>
            `;
            document.getElementById('logoutBtn').onclick = () => { localStorage.removeItem('lunasLoggedIn'); loadDashboard(); };
            document.getElementById('exportBtn').onclick = () => { let csv = "Client,Rating\n"; data.clients.forEach(c => csv += `\s{c.id},\s{c.rating}\n`); const blob = new Blob([csv],{type:'text/csv'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'lunas_data.csv'; a.click(); alert('Exported!'); };
            document.getElementById('deleteBtn').onclick = () => { if(confirm('Delete all data?')) { localStorage.setItem('lunasBusinessData', JSON.stringify({ clients:[], services:[], feedback:[], newClientsCount:0, returningClientsCount:0, startDate:new Date().toISOString() })); loadDashboard(); alert('Deleted.'); } };
        }
        
        // This ensures the page finishes rendering before any logic runs
        window.onload = function() {
            document.getElementById('navSurvey').onclick = () => switchSection('survey');
            document.getElementById('navDashboard').onclick = () => switchSection('dashboard');
            
            initSupabase().then(() => {
                loadSurveyTool();
            });
        };
    </script>
</body>
</html>
