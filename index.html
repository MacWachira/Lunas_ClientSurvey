<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LUNAS Beauty Salon - Client Survey & Analytics System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --primary-color: #006850;
            --secondary-color: #FBB040;
            --dark-color: #000000;
            --light-color: #FFFFFF;
            --light-bg: #f8f9fa;
            --card-bg: #ffffff;
            --text-dark: #333333;
            --text-light: #666666;
            --border-color: #e0e0e0;
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
            --warning-color: #f39c12;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', 'Segoe UI', sans-serif; }
        body { background: linear-gradient(145deg, #f0f4f8 0%, #e8edf2 100%); min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; width: 100%; }
        
        .main-header { background: linear-gradient(135deg, var(--primary-color), #00875a); padding: 20px 0; margin-bottom: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .header-content { max-width: 1400px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .logo { font-family: 'Playfair Display', serif; font-size: 2.5rem; font-weight: 700; color: white; letter-spacing: 2px; text-transform: uppercase; }
        .tagline { font-size: 0.9rem; color: rgba(255,255,255,0.9); letter-spacing: 4px; text-transform: uppercase; margin-top: 5px; }
        .nav-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
        .nav-btn { padding: 10px 20px; background-color: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 40px; font-weight: 600; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .nav-btn:hover { background-color: rgba(255,255,255,0.25); transform: translateY(-2px); }
        .nav-btn.active { background-color: var(--secondary-color); color: var(--dark-color); border-color: transparent; }
        
        #surveySection { display: block; }
        #dashboardSection { display: none; }
        
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 10000; backdrop-filter: blur(5px); }
        .login-container { background: white; border-radius: 32px; padding: 40px; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.3); }
        .login-container h2 { color: var(--primary-color); margin-bottom: 10px; }
        .login-container input { width: 100%; padding: 14px; margin: 12px 0; border: 2px solid var(--border-color); border-radius: 50px; font-size: 1rem; }
        .login-container input:focus { outline: none; border-color: var(--primary-color); }
        .login-error { color: var(--danger-color); margin-top: 10px; display: none; font-size: 0.9rem; }
        .logout-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); padding: 10px 22px; border-radius: 40px; font-weight: 600; cursor: pointer; color: white; transition: 0.2s; }
        .logout-btn:hover { background: rgba(255,255,255,0.3); transform: translateY(-2px); }
        
        .survey-header { text-align: center; margin-bottom: 40px; padding: 25px 20px; background: linear-gradient(135deg, rgba(0,104,80,0.08), rgba(251,176,64,0.08)); border-radius: 28px; }
        .survey-title { font-size: 2rem; color: var(--primary-color); margin-bottom: 15px; }
        .survey-subtitle { font-size: 1rem; color: var(--text-light); max-width: 700px; margin: 0 auto; }
        
        .progress-container { margin-bottom: 35px; }
        .progress-bar { height: 8px; background-color: var(--border-color); border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(to right, var(--primary-color), var(--secondary-color)); width: 0%; transition: width 0.5s ease; border-radius: 10px; }
        
        .survey-card { background-color: var(--card-bg); border-radius: 32px; padding: 30px 24px; box-shadow: 0 20px 35px -12px rgba(0,0,0,0.12); margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.6); display: none; }
        .survey-card.active { display: block; animation: fadeInUp 0.5s ease; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-header { margin-bottom: 30px; border-left: 4px solid var(--secondary-color); padding-left: 20px; }
        .card-header h2 { font-size: 1.6rem; color: var(--primary-color); margin-bottom: 8px; }
        
        .form-group { margin-bottom: 25px; }
        label { display: block; font-weight: 600; margin-bottom: 10px; color: var(--dark-color); }
        .required { color: var(--danger-color); }
        input, select, textarea { width: 100%; padding: 14px 18px; border: 2px solid var(--border-color); border-radius: 20px; font-size: 1rem; transition: all 0.3s; background: white; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 4px rgba(0,104,80,0.1); }
        
        .employee-choice-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; margin-top: 12px; }
        .employee-option { background: #f9fafc; border: 2px solid var(--border-color); border-radius: 60px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: all 0.2s ease; }
        .employee-option input { width: 20px; height: 20px; margin: 0; cursor: pointer; accent-color: var(--primary-color); }
        .employee-option label { margin: 0; cursor: pointer; font-weight: 500; font-size: 1rem; flex: 1; color: var(--text-dark); }
        .employee-option:hover { background: #fff3e0; border-color: var(--secondary-color); transform: translateY(-2px); }
        .employee-option.selected { background: linear-gradient(115deg, #eef9f5, #e6f3ee); border-color: var(--primary-color); }
        
        .services-enhanced { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin: 20px 0; }
        .service-card-enh { background: #fafcff; border-radius: 20px; border: 2px solid var(--border-color); transition: all 0.25s ease; overflow: hidden; cursor: pointer; }
        .service-card-enh:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        .service-card-enh.selected { border-color: var(--primary-color); background: white; box-shadow: 0 8px 20px rgba(0,104,80,0.12); }
        .service-header-enh { display: flex; align-items: center; padding: 14px 16px; }
        .service-header-enh input { width: 22px; height: 22px; margin-right: 14px; cursor: pointer; accent-color: var(--primary-color); }
        .service-header-enh span { font-weight: 600; font-size: 0.95rem; flex: 1; cursor: pointer; }
        .service-rating-enh { padding: 0 16px 16px 16px; background: white; border-top: 1px dashed var(--border-color); display: none; }
        .service-card-enh.selected .service-rating-enh { display: block; animation: slideDown 0.25s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .stars-enh { display: flex; gap: 6px; margin: 12px 0 10px 0; flex-wrap: wrap; }
        .stars-enh span { font-size: 1.6rem; cursor: pointer; color: #cbd5e1; transition: 0.1s; }
        .stars-enh span.active { color: var(--secondary-color); text-shadow: 0 0 3px rgba(251,176,64,0.4); }
        .comment-enh input { width: 100%; padding: 10px 14px; border-radius: 40px; border: 1px solid var(--border-color); font-size: 0.85rem; }
        
        .rating-container { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin: 15px 0; }
        .rating-option { flex: 1; min-width: 90px; text-align: center; padding: 12px 8px; background: #f8f9fa; border-radius: 50px; cursor: pointer; border: 2px solid var(--border-color); font-weight: 500; transition: 0.2s; }
        .rating-option.selected { background: var(--primary-color); color: white; border-color: var(--primary-color); }
        .rating-option i { font-size: 1.3rem; margin-bottom: 4px; display: block; }
        
        .btn-container { display: flex; justify-content: space-between; margin-top: 40px; gap: 20px; flex-wrap: wrap; }
        .btn { padding: 14px 28px; border: none; border-radius: 50px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; flex: 1; min-width: 140px; }
        .btn-primary { background: linear-gradient(135deg, var(--primary-color), #00875a); color: white; box-shadow: 0 5px 15px rgba(0,104,80,0.2); }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,104,80,0.3); }
        .btn-secondary { background: #f0f0f0; color: var(--dark-color); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: #e0e0e0; transform: translateY(-2px); }
        .btn-danger { background: linear-gradient(135deg, var(--danger-color), #c0392b); color: white; }
        
        .thank-you-card { text-align: center; padding: 50px 30px; display: none; }
        .thank-you-card.active { display: block; }
        .thank-you-icon { font-size: 4.5rem; color: var(--primary-color); margin-bottom: 25px; }
        .social-icons { display: flex; justify-content: center; gap: 25px; flex-wrap: wrap; margin: 30px 0; }
        .social-icon { display: flex; flex-direction: column; align-items: center; text-decoration: none; transition: 0.3s; }
        .social-icon:hover { transform: translateY(-5px); }
        .social-circle { width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; font-size: 1.8rem; color: white; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .instagram { background: linear-gradient(45deg, #405DE6, #833AB4, #E1306C); }
        .tiktok { background: linear-gradient(45deg, #000000, #25F4EE, #FE2C55); }
        .whatsapp { background: linear-gradient(45deg, #25D366, #128C7E); }
        
        .dashboard-header { background: linear-gradient(135deg, var(--primary-color), #00875a); border-radius: 28px; padding: 24px 28px; color: white; display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; flex-wrap: wrap; gap: 15px; }
        .refresh-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); padding: 10px 22px; border-radius: 40px; font-weight: 600; cursor: pointer; color: white; transition: 0.2s; }
        .refresh-btn:hover { background: rgba(255,255,255,0.3); transform: translateY(-2px); }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 22px; margin-bottom: 40px; }
        .stat-card { background: white; border-radius: 24px; padding: 22px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); transition: 0.3s; border-bottom: 5px solid var(--secondary-color); }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .stat-number { font-size: 2.4rem; font-weight: 800; color: var(--primary-color); line-height: 1; margin-bottom: 5px; }
        .stat-label { color: var(--text-light); font-weight: 500; }
        
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 28px; margin-bottom: 35px; }
        @media (max-width: 1000px) { .dashboard-grid { grid-template-columns: 1fr; } .survey-card { padding: 24px 20px; } .logo { font-size: 2rem; } }
        @media (max-width: 550px) { .stats-grid { grid-template-columns: 1fr; } .employee-choice-grid { grid-template-columns: 1fr; } .btn-container { flex-direction: column; } .btn { width: 100%; } }
        
        .dashboard-card { background: white; border-radius: 28px; padding: 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); transition: 0.2s; }
        .chart-container { height: 260px; margin-top: 15px; position: relative; }
        .feedback-item { padding: 18px; border-radius: 20px; margin-bottom: 14px; background: #fafcff; border-left: 5px solid var(--primary-color); transition: 0.2s; }
        .feedback-item:hover { transform: translateX(5px); }
        .per-service-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eef2f8; flex-wrap: wrap; gap: 8px; }
        .shoutout-item { background: linear-gradient(115deg, #fef9e6, #fff4e0); border-radius: 18px; padding: 14px; margin-bottom: 12px; border-left: 4px solid var(--secondary-color); transition: 0.2s; }
        .shoutout-item:hover { transform: translateX(5px); }
        
        .toast-success { position: fixed; bottom: 30px; right: 30px; background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; padding: 14px 24px; border-radius: 50px; display: flex; align-items: center; gap: 12px; font-weight: 600; z-index: 1000; transform: translateX(400px); transition: 0.3s; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
        .toast-success.show { transform: translateX(0); }
        
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 2000; flex-direction: column; color: white; }
        .loading-overlay.active { display: flex; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.3); border-top-color: var(--secondary-color); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .empty-state { text-align: center; padding: 40px; color: var(--text-light); }
        .sync-status { background: #e8f5e8; padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; color: var(--primary-color); display: inline-block; }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div>Loading data from cloud...</div>
    </div>

    <div class="main-header">
        <div class="header-content">
            <div><div class="logo">LUNAS</div><div class="tagline">Beauty Salon & Spa</div></div>
            <div class="nav-buttons">
                <button class="nav-btn active" id="navSurvey"><i class="fas fa-clipboard-list"></i> Client Survey</button>
                <button class="nav-btn" id="navDashboard"><i class="fas fa-chart-line"></i> Analytics Dashboard</button>
            </div>
        </div>
    </div>
    
    <div class="container">
        <section id="surveySection"></section>
        <section id="dashboardSection"></section>
    </div>

    <div id="toastMsg" class="toast-success"><i class="fas fa-check-circle"></i><span>Thank you!</span><i class="fas fa-times-circle" style="margin-left: 12px;"></i></div>

    <script>
        // Your Google Apps Script URL
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzY4YUlhufM3vZodPWk_IZDXjLZWM2wzmhAVWH8bkl3iUsLjL-JMd_ZKpUgnUTqSiHB/exec";
        
        const EMPLOYEES = ["Sharon", "Bridgit", "Terry", "Njeri", "Risper", "Cynthia"];
        let isLoggedIn = false;
        
        function showToast(msg) {
            const toast = document.getElementById('toastMsg');
            toast.querySelector('span').textContent = msg || '✨ Thank you for your feedback! ✨';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }
        
        function showLoading() { document.getElementById('loadingOverlay').classList.add('active'); }
        function hideLoading() { document.getElementById('loadingOverlay').classList.remove('active'); }
        
        document.getElementById('navSurvey').onclick = () => {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('navSurvey').classList.add('active');
            document.getElementById('surveySection').style.display = 'block';
            document.getElementById('dashboardSection').style.display = 'none';
            loadSurveyTool();
        };
        
        document.getElementById('navDashboard').onclick = () => {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('navDashboard').classList.add('active');
            document.getElementById('surveySection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
            checkDashboardAccess();
        };
        
        function checkDashboardAccess() {
            if (!isLoggedIn) {
                showLoginModal();
            } else {
                loadDashboard();
            }
        }
        
        function showLoginModal() {
            const modalHtml = `
                <div class="login-overlay" id="loginOverlay">
                    <div class="login-container">
                        <i class="fas fa-chart-line" style="font-size: 3rem; color: var(--primary-color);"></i>
                        <h2>Admin Access Required</h2>
                        <p style="color: var(--text-light); margin-bottom: 20px;">Enter credentials to view analytics</p>
                        <input type="text" id="loginUsername" placeholder="Username" autocomplete="off">
                        <input type="password" id="loginPassword" placeholder="Password">
                        <button class="btn btn-primary" id="loginSubmitBtn" style="width: 100%;">Login to Dashboard</button>
                        <div class="login-error" id="loginErrorMsg">Invalid username or password</div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            
            document.getElementById('loginSubmitBtn').onclick = () => {
                const username = document.getElementById('loginUsername').value;
                const password = document.getElementById('loginPassword').value;
                
                if (username === 'admin' && password === 'lunas@2026') {
                    isLoggedIn = true;
                    document.getElementById('loginOverlay').remove();
                    loadDashboard();
                } else {
                    document.getElementById('loginErrorMsg').style.display = 'block';
                }
            };
            
            document.getElementById('loginPassword').onkeypress = (e) => {
                if (e.key === 'Enter') document.getElementById('loginSubmitBtn').click();
            };
        }
        
        async function submitToGoogleSheets(surveyData) {
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(surveyData)
                });
                return true;
            } catch (error) {
                console.error("Google Sheets submission failed:", error);
                return false;
            }
        }
        
        async function fetchAllSubmissions() {
            try {
                const url = GOOGLE_SCRIPT_URL + '?t=' + Date.now();
                const response = await fetch(url, { method: 'GET' });
                if (response.ok) {
                    const result = await response.json();
                    if (result.success && result.data) {
                        return result.data;
                    }
                }
            } catch (error) {
                console.error("Failed to fetch from Google Sheets:", error);
            }
            return [];
        }
        
        function loadSurveyTool() {
            let servicesHtml = `<div class="services-enhanced">`;
            const SERVICES = ["Gel Polish","Tips","Builder Gel","Gumgel Overlay","Gumgel Sculpting","Pedicure","Manicure","Piercing","Wig Installation","Wig Laundry","Eyelash Extension","Waxing","Facial","Massage","Braiding","Wash and Blow","Brow Shaping","Dreadlock","Flat Ironing","Other"];
            
            SERVICES.forEach(svc => {
                servicesHtml += `
                    <div class="service-card-enh" data-svc="${svc}">
                        <div class="service-header-enh">
                            <input type="checkbox" class="service-check" value="${svc}">
                            <span>${svc}</span>
                        </div>
                        <div class="service-rating-enh">
                            <div class="stars-enh">${[1,2,3,4,5].map(s => `<span data-star="${s}">★</span>`).join('')}</div>
                            <div class="comment-enh"><input type="text" class="svc-comment" placeholder="Your experience with ${svc}..."></div>
                        </div>
                    </div>
                `;
            });
            servicesHtml += `</div><div class="form-group"><label for="otherServiceField">If "Other", please specify:</label><input type="text" id="otherServiceField" placeholder="Describe the service"></div>`;
            
            let employeeHtml = `<div class="employee-choice-grid" id="employeeChoiceGrid">`;
            EMPLOYEES.forEach(emp => {
                employeeHtml += `
                    <div class="employee-option" data-emp="${emp}">
                        <input type="radio" name="employeeShoutoutRadio" value="${emp}" id="emp_${emp.replace(/\s/g,'')}">
                        <label for="emp_${emp.replace(/\s/g,'')}"><i class="fas fa-user-check" style="color: var(--secondary-color); margin-right: 6px;"></i>${emp}</label>
                    </div>
                `;
            });
            employeeHtml += `</div><div class="shoutout-note"><i class="fas fa-star" style="color: var(--secondary-color);"></i> <span>Select an exceptional team member who made your visit memorable</span></div>`;
            
            const surveyHTML = `
                <div class="survey-header"><h1 class="survey-title">✨ Client Satisfaction Survey ✨</h1><p class="survey-subtitle">Thank you for choosing LUNAS. Your feedback helps us improve.</p></div>
                <div class="progress-container"><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div>
                
                <div class="survey-card active" id="card1">
                    <div class="card-header"><h2><i class="fas fa-user"></i> Contact Information</h2><p>We'd love to stay in touch (optional)</p></div>
                    <form id="clientInfoForm">
                        <div class="form-group"><label>Phone Number <span style="color: var(--text-light);">(Optional)</span></label><input type="tel" id="clientPhone" placeholder="Enter your phone number (optional)"></div>
                        <div class="form-group"><label>Date of Visit <span class="required">*</span></label><input type="date" id="visitDate" required></div>
                        <div class="form-group"><label>Is this your first visit to LUNAS? <span class="required">*</span></label><select id="clientType" required><option value="">Select an option</option><option value="new">✨ Yes, first time</option><option value="returning">💎 No, I've been here before</option></select></div>
                    </form>
                    <div class="btn-container"><button class="btn btn-secondary" disabled>Previous</button><button class="btn btn-primary" id="next1">Next <i class="fas fa-arrow-right"></i></button></div>
                </div>
                
                <div class="survey-card" id="card2">
                    <div class="card-header"><h2><i class="fas fa-spa"></i> Services Received & Your Experience</h2><p>Click on any service, rate it with stars, and add a comment</p></div>
                    <form id="servicesForm">${servicesHtml}</form>
                    <div class="form-group" style="margin-top:25px; background: linear-gradient(115deg, #FFF9EF, #FFF5E6); padding: 22px; border-radius: 24px;">
                        <label><i class="fas fa-star-of-life" style="color: var(--secondary-color);"></i> 🌟 Shout-out to an amazing employee!</label>
                        ${employeeHtml}
                        <textarea id="employeeShoutoutFieldCustom" rows="2" placeholder="Or write your own shoutout message here..." style="margin-top:12px;"></textarea>
                    </div>
                    <div class="btn-container"><button class="btn btn-secondary" id="prev2"><i class="fas fa-arrow-left"></i> Previous</button><button class="btn btn-primary" id="next2">Next <i class="fas fa-arrow-right"></i></button></div>
                </div>
                
                <div class="survey-card" id="card3">
                    <div class="card-header"><h2><i class="fas fa-star"></i> Service Quality</h2><p>How would you rate the quality of services you received?</p></div>
                    <form id="qualityForm">
                        <div class="form-group"><label>Overall Service Quality <span class="required">*</span></label><div class="rating-container" id="ratingContainer"><div class="rating-option poor" data-value="1"><i class="fas fa-frown"></i><div>Poor</div></div><div class="rating-option fair" data-value="2"><i class="fas fa-meh"></i><div>Fair</div></div><div class="rating-option good" data-value="3"><i class="fas fa-smile"></i><div>Good</div></div><div class="rating-option very-good" data-value="4"><i class="fas fa-smile-beam"></i><div>Very Good</div></div><div class="rating-option excellent" data-value="5"><i class="fas fa-grin-stars"></i><div>Excellent</div></div></div><input type="hidden" id="overallRating" required></div>
                        <div class="form-group"><label>Staff Friendliness & Professionalism</label><select id="staffRating"><option value="">Select rating</option><option value="5">Excellent</option><option value="4">Very Good</option><option value="3">Good</option><option value="2">Fair</option><option value="1">Poor</option></select></div>
                        <div class="form-group"><label>Cleanliness</label><select id="cleanlinessRating"><option value="">Select rating</option><option value="5">Excellent</option><option value="4">Very Good</option><option value="3">Good</option><option value="2">Fair</option><option value="1">Poor</option></select></div>
                        <div class="form-group"><label>Wait Time</label><select id="waitTimeRating"><option value="">Select rating</option><option value="5">Excellent</option><option value="4">Very Good</option><option value="3">Good</option><option value="2">Fair</option><option value="1">Poor</option></select></div>
                    </form>
                    <div class="btn-container"><button class="btn btn-secondary" id="prev3"><i class="fas fa-arrow-left"></i> Previous</button><button class="btn btn-primary" id="next3">Next <i class="fas fa-arrow-right"></i></button></div>
                </div>
                
                <div class="survey-card" id="card4">
                    <div class="card-header"><h2><i class="fas fa-comment-dots"></i> Your Feedback</h2><p>Please share any additional comments</p></div>
                    <form id="feedbackForm">
                        <div class="form-group"><label>Type of Feedback <span class="required">*</span></label><select id="feedbackType" required><option value="">Select feedback type</option><option value="compliment">💖 Compliment</option><option value="suggestion">💡 Suggestion</option><option value="complaint">⚠️ Complaint</option></select></div>
                        <div class="form-group"><label>Your Detailed Feedback <span class="required">*</span></label><textarea id="feedbackText" required></textarea></div>
                        <div class="form-group"><label>Would you recommend us? <span class="required">*</span></label><select id="recommendation" required><option value="">Select</option><option value="yes-definitely">Yes, definitely</option><option value="yes-probably">Yes, probably</option><option value="not-sure">Not sure</option><option value="probably-not">Probably not</option><option value="no">No</option></select></div>
                        <div class="form-group"><label>How can we improve?</label><textarea id="improvementSuggestions"></textarea></div>
                    </form>
                    <div class="btn-container"><button class="btn btn-secondary" id="prev4"><i class="fas fa-arrow-left"></i> Previous</button><button class="btn btn-primary" id="submitSurveyBtn">Submit Survey <i class="fas fa-paper-plane"></i></button></div>
                </div>
                
                <div class="survey-card thank-you-card" id="thankYouCard">
                    <div class="thank-you-icon"><i class="fas fa-heart"></i></div>
                    <h2>Thank You!</h2>
                    <p>Your feedback has been successfully submitted to our cloud database!</p>
                    <div class="social-icons">
                        <a href="https://www.instagram.com/lunas_parlour" target="_blank" class="social-icon"><div class="social-circle instagram"><i class="fab fa-instagram"></i></div><div>Instagram</div></a>
                        <a href="https://www.tiktok.com/@lunasbeautyparlour" target="_blank" class="social-icon"><div class="social-circle tiktok"><i class="fab fa-tiktok"></i></div><div>TikTok</div></a>
                        <a href="https://wa.me/233700422752" target="_blank" class="social-icon"><div class="social-circle whatsapp"><i class="fab fa-whatsapp"></i></div><div>WhatsApp</div></a>
                    </div>
                    <button class="btn btn-primary" id="newSurveyBtn" style="max-width:300px; margin:30px auto 0;"><i class="fas fa-redo"></i> Submit Another Feedback</button>
                </div>
            `;
            document.getElementById('surveySection').innerHTML = surveyHTML;
            initializeSurvey();
        }
        
        function initializeSurvey() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('visitDate').value = today;
            document.getElementById('visitDate').max = today;
            
            document.querySelectorAll('.employee-option').forEach(opt => {
                const radio = opt.querySelector('input[type="radio"]');
                opt.addEventListener('click', (e) => { 
                    if(e.target.tagName !== 'INPUT') { 
                        radio.checked = true; 
                        document.querySelectorAll('.employee-option').forEach(o => o.classList.remove('selected')); 
                        opt.classList.add('selected'); 
                    } 
                });
                radio.addEventListener('change', () => { 
                    if(radio.checked) { 
                        document.querySelectorAll('.employee-option').forEach(o => o.classList.remove('selected')); 
                        opt.classList.add('selected'); 
                    } 
                });
            });
            
            document.querySelectorAll('.service-card-enh').forEach(card => {
                const chk = card.querySelector('.service-check');
                card.addEventListener('click', (e) => { 
                    if (e.target.classList.contains('star') || e.target.classList.contains('svc-comment') || e.target.tagName === 'INPUT') {
                        return;
                    }
                    chk.checked = !chk.checked; 
                    if (chk.checked) {
                        card.classList.add('selected');
                    } else {
                        card.classList.remove('selected');
                    }
                });
                chk.addEventListener('change', () => { 
                    if (chk.checked) {
                        card.classList.add('selected');
                    } else {
                        card.classList.remove('selected');
                    }
                });
            });
            
            document.querySelectorAll('.stars-enh').forEach(stars => {
                const starSpans = stars.querySelectorAll('span');
                starSpans.forEach(star => { 
                    star.addEventListener('click', function(e) { 
                        e.stopPropagation();
                        const val = parseInt(this.dataset.star); 
                        starSpans.forEach((s, i) => { 
                            if (i < val) s.classList.add('active'); 
                            else s.classList.remove('active'); 
                        }); 
                    }); 
                });
            });
            
            document.querySelectorAll('#ratingContainer .rating-option').forEach(opt => {
                opt.addEventListener('click', function() { 
                    document.getElementById('overallRating').value = this.dataset.value; 
                    document.querySelectorAll('#ratingContainer .rating-option').forEach(o => o.classList.remove('selected')); 
                    this.classList.add('selected'); 
                });
            });
            
            let current = 1;
            const showCard = (n) => { 
                document.querySelectorAll('.survey-card').forEach(c => c.classList.remove('active')); 
                document.getElementById(`card${n}`).classList.add('active'); 
                document.getElementById('progressFill').style.width = `${((n-1)/4)*100}%`; 
            };
            
            document.getElementById('next1').onclick = () => { 
                if(document.getElementById('clientInfoForm').checkValidity()) {
                    showCard(2);
                } else {
                    document.getElementById('clientInfoForm').reportValidity();
                }
            };
            document.getElementById('next2').onclick = () => { if(document.querySelectorAll('.service-check:checked').length > 0) showCard(3); else alert('Please select at least one service.'); };
            document.getElementById('next3').onclick = () => { if(document.getElementById('overallRating').value) showCard(4); else alert('Please rate the overall service quality.'); };
            document.getElementById('prev2').onclick = () => showCard(1);
            document.getElementById('prev3').onclick = () => showCard(2);
            document.getElementById('prev4').onclick = () => showCard(3);
            
            document.getElementById('submitSurveyBtn').onclick = async () => {
                if (document.getElementById('feedbackForm').checkValidity()) {
                    await submitSurveyData();
                } else {
                    document.getElementById('feedbackForm').reportValidity();
                }
            };
            document.getElementById('newSurveyBtn').onclick = () => location.reload();
        }
        
        async function submitSurveyData() {
            showLoading();
            
            const serviceRatings = [];
            document.querySelectorAll('.service-check:checked').forEach(cb => {
                let svc = cb.value;
                const card = cb.closest('.service-card-enh');
                const starCount = card.querySelectorAll('.stars-enh span.active').length;
                const comment = card.querySelector('.svc-comment')?.value || '';
                serviceRatings.push({ service: svc, rating: starCount, comment: comment });
            });
            
            const otherVal = document.getElementById('otherServiceField')?.value;
            if (otherVal && serviceRatings.some(s => s.service === 'Other')) {
                const idx = serviceRatings.findIndex(s => s.service === 'Other');
                if (idx !== -1) serviceRatings[idx].service = otherVal;
            }
            
            let selectedEmployee = '';
            const selectedRadio = document.querySelector('input[name="employeeShoutoutRadio"]:checked');
            if(selectedRadio) selectedEmployee = selectedRadio.value;
            const customShout = document.getElementById('employeeShoutoutFieldCustom')?.value || '';
            const finalShoutout = customShout ? `${selectedEmployee ? selectedEmployee + ': ' : ''}${customShout}` : (selectedEmployee || '');
            
            const now = new Date();
            const surveyData = {
                timestamp: now.toISOString(),
                submissionDate: now.toLocaleString(),
                clientPhone: document.getElementById('clientPhone').value || '',
                visitDate: document.getElementById('visitDate').value,
                clientType: document.getElementById('clientType').value,
                services: serviceRatings.map(s => s.service).join(', '),
                serviceRatings: JSON.stringify(serviceRatings),
                overallRating: document.getElementById('overallRating').value,
                staffRating: document.getElementById('staffRating').value || 'Not rated',
                cleanlinessRating: document.getElementById('cleanlinessRating').value || 'Not rated',
                waitTimeRating: document.getElementById('waitTimeRating').value || 'Not rated',
                feedbackType: document.getElementById('feedbackType').value,
                feedbackText: document.getElementById('feedbackText').value,
                recommendation: document.getElementById('recommendation').value,
                improvements: document.getElementById('improvementSuggestions').value || '',
                employeeShoutout: finalShoutout || ''
            };
            
            await submitToGoogleSheets(surveyData);
            
            hideLoading();
            
            document.getElementById('thankYouCard').classList.add('active');
            document.getElementById('card4').classList.remove('active');
            document.getElementById('progressFill').style.width = '100%';
            showToast('✨ Thank you! Your feedback has been recorded in the cloud! ✨');
        }
        
        async function loadDashboard() {
            showLoading();
            
            const allSubmissions = await fetchAllSubmissions();
            
            const totalClients = allSubmissions.length;
            const avgRating = totalClients > 0 ? (allSubmissions.reduce((a,b)=>a+(parseInt(b.overallRating)||0),0)/totalClients).toFixed(1) : '0.0';
            const newClients = allSubmissions.filter(s => s.clientType === 'new').length;
            const returningClients = allSubmissions.filter(s => s.clientType === 'returning').length;
            const totalServices = allSubmissions.reduce((a,s)=>a+(s.services?.split(', ').length||0),0);
            const compliments = allSubmissions.filter(s => s.feedbackType === 'compliment').length;
            
            const perServiceMap = new Map();
            allSubmissions.forEach(sub => {
                if(sub.serviceRatings) {
                    try {
                        const ratings = JSON.parse(sub.serviceRatings);
                        ratings.forEach(r => {
                            if(r.rating > 0) {
                                if(!perServiceMap.has(r.service)) perServiceMap.set(r.service, []);
                                perServiceMap.get(r.service).push(r.rating);
                            }
                        });
                    } catch(e) {}
                }
            });
            
            let perServiceHtml = '';
            if(perServiceMap.size > 0) {
                for(let [svc, ratings] of perServiceMap.entries()) {
                    const avg = ratings.length ? (ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1) : 'N/A';
                    const fullStars = Math.floor(avg);
                    const emptyStars = 5 - fullStars;
                    perServiceHtml += `
                        <div class="per-service-row">
                            <span><strong>${svc}</strong></span>
                            <span style="color:var(--secondary-color);">${'★'.repeat(fullStars)}${'☆'.repeat(emptyStars)}</span>
                            <span style="background:#f0f0f0; padding:4px 12px; border-radius:40px;">${avg}/5 (${ratings.length})</span>
                        </div>
                    `;
                }
            } else {
                perServiceHtml = '<div class="empty-state">No service ratings yet. Submit surveys to see data!</div>';
            }
            
            let shoutoutsHtml = '';
            const shoutouts = allSubmissions.filter(s => s.employeeShoutout && s.employeeShoutout.trim()).slice(-6).reverse();
            if(shoutouts.length > 0) {
                shoutoutsHtml = shoutouts.map(s => `
                    <div class="shoutout-item">
                        <i class="fas fa-user-check" style="color: var(--secondary-color);"></i> "${s.employeeShoutout.substring(0, 80)}"
                        <br><small style="color: var(--text-light);">📅 ${s.submissionDate || new Date(s.timestamp).toLocaleDateString()}</small>
                    </div>
                `).join('');
            } else {
                shoutoutsHtml = '<div class="empty-state">No shoutouts yet. Be the first to recognize an amazing employee!</div>';
            }
            
            let feedbackHtml = '';
            const feedbacks = allSubmissions.filter(s => s.feedbackText && s.feedbackText.trim()).slice(-5).reverse();
            if(feedbacks.length > 0) {
                feedbackHtml = feedbacks.map(fb => {
                    const borderColor = fb.feedbackType === 'compliment' ? '#2ecc71' : (fb.feedbackType === 'suggestion' ? '#f39c12' : '#e74c3c');
                    return `
                        <div class="feedback-item" style="border-left-color: ${borderColor};">
                            <strong><i class="fas fa-tag"></i> ${(fb.feedbackType || 'feedback').toUpperCase()}</strong>
                            <br>${fb.feedbackText.substring(0, 120)}${fb.feedbackText.length > 120 ? '...' : ''}
                            <br><small>📞 ${fb.clientPhone || 'No phone provided'} | 👍 ${fb.recommendation?.replace(/-/g, ' ') || 'No recommendation'}</small>
                        </div>
                    `;
                }).join('');
            } else {
                feedbackHtml = '<div class="empty-state">No feedback yet. Submit surveys to see feedback!</div>';
            }
            
            const serviceCountMap = new Map();
            allSubmissions.forEach(sub => {
                if(sub.services) {
                    sub.services.split(', ').forEach(svc => {
                        serviceCountMap.set(svc, (serviceCountMap.get(svc) || 0) + 1);
                    });
                }
            });
            
            document.getElementById('dashboardSection').innerHTML = `
                <div class="dashboard-header">
                    <div>
                        <h1><i class="fas fa-chart-line"></i> Analytics Dashboard</h1>
                        <p>LUNAS Salon Client Feedback & Insights <span class="sync-status"><i class="fas fa-cloud-upload-alt"></i> Cloud-Synced</span></p>
                    </div>
                    <div style="display: flex; gap: 12px;">
                        <button class="refresh-btn" id="refreshDashboardBtn"><i class="fas fa-sync-alt"></i> Refresh Data</button>
                        <button class="logout-btn" id="logoutDashboardBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
                    </div>
                </div>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number">${totalClients}</div>
                        <div class="stat-label">Total Responses</div>
                        <small>📊 ${newClients} new · ${returningClients} returning</small>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${avgRating}</div>
                        <div class="stat-label">⭐ Average Satisfaction</div>
                        <small>out of 5 stars</small>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${totalServices}</div>
                        <div class="stat-label">Services Performed</div>
                        <small>across all clients</small>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${allSubmissions.length}</div>
                        <div class="stat-label">Total Feedbacks</div>
                        <small>${compliments} compliments</small>
                    </div>
                </div>
                
                <div class="dashboard-grid">
                    <div class="dashboard-card">
                        <h2><i class="fas fa-chart-pie"></i> Client Demographics</h2>
                        <div class="chart-container">
                            <canvas id="clientChart"></canvas>
                        </div>
                    </div>
                    <div class="dashboard-card">
                        <h2><i class="fas fa-chart-bar"></i> Most Popular Services</h2>
                        <div class="chart-container">
                            <canvas id="serviceChart"></canvas>
                        </div>
                    </div>
                </div>
                
                <div class="dashboard-card">
                    <h2><i class="fas fa-star-half-alt"></i> Per-Service Satisfaction Ratings</h2>
                    ${perServiceHtml}
                </div>
                
                <div class="dashboard-grid">
                    <div class="dashboard-card">
                        <h2><i class="fas fa-medal"></i> Employee Shoutouts 🌟</h2>
                        ${shoutoutsHtml}
                    </div>
                    <div class="dashboard-card">
                        <h2><i class="fas fa-comment-dots"></i> Recent Client Feedback</h2>
                        ${feedbackHtml}
                    </div>
                </div>
                
                <div class="dashboard-card">
                    <div style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;">
                        <button class="btn btn-primary" id="exportCsvBtn"><i class="fas fa-download"></i> Export CSV</button>
                    </div>
                </div>
                
                <div style="text-align: center; padding: 20px; color: var(--text-light);">
                    <p><i class="fas fa-cloud-upload-alt"></i> Data synced from Google Sheets | Last updated: ${new Date().toLocaleString()}</p>
                </div>
            `;
            
            document.getElementById('refreshDashboardBtn').onclick = () => loadDashboard();
            document.getElementById('logoutDashboardBtn').onclick = () => {
                isLoggedIn = false;
                document.getElementById('dashboardSection').innerHTML = '';
                document.getElementById('navSurvey').click();
            };
            document.getElementById('exportCsvBtn').onclick = () => exportToCSV(allSubmissions);
            
            setTimeout(() => {
                if(document.getElementById('clientChart')) {
                    new Chart(document.getElementById('clientChart'), { 
                        type: 'doughnut', 
                        data: { 
                            labels: ['New Clients', 'Returning Clients'], 
                            datasets: [{ 
                                data: [newClients, returningClients], 
                                backgroundColor: ['#006850', '#FBB040'],
                                borderWidth: 0,
                                hoverOffset: 10
                            }] 
                        }, 
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: true,
                            plugins: { legend: { position: 'bottom' } }
                        } 
                    });
                }
                
                const topSvcs = Array.from(serviceCountMap.entries()).sort((a,b) => b[1] - a[1]).slice(0, 6);
                if(document.getElementById('serviceChart') && topSvcs.length > 0) {
                    new Chart(document.getElementById('serviceChart'), { 
                        type: 'bar', 
                        data: { 
                            labels: topSvcs.map(s => s[0].length > 15 ? s[0].substring(0,12)+'...' : s[0]), 
                            datasets: [{ 
                                label: 'Times Booked', 
                                data: topSvcs.map(s => s[1]), 
                                backgroundColor: '#006850',
                                borderRadius: 8,
                                barPercentage: 0.7
                            }] 
                        }, 
                        options: { 
                            responsive: true,
                            maintainAspectRatio: true,
                            plugins: { legend: { position: 'top' } },
                            scales: { y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } } } 
                        } 
                    });
                }
            }, 100);
            
            hideLoading();
        }
        
        function exportToCSV(data) {
            if(data.length === 0) {
                alert('No data to export!');
                return;
            }
            
            let csvRows = [["Timestamp", "Submission Date", "Phone Number", "Visit Date", "Client Type", "Services", "Overall Rating", "Staff Rating", "Cleanliness", "Wait Time", "Feedback Type", "Feedback Text", "Recommendation", "Improvements", "Employee Shoutout"]];
            
            data.forEach(row => {
                csvRows.push([
                    row.timestamp || '',
                    row.submissionDate || '',
                    row.clientPhone || '',
                    row.visitDate || '',
                    row.clientType || '',
                    row.services || '',
                    row.overallRating || '',
                    row.staffRating || '',
                    row.cleanlinessRating || '',
                    row.waitTimeRating || '',
                    row.feedbackType || '',
                    row.feedbackText || '',
                    row.recommendation || '',
                    row.improvements || '',
                    row.employeeShoutout || ''
                ]);
            });
            
            const csvContent = csvRows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(",")).join("\n");
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.setAttribute('download', `lunas_survey_data_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showToast('📊 CSV exported successfully!');
        }
        
        loadSurveyTool();
    </script>
