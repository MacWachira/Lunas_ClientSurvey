<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUNAS Beauty Salon - Client Survey</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase loaded before any script runs -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', 'Segoe UI', sans-serif;
        }
        body {
            background: #f0f4f8;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ── Header ── */
        .main-header {
            background: linear-gradient(135deg, #006850, #00875a);
            padding: 20px 0;
            margin-bottom: 30px;
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
        }
        .tagline {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.8);
            letter-spacing: 3px;
            margin-top: 5px;
        }
        .nav-buttons {
            display: flex;
            gap: 15px;
        }
        .nav-btn {
            padding: 10px 20px;
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .nav-btn.active {
            background: #FBB040;
            color: #000;
        }

        /* ── Survey Cards ── */
        .survey-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            display: none;
        }
        .survey-card.active {
            display: block;
        }
        .card-header {
            margin-bottom: 25px;
            border-left: 4px solid #FBB040;
            padding-left: 15px;
        }
        .card-header h2 {
            color: #006850;
            font-size: 1.5rem;
        }
        .card-header p {
            color: #666;
            margin-top: 5px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .required {
            color: #e74c3c;
        }
        input[type="text"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus,
        input[type="tel"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #006850;
        }

        /* ── Services Grid ── */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }
        .service-checkbox {
            display: flex;
            align-items: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #ddd;
            transition: background 0.15s, border-color 0.15s;
        }
        .service-checkbox:hover {
            background: #e8f5f0;
            border-color: #006850;
        }
        .service-checkbox input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
            accent-color: #006850;
        }

        /* ── Rating Buttons ── */
        .rating-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .rating-option {
            flex: 1;
            min-width: 70px;
            text-align: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 30px;
            cursor: pointer;
            border: 2px solid #ddd;
            transition: all 0.2s;
            user-select: none;
        }
        .rating-option:hover {
            border-color: #006850;
        }
        .rating-option.selected {
            background: #006850;
            color: white;
            border-color: #006850;
        }

        /* ── Buttons ── */
        .btn-container {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 30px;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            font-size: 1rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #006850, #00875a);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,104,80,0.3);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }
        .btn-secondary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ── Progress Bar ── */
        .progress-bar {
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #006850, #FBB040);
            width: 0%;
            transition: width 0.4s ease;
        }

        /* ── Thank You Card ── */
        .thank-you-card {
            text-align: center;
            padding: 50px;
            display: none;
        }
        .thank-you-card.active {
            display: block;
        }
        .thank-you-card h2 {
            color: #006850;
            font-size: 2rem;
            margin: 20px 0 10px;
        }
        .thank-you-card p {
            color: #555;
            margin-bottom: 15px;
        }

        /* ── Social Icons ── */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        .social-icon {
            text-decoration: none;
        }
        .social-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            transition: transform 0.2s;
        }
        .social-circle:hover {
            transform: scale(1.1);
        }
        .instagram { background: linear-gradient(45deg, #405DE6, #E1306C); }
        .tiktok    { background: #000; }
        .whatsapp  { background: #25D366; }

        /* ── Toast Notification ── */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #006850;
            color: white;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: 600;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            transition: transform 0.4s ease;
            z-index: 9999;
            white-space: nowrap;
        }
        #toast.show {
            transform: translateX(-50%) translateY(0);
        }
        #toast.error {
            background: #c0392b;
        }

        /* ── Dashboard ── */
        #dashboardSection {
            display: none;
        }
        .dashboard-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        .dashboard-card h2 {
            color: #006850;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-box {
            background: #f0f9f5;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid #d4edda;
        }
        .stat-box .number {
            font-size: 2rem;
            font-weight: 700;
            color: #006850;
        }
        .stat-box .label {
            font-size: 0.85rem;
            color: #555;
            margin-top: 5px;
        }
        .feedback-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .feedback-table th {
            background: #006850;
            color: white;
            padding: 10px 14px;
            text-align: left;
        }
        .feedback-table td {
            padding: 10px 14px;
            border-bottom: 1px solid #eee;
        }
        .feedback-table tr:hover td {
            background: #f0f9f5;
        }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
        }
        .badge-compliment  { background: #d4edda; color: #155724; }
        .badge-suggestion  { background: #fff3cd; color: #856404; }
        .badge-complaint   { background: #f8d7da; color: #721c24; }
        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: #999;
            font-style: italic;
        }

        /* ── Shoutout box ── */
        .shoutout-box {
            background: #FFF9EF;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #ffe5a0;
        }

        @media (max-width: 768px) {
            .container { padding: 15px; }
            .services-grid { grid-template-columns: 1fr; }
            .btn-container { flex-direction: column; }
            .logo { font-size: 1.8rem; }
            .rating-option { font-size: 0.85rem; padding: 8px 6px; }
        }
    </style>
</head>
<body>

<!-- ══════════════ HEADER ══════════════ -->
<div class="main-header">
    <div class="header-content">
        <div>
            <div class="logo">LUNAS</div>
            <div class="tagline">BEAUTY SALON &amp; SPA</div>
        </div>
        <div class="nav-buttons">
            <button class="nav-btn active" id="navSurvey">Client Survey</button>
            <button class="nav-btn" id="navDashboard">Analytics Dashboard</button>
        </div>
    </div>
</div>

<!-- ══════════════ MAIN CONTAINER ══════════════ -->
<div class="container">

    <!-- Survey Section -->
    <div id="surveySection">
        <!-- Progress Bar -->
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <!-- ── Card 1: Contact ── -->
        <div class="survey-card active" id="card1">
            <div class="card-header">
                <h2><i class="fas fa-user"></i> Contact Information</h2>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="clientPhone" placeholder="Enter your phone number">
            </div>
            <div class="form-group">
                <label>Date of Visit <span class="required">*</span></label>
                <input type="date" id="visitDate" required>
            </div>
            <div class="form-group">
                <label>Is this your first visit? <span class="required">*</span></label>
                <select id="clientType" required>
                    <option value="">Select an option</option>
                    <option value="new">Yes, first time</option>
                    <option value="returning">No, I've been here before</option>
                </select>
            </div>
            <div class="btn-container">
                <button class="btn btn-secondary" disabled>Previous</button>
                <button class="btn btn-primary" id="next1">Next →</button>
            </div>
        </div>

        <!-- ── Card 2: Services ── -->
        <div class="survey-card" id="card2">
            <div class="card-header">
                <h2><i class="fas fa-spa"></i> Services Received</h2>
                <p>Select all that apply</p>
            </div>
            <div class="services-grid" id="servicesGrid"></div>
            <div class="form-group">
                <label>If "Other", please specify:</label>
                <input type="text" id="otherService" placeholder="Describe the service">
            </div>
            <div class="form-group shoutout-box">
                <label><i class="fas fa-star-of-life"></i> Shout-out to an amazing employee!</label>
                <textarea id="employeeShoutout" rows="2" placeholder="e.g., Sarah made my experience amazing!"></textarea>
            </div>
            <div class="btn-container">
                <button class="btn btn-secondary" id="prev2">← Back</button>
                <button class="btn btn-primary" id="next2">Next →</button>
            </div>
        </div>

        <!-- ── Card 3: Quality ── -->
        <div class="survey-card" id="card3">
            <div class="card-header">
                <h2><i class="fas fa-star"></i> Service Quality</h2>
            </div>

            <div class="form-group">
                <label>Overall Service Quality <span class="required">*</span></label>
                <div class="rating-container" id="overallRatingContainer">
                    <div class="rating-option" data-value="1">Poor</div>
                    <div class="rating-option" data-value="2">Fair</div>
                    <div class="rating-option" data-value="3">Good</div>
                    <div class="rating-option" data-value="4">Very Good</div>
                    <div class="rating-option" data-value="5">Excellent</div>
                </div>
                <input type="hidden" id="overallRating">
            </div>

            <div class="form-group">
                <label>Staff Friendliness</label>
                <select id="staffRating">
                    <option value="">Select</option>
                    <option value="5">Excellent</option>
                    <option value="4">Very Good</option>
                    <option value="3">Good</option>
                    <option value="2">Fair</option>
                    <option value="1">Poor</option>
                </select>
            </div>
            <div class="form-group">
                <label>Cleanliness</label>
                <select id="cleanlinessRating">
                    <option value="">Select</option>
                    <option value="5">Excellent</option>
                    <option value="4">Very Good</option>
                    <option value="3">Good</option>
                    <option value="2">Fair</option>
                    <option value="1">Poor</option>
                </select>
            </div>
            <div class="form-group">
                <label>Wait Time</label>
                <select id="waitTimeRating">
                    <option value="">Select</option>
                    <option value="5">Excellent - No wait</option>
                    <option value="4">Very Good - Minimal</option>
                    <option value="3">Good - Reasonable</option>
                    <option value="2">Fair - Longer</option>
                    <option value="1">Poor - Excessive</option>
                </select>
            </div>

            <div class="btn-container">
                <button class="btn btn-secondary" id="prev3">← Back</button>
                <button class="btn btn-primary" id="next3">Next →</button>
            </div>
        </div>

        <!-- ── Card 4: Feedback ── -->
        <div class="survey-card" id="card4">
            <div class="card-header">
                <h2><i class="fas fa-comment-dots"></i> Your Feedback</h2>
            </div>
            <div class="form-group">
                <label>Feedback Type <span class="required">*</span></label>
                <select id="feedbackType" required>
                    <option value="">Select</option>
                    <option value="compliment">Compliment</option>
                    <option value="suggestion">Suggestion</option>
                    <option value="complaint">Complaint</option>
                </select>
            </div>
            <div class="form-group">
                <label>Your Feedback <span class="required">*</span></label>
                <textarea id="feedbackText" rows="3" required placeholder="Share your experience..."></textarea>
            </div>
            <div class="form-group">
                <label>Would you recommend us? <span class="required">*</span></label>
                <select id="recommendation" required>
                    <option value="">Select</option>
                    <option value="yes-definitely">Yes, definitely</option>
                    <option value="yes-probably">Yes, probably</option>
                    <option value="not-sure">Not sure</option>
                    <option value="probably-not">Probably not</option>
                    <option value="no">No</option>
                </select>
            </div>
            <div class="form-group">
                <label>How can we improve?</label>
                <textarea id="improvementSuggestions" rows="2" placeholder="Any suggestions are welcome..."></textarea>
            </div>
            <div class="btn-container">
                <button class="btn btn-secondary" id="prev4">← Back</button>
                <button class="btn btn-primary" id="submitSurvey">Submit Survey →</button>
            </div>
        </div>

        <!-- ── Thank You Card ── -->
        <div class="survey-card thank-you-card" id="thankYouCard">
            <div><i class="fas fa-heart" style="font-size: 4rem; color: #006850;"></i></div>
            <h2>Thank You!</h2>
            <p>Your feedback has been successfully submitted. We truly value your input!</p>
            <div class="social-icons">
                <a href="https://www.instagram.com/lunas_parlour" target="_blank" class="social-icon">
                    <div class="social-circle instagram"><i class="fab fa-instagram"></i></div>
                </a>
                <a href="https://www.tiktok.com/@lunasbeautyparlour" target="_blank" class="social-icon">
                    <div class="social-circle tiktok"><i class="fab fa-tiktok"></i></div>
                </a>
                <a href="https://wa.me/233700422752" target="_blank" class="social-icon">
                    <div class="social-circle whatsapp"><i class="fab fa-whatsapp"></i></div>
                </a>
            </div>
            <button class="btn btn-primary" id="newSurvey" style="max-width:250px;margin:20px auto 0;display:block;">Submit Another</button>
        </div>
    </div><!-- /surveySection -->

    <!-- ══ Dashboard Section ══ -->
    <div id="dashboardSection">
        <div class="dashboard-card">
            <h2><i class="fas fa-chart-bar"></i> Analytics Dashboard</h2>
            <div id="dashboardContent"><div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading data…</div></div>
        </div>
    </div>

</div><!-- /container -->

<!-- Toast -->
<div id="toast"></div>

<!-- ══════════════════════════════════════════
     SCRIPT
══════════════════════════════════════════ -->
<script>
/* ──────────────────────────────────────────
   1.  SUPABASE INITIALISATION
   The SDK attaches itself to window.supabase.
   We store OUR client as "db" to avoid any
   naming collision with the SDK global.
────────────────────────────────────────── */
const SUPABASE_URL     = "https://jxbyfvghztsnvcixnzlr.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4YnlmdmdoenRzbnZjaXhuemxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NTg3NzUsImV4cCI6MjA5NjIzNDc3NX0.2zweytKYGXnvnnXa2W1t48Rb4f08N8qSIrZuw0ZFEAo";

// "db" is our Supabase client – distinct from the SDK's window.supabase
let db = null;

function initSupabase() {
    try {
        // The UMD build exposes the factory on window.supabase.createClient
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log("Supabase client created.");
    } catch (e) {
        console.error("Supabase init failed:", e);
    }
}

/* ──────────────────────────────────────────
   2.  SERVICES LIST
────────────────────────────────────────── */
const SERVICES = [
    "Gel Polish", "Tips", "Builder Gel", "Gumgel Overlay",
    "Gumgel Sculpting", "Pedicure", "Manicure", "Piercing",
    "Wig Installation and Styling", "Wig Laundry", "Eyelash Extension",
    "Waxing", "Facial", "Massage", "Braiding", "Wash and Blow",
    "Brow Shaping", "Dreadlock Installation/Retouch", "Flat Ironing", "Other"
];

/* ──────────────────────────────────────────
   3.  HELPERS
────────────────────────────────────────── */
function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = isError ? 'error' : '';
    // force reflow so transition fires
    void t.offsetWidth;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
}

function loadServicesGrid() {
    const grid = document.getElementById('servicesGrid');
    grid.innerHTML = '';
    SERVICES.forEach(service => {
        const label = document.createElement('label');
        label.className = 'service-checkbox';
        label.innerHTML = `<input type="checkbox" name="service" value="${service}"><span>${service}</span>`;
        grid.appendChild(label);
    });
}

/* ──────────────────────────────────────────
   4.  CARD NAVIGATION
────────────────────────────────────────── */
let currentCard = 1;
const TOTAL_CARDS = 4;

function showCard(n) {
    for (let i = 1; i <= TOTAL_CARDS; i++) {
        const c = document.getElementById(`card${i}`);
        if (c) c.classList.remove('active');
    }
    const target = document.getElementById(`card${n}`);
    if (target) target.classList.add('active');
    document.getElementById('progressFill').style.width = `${((n - 1) / TOTAL_CARDS) * 100}%`;
    currentCard = n;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ──────────────────────────────────────────
   5.  RATING BUTTONS
   Each container is scoped independently so
   clicking in one group never deselects another.
────────────────────────────────────────── */
function bindRatingGroup(containerId, hiddenInputId) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.querySelectorAll('.rating-option').forEach(opt => {
        opt.addEventListener('click', function () {
            container.querySelectorAll('.rating-option').forEach(o => o.classList.remove('selected'));
            this.classList.add('selected');
            document.getElementById(hiddenInputId).value = this.dataset.value;
        });
    });
}

/* ──────────────────────────────────────────
   6.  SURVEY SUBMIT
────────────────────────────────────────── */
async function submitSurvey() {
    const submitBtn = document.getElementById('submitSurvey');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';

    // Collect services
    const selectedServices = Array.from(
        document.querySelectorAll('input[name="service"]:checked')
    ).map(cb => {
        if (cb.value === 'Other') {
            const other = document.getElementById('otherService').value.trim();
            return other || 'Other';
        }
        return cb.value;
    });

    // Build payload for `clients` table
    const clientId = 'LUN' + Date.now().toString().slice(-8);
    const now      = new Date().toISOString();

    const clientRow = {
        id:                 clientId,
        client_type:        document.getElementById('clientType').value,
        phone:              document.getElementById('clientPhone').value.trim() || null,
        visit_date:         document.getElementById('visitDate').value,
        services:           JSON.stringify(selectedServices),
        rating:             parseInt(document.getElementById('overallRating').value),
        staff_rating:       document.getElementById('staffRating').value
                                ? parseInt(document.getElementById('staffRating').value) : null,
        cleanliness_rating: document.getElementById('cleanlinessRating').value
                                ? parseInt(document.getElementById('cleanlinessRating').value) : null,
        wait_time_rating:   document.getElementById('waitTimeRating').value
                                ? parseInt(document.getElementById('waitTimeRating').value) : null,
        employee_shoutout:  document.getElementById('employeeShoutout').value.trim() || null,
        submission_date:    now
    };

    // Build payload for `feedback` table
    const feedbackRow = {
        id:               clientId + '_fb',
        client_id:        clientId,
        type:             document.getElementById('feedbackType').value,
        text:             document.getElementById('feedbackText').value.trim(),
        recommendation:   document.getElementById('recommendation').value,
        improvements:     document.getElementById('improvementSuggestions').value.trim() || null,
        employee_shoutout: document.getElementById('employeeShoutout').value.trim() || null,
        date:             now
    };

    // ── Save to Supabase ──
    if (db) {
        try {
            const { error: clientErr } = await db.from('clients').insert([clientRow]);
            if (clientErr) {
                console.error("clients insert error:", clientErr);
                throw new Error(clientErr.message);
            }

            const { error: feedbackErr } = await db.from('feedback').insert([feedbackRow]);
            if (feedbackErr) {
                console.error("feedback insert error:", feedbackErr);
                throw new Error(feedbackErr.message);
            }

            console.log("✅ Saved to Supabase successfully!");
        } catch (e) {
            console.error("Supabase save error:", e);
            showToast("Saved locally – sync pending. (" + e.message + ")", true);
        }
    } else {
        console.warn("Supabase not available. Continuing without remote save.");
    }

    // ── Show Thank-You ──
    document.getElementById('card4').classList.remove('active');
    document.getElementById('thankYouCard').classList.add('active');
    document.getElementById('progressFill').style.width = '100%';
    showToast("🌸 Thank you for your feedback!");

    submitBtn.disabled  = false;
    submitBtn.textContent = 'Submit Survey →';
}

/* ──────────────────────────────────────────
   7.  DASHBOARD  (reads from Supabase)
────────────────────────────────────────── */
async function loadDashboard() {
    const content = document.getElementById('dashboardContent');
    content.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading data…</div>';

    if (!db) {
        content.innerHTML = '<p style="color:#c0392b;">Database not connected. Please check your Supabase config.</p>';
        return;
    }

    try {
        // Fetch clients
        const { data: clients, error: cErr } = await db
            .from('clients')
            .select('*')
            .order('submission_date', { ascending: false });
        if (cErr) throw cErr;

        // Fetch feedback
        const { data: feedback, error: fErr } = await db
            .from('feedback')
            .select('*')
            .order('date', { ascending: false });
        if (fErr) throw fErr;

        // ── Stats ──
        const total       = clients.length;
        const newC        = clients.filter(c => c.client_type === 'new').length;
        const returning   = clients.filter(c => c.client_type === 'returning').length;
        const avgRating   = total
            ? (clients.reduce((s, c) => s + (c.rating || 0), 0) / total).toFixed(1)
            : '—';
        const recommended = feedback.filter(f =>
            f.recommendation && f.recommendation.startsWith('yes')).length;

        content.innerHTML = `
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="number">${total}</div>
                    <div class="label">Total Responses</div>
                </div>
                <div class="stat-box">
                    <div class="number">${newC}</div>
                    <div class="label">New Clients</div>
                </div>
                <div class="stat-box">
                    <div class="number">${returning}</div>
                    <div class="label">Returning Clients</div>
                </div>
                <div class="stat-box">
                    <div class="number">${avgRating}</div>
                    <div class="label">Avg Rating / 5</div>
                </div>
                <div class="stat-box">
                    <div class="number">${recommended}</div>
                    <div class="label">Would Recommend</div>
                </div>
            </div>

            <h3 style="color:#006850;margin-bottom:15px;">Recent Feedback</h3>
            ${feedback.length === 0 ? '<p>No feedback yet.</p>' : `
            <div style="overflow-x:auto;">
            <table class="feedback-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Feedback</th>
                        <th>Recommend?</th>
                    </tr>
                </thead>
                <tbody>
                    ${feedback.slice(0, 20).map(f => `
                    <tr>
                        <td>${f.date ? f.date.slice(0,10) : '—'}</td>
                        <td><span class="badge badge-${f.type || ''}">${f.type || '—'}</span></td>
                        <td>${(f.text || '').slice(0, 100)}${f.text && f.text.length > 100 ? '…' : ''}</td>
                        <td>${f.recommendation || '—'}</td>
                    </tr>`).join('')}
                </tbody>
            </table>
            </div>`}
        `;
    } catch (e) {
        console.error("Dashboard load error:", e);
        content.innerHTML = `<p style="color:#c0392b;">Error loading data: ${e.message}</p>`;
    }
}

/* ──────────────────────────────────────────
   8.  INITIALISE EVERYTHING
────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {

    // Init Supabase first
    initSupabase();

    // Set today's date and cap max
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('visitDate').value = today;
    document.getElementById('visitDate').max   = today;

    // Populate services
    loadServicesGrid();

    // Bind the OVERALL rating group (scoped to its container)
    bindRatingGroup('overallRatingContainer', 'overallRating');

    // ── Navigation ──
    document.getElementById('next1').onclick = () => {
        const ct = document.getElementById('clientType').value;
        const vd = document.getElementById('visitDate').value;
        if (!ct || !vd) {
            showToast('Please select visit type and date.', true);
            return;
        }
        showCard(2);
    };

    document.getElementById('next2').onclick = () => {
        const selected = document.querySelectorAll('input[name="service"]:checked');
        if (selected.length === 0) {
            showToast('Please select at least one service.', true);
            return;
        }
        showCard(3);
    };

    document.getElementById('next3').onclick = () => {
        if (!document.getElementById('overallRating').value) {
            showToast('Please rate the overall service quality.', true);
            return;
        }
        showCard(4);
    };

    document.getElementById('prev2').onclick = () => showCard(1);
    document.getElementById('prev3').onclick = () => showCard(2);
    document.getElementById('prev4').onclick = () => showCard(3);

    document.getElementById('submitSurvey').onclick = () => {
        const ft = document.getElementById('feedbackType').value;
        const fb = document.getElementById('feedbackText').value.trim();
        const rc = document.getElementById('recommendation').value;
        if (!ft || !fb || !rc) {
            showToast('Please complete all required feedback fields.', true);
            return;
        }
        submitSurvey();
    };

    document.getElementById('newSurvey').onclick = () => location.reload();

    // ── Nav buttons (Survey ↔ Dashboard) ──
    document.getElementById('navSurvey').onclick = () => {
        document.getElementById('surveySection').style.display  = 'block';
        document.getElementById('dashboardSection').style.display = 'none';
        document.getElementById('navSurvey').classList.add('active');
        document.getElementById('navDashboard').classList.remove('active');
    };

    document.getElementById('navDashboard').onclick = () => {
        document.getElementById('surveySection').style.display  = 'none';
        document.getElementById('dashboardSection').style.display = 'block';
        document.getElementById('navSurvey').classList.remove('active');
        document.getElementById('navDashboard').classList.add('active');
        loadDashboard();
    };
});
</script>
</body>
