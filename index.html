<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUNAS Beauty Salon - Client Survey & Analytics System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #006850;
            --secondary-color: #FBB040;
            --dark-color: #000000;
            --light-color: #FFFFFF;
            --light-bg: #f0f4f8;
            --card-bg: #ffffff;
            --text-dark: #1a2a3a;
            --text-light: #5a6e7c;
            --border-color: #e2e8f0;
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
            --warning-color: #f39c12;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif; }
        body { background: linear-gradient(145deg, #f0f4f8 0%, #e6edf4 100%); min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
        
        .main-header { background: linear-gradient(135deg, var(--primary-color), #00875a); padding: 24px 0; margin-bottom: 32px; box-shadow: 0 15px 30px -12px rgba(0,0,0,0.2); }
        .header-content { max-width: 1400px; margin: 0 auto; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { font-family: 'Playfair Display', serif; font-size: 2.8rem; font-weight: 700; color: white; letter-spacing: 2px; text-transform: uppercase; }
        .tagline { font-size: 1rem; color: rgba(255,255,255,0.9); letter-spacing: 4px; text-transform: uppercase; margin-top: 5px; }
        .nav-buttons { display: flex; gap: 15px; }
        .nav-btn { padding: 12px 28px; background-color: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); border-radius: 40px; font-weight: 600; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 10px; color: white; }
        .nav-btn:hover { background-color: rgba(255,255,255,0.25); transform: translateY(-2px); }
        .nav-btn.active { background-color: var(--secondary-color); color: var(--dark-color); }
        
        #surveySection { display: block; }
        #dashboardSection { display: none; }
        
        .survey-header { text-align: center; margin-bottom: 40px; padding: 35px; background: linear-gradient(135deg, rgba(0,104,80,0.08), rgba(251,176,64,0.08)); border-radius: 28px; }
        .survey-title { font-size: 2.5rem; color: var(--primary-color); margin-bottom: 15px; }
        .survey-subtitle { font-size: 1.1rem; color: var(--text-light); max-width: 700px; margin: 0 auto; }
        
        .progress-container { margin-bottom: 40px; }
        .progress-bar { height: 8px; background-color: var(--border-color); border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(to right, var(--primary-color), var(--secondary-color), #ff8c42); width: 0%; transition: width 0.5s ease; border-radius: 10px; }
        
        .survey-card { background-color: var(--card-bg); border-radius: 32px; padding: 44px 48px; box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1); margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.5); display: none; }
        .survey-card.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-header { margin-bottom: 30px; }
        .card-header h2 { font-size: 1.8rem; color: var(--primary-color); margin-bottom: 10px; }
        
        .form-group { margin-bottom: 28px; }
        label { display: block; font-weight: 600; margin-bottom: 10px; color: var(--dark-color); }
        .required { color: var(--danger-color); }
        input, select, textarea { width: 100%; padding: 16px 20px; border: 2px solid var(--border-color); border-radius: 20px; font-size: 1rem; transition: all 0.3s; background: white; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 4px rgba(0,104,80,0.1); }
        textarea { min-height: 100px; resize: vertical; }
        
        /* Enhanced Service Cards with Individual Ratings */
        .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .service-card { background: #f8fafc; border-radius: 24px; border: 2px solid var(--border-color); transition: all 0.3s ease; overflow: hidden; }
        .service-card:hover { transform: translateY(-3px); box-shadow: 0 12px 24px -12px rgba(0,0,0,0.15); }
        .service-card.selected { border-color: var(--primary-color); background: white; box-shadow: 0 8px 20px rgba(0,104,80,0.1); }
        .service-header { display: flex; align-items: center; padding: 18px 20px; cursor: pointer; background: inherit; }
        .service-header input { width: 22px; height: 22px; margin-right: 15px; cursor: pointer; accent-color: var(--primary-color); }
        .service-header span { font-weight: 600; font-size: 1rem; flex: 1; cursor: pointer; }
        .service-rating-area { padding: 0 20px 20px 20px; background: white; border-top: 1px dashed var(--border-color); display: none; }
        .service-card.selected .service-rating-area { display: block; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .star-group { display: flex; gap: 8px; margin: 15px 0 12px 0; }
        .star-group span { font-size: 1.8rem; cursor: pointer; color: #cbd5e1; transition: all 0.1s; }
        .star-group span.active, .star-group span:hover { color: var(--secondary-color); text-shadow: 0 0 5px rgba(251,176,64,0.4); }
        .service-comment-input input { width: 100%; padding: 12px 16px; border-radius: 40px; border: 1px solid var(--border-color); font-size: 0.85rem; background: #fefefe; }
        .service-comment-input input:focus { border-color: var(--primary-color); outline: none; }
        
        .rating-container { display: flex; justify-content: space-between; margin-top: 10px; flex-wrap: wrap; gap: 12px; }
        .rating-option { flex: 1; min-width: 110px; text-align: center; padding: 16px 12px; background-color: #f8fafc; border-radius: 60px; cursor: pointer; transition: all 0.2s; border: 2px solid var(--border-color); font-weight: 500; }
        .rating-option:hover { border-color: var(--primary-color); transform: scale(1.02); }
        .rating-option.selected { border-color: var(--primary-color); background-color: var(--primary-color); color: white; }
        .rating-option i { font-size: 1.6rem; margin-bottom: 6px; display: block; }
        
        .btn-container { display: flex; justify-content: space-between; margin-top: 45px; gap: 20px; }
        .btn { padding: 16px 35px; border: none; border-radius: 60px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 12px; flex: 1; }
        .btn-primary { background: linear-gradient(to right, var(--primary-color), #00875a); color: white; box-shadow: 0 8px 20px rgba(0,104,80,0.2); }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0,104,80,0.3); }
        .btn-secondary { background-color: #f1f5f9; color: var(--dark-color); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background-color: #e2e8f0; transform: translateY(-2px); }
        .btn-danger { background: linear-gradient(to right, var(--danger-color), #c0392b); color: white; }
        
        .thank-you-card { text-align: center; padding: 60px 40px; display: none; }
        .thank-you-card.active { display: block; }
        .thank-you-icon { font-size: 5rem; color: var(--primary-color); margin-bottom: 30px; }
        .thank-you-card h2 { font-size: 2.5rem; color: var(--primary-color); margin-bottom: 20px; }
        
        .social-icons { display: flex; justify-content: center; gap: 35px; flex-wrap: wrap; margin: 30px 0; }
        .social-icon { text-decoration: none; transition: all 0.3s ease; text-align: center; }
        .social-icon:hover { transform: translateY(-5px); }
        .social-circle { width: 75px; height: 75px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; color: white; margin: 0 auto 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .instagram { background: linear-gradient(45deg, #405DE6, #833AB4, #E1306C, #FD1D1D); }
        .tiktok { background: linear-gradient(45deg, #000000, #25F4EE, #FE2C55); }
        .whatsapp { background: linear-gradient(45deg, #25D366, #128C7E); }
        .social-name { font-weight: 600; color: var(--text-dark); font-size: 0.9rem; }
        .social-handle { font-size: 0.8rem; color: var(--text-light); }
        
        /* Dashboard Styles */
        .dashboard-header { background: linear-gradient(135deg, var(--primary-color), #00875a); color: white; padding: 28px 35px; border-radius: 28px; margin-bottom: 35px; display: flex; justify-content: space-between; align-items: center; }
        .logout-btn { background-color: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3); padding: 12px 25px; border-radius: 40px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .logout-btn:hover { background-color: rgba(255,255,255,0.3); transform: translateY(-2px); }
        
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 60vh; }
        .login-card { background-color: var(--card-bg); border-radius: 32px; padding: 50px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        .login-error { color: var(--danger-color); margin-top: 15px; display: none; }
        
        .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .stat-card { background-color: var(--card-bg); border-radius: 24px; padding: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); border: 1px solid var(--border-color); display: flex; align-items: center; gap: 20px; transition: all 0.2s; }
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .stat-icon { width: 70px; height: 70px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: white; }
        .stat-icon.clients { background: linear-gradient(135deg, var(--primary-color), #00875a); }
        .stat-icon.rating { background: linear-gradient(135deg, var(--secondary-color), #f8a62b); }
        .stat-icon.services { background: linear-gradient(135deg, #3498db, #2980b9); }
        .stat-icon.feedback { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        .stat-info h3 { font-size: 2.5rem; font-weight: 700; color: var(--dark-color); line-height: 1; margin-bottom: 5px; }
        .stat-info p { color: var(--text-light); font-weight: 500; }
        
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 30px; margin-bottom: 40px; }
        @media (max-width: 1100px) { .dashboard-grid { grid-template-columns: 1fr; } }
        
        .dashboard-card { background-color: var(--card-bg); border-radius: 24px; padding: 30px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
        .chart-container { height: 300px; margin-top: 20px; }
        .service-list { max-height: 400px; overflow-y: auto; }
        .service-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--border-color); }
        .service-count { background-color: rgba(0,104,80,0.1); color: var(--primary-color); padding: 6px 15px; border-radius: 30px; font-weight: 600; }
        .feedback-item { padding: 20px; border-radius: 20px; margin-bottom: 15px; background-color: #f8fafc; border-left: 5px solid var(--primary-color); transition: all 0.2s; }
        .feedback-item:hover { transform: translateX(5px); background-color: #fff; }
        .per-service-rating-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eef2f8; }
        .service-rating-stars { color: var(--secondary-color); letter-spacing: 2px; }
        
        @media (max-width: 768px) { .container { padding: 16px; } .survey-card { padding: 28px 24px; } .services-grid { grid-template-columns: 1fr; } .rating-container { flex-direction: column; } .btn-container { flex-direction: column; } .btn { width: 100%; } }
        
        .success-toast { position: fixed; bottom: 30px; right: 30px; background: linear-gradient(135deg, var(--success-color), #27ae60); color: white; padding: 16px 28px; border-radius: 50px; display: flex; align-items: center; gap: 12px; font-weight: 600; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 1000; transform: translateX(400px); transition: transform 0.3s ease; cursor: pointer; }
        .success-toast.show { transform: translateX(0); }
    </style>
</head>
<body>
    <div class="main-header">
        <div class="header-content">
            <div><div class="logo">LUNAS</div><div class="tagline">Beauty Salon & Spa</div></div>
            <div class="nav-buttons">
                <button class="nav-btn active" id="navSurvey"><i class="fas fa-clipboard-list"></i> Client Survey</button>
                <button class="nav-btn" id="navDashboard"><i class="fas fa-chart-line"></i> Analytics Dashboard</button>
            </div>
        </div>
    </div>
    
    <div class="container">
        <section id="surveySection"></section>
        <section id="dashboardSection"></section>
    </div>

    <div id="successToast" class="success-toast"><i class="fas fa-check-circle"></i><span>Thank you! Your feedback has been recorded.</span><i class="fas fa-times-circle" style="margin-left: 10px; opacity: 0.7;"></i></div>

    <script>
        function showSuccessMessage(message) {
            const toast = document.getElementById('successToast');
            toast.querySelector('span').textContent = message || '✨ Thank you! Your feedback has been recorded! ✨';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
            toast.onclick = (e) => { if(e.target.classList.contains('fa-times-circle')) toast.classList.remove('show'); };
        }
        
        if (!localStorage.getItem('lunasBusinessData')) {
            localStorage.setItem('lunasBusinessData', JSON.stringify({
                clients: [], services: [], feedback: [], servicePerceptions: [],
                newClientsCount: 0, returningClientsCount: 0, startDate: new Date().toISOString()
            }));
        }
        
        document.getElementById('navSurvey').onclick = () => switchSection('survey');
        document.getElementById('navDashboard').onclick = () => switchSection('dashboard');
        
        function switchSection(section) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if (section === 'survey') {
                document.getElementById('navSurvey').classList.add('active');
                document.getElementById('surveySection').style.display = 'block';
                document.getElementById('dashboardSection').style.display = 'none';
                loadSurveyTool();
            } else {
                document.getElementById('navDashboard').classList.add('active');
                document.getElementById('surveySection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                loadDashboard();
            }
        }
        
        const SERVICES_LIST = ["Gel Polish","Tips","Builder Gel","Gumgel Overlay","Gumgel Sculpting","Pedicure","Manicure","Piercing","Wig Installation and Styling","Wig Laundry","Eyelash Extension","Waxing","Facial","Massage","Braiding","Wash and Blow","Brow Shaping","Dreadlock Installation/Retouch","Flat Ironing","Other"];
        
        function loadSurveyTool() {
            let servicesHtml = `<div class="services-grid">`;
            SERVICES_LIST.forEach(svc => {
                servicesHtml += `
                    <div class="service-card" data-service="${svc}">
                        <div class="service-header">
                            <input type="checkbox" class="service-check" value="${svc}" id="chk_${svc.replace(/\s/g,'')}">
                            <span class="service-name">${svc}</span>
                        </div>
                        <div class="service-rating-area">
                            <div class="star-group" data-service="${svc}">
                                ${[1,2,3,4,5].map(s => `<span data-star="${s}" class="star">★</span>`).join('')}
                            </div>
                            <div class="service-comment-input">
                                <input type="text" class="svc-comment" placeholder="Share your experience with ${svc}...">
                            </div>
                        </div>
                    </div>
                `;
            });
            servicesHtml += `</div><div class="form-group" style="margin-top:20px;"><label for="otherServiceSpec">If you selected "Other", please specify:</label><input type="text" id="otherServiceSpec" placeholder="Enter service name"></div>`;
            
            const surveyHTML = `
                <div class="survey-header"><h1 class="survey-title">✨ Client Satisfaction Survey ✨</h1><p class="survey-subtitle">Thank you for choosing LUNAS. Rate each service you received!</p></div>
                <div class="progress-container"><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div>
                
                <div class="survey-card active" id="card1">
                    <div class="card-header"><h2><i class="fas fa-user"></i> Contact Information</h2><p>We'd love to stay in touch</p></div>
                    <div class="form-group"><label>Phone Number</label><input type="tel" id="clientPhone" placeholder="Enter your phone number"></div>
                    <div class="form-group"><label>Date of Visit <span class="required">*</span></label><input type="date" id="visitDate" required></div>
                    <div class="form-group"><label>Is this your first visit to LUNAS? <span class="required">*</span></label><select id="clientType" required><option value="">Select an option</option><option value="new">✨ Yes, first time</option><option value="returning">💎 No, I've been here before</option></select></div>
                    <div class="btn-container"><button class="btn btn-secondary" disabled>Previous</button><button class="btn btn-primary" id="next1">Next <i class="fas fa-arrow-right"></i></button></div>
                </div>
                
                <div class="survey-card" id="card2">
                    <div class="card-header"><h2><i class="fas fa-spa"></i> Services & Your Experience</h2><p>Select each service you received, then rate it with stars and add a comment</p></div>
                    ${servicesHtml}
                    <div class="form-group" style="margin-top:25px; background: linear-gradient(115deg, #FFF9EF, #FFF5E6); padding: 24px; border-radius: 28px;">
                        <label><i class="fas fa-star-of-life" style="color: var(--secondary-color);"></i> 🌟 Shout-out to an amazing employee!</label>
                        <textarea id="employeeShoutout" rows="2" placeholder="e.g., Sarah made my nails perfect! Her attention to detail was incredible..." style="resize: vertical;"></textarea>
                        <small style="color: var(--text-light);">Recognize any team member who provided exceptional service</small>
                    </div>
                    <div class="btn-container"><button class="btn btn-secondary" id="prev2"><i class="fas fa-arrow-left"></i> Previous</button><button class="btn btn-primary" id="next2">Next <i class="fas fa-arrow-right"></i></button></div>
                </div>
                
                <div class="survey-card" id="card3">
                    <div class="card-header"><h2><i class="fas fa-star"></i> Overall Experience</h2><p>How would you rate your overall experience?</p></div>
                    <div class="form-group"><label>Overall Service Quality <span class="required">*</span></label><div class="rating-container" id="ratingContainer"><div class="rating-option poor" data-value="1"><i class="fas fa-frown"></i><div>Poor</div></div><div class="rating-option fair" data-value="2"><i class="fas fa-meh"></i><div>Fair</div></div><div class="rating-option good" data-value="3"><i class="fas fa-smile"></i><div>Good</div></div><div class="rating-option very-good" data-value="4"><i class="fas fa-smile-beam"></i><div>Very Good</div></div><div class="rating-option excellent" data-value="5"><i class="fas fa-grin-stars"></i><div>Excellent</div></div></div><input type="hidden" id="overallRating" required></div>
                    <div class="form-group"><label>Staff Friendliness & Professionalism</label><select id="staffRating"><option value="">Select rating</option><option value="5">Excellent</option><option value="4">Very Good</option><option value="3">Good</option><option value="2">Fair</option><option value="1">Poor</option></select></div>
                    <div class="form-group"><label>Cleanliness of the Salon/Spa</label><select id="cleanlinessRating"><option value="">Select rating</option><option value="5">Excellent</option><option value="4">Very Good</option><option value="3">Good</option><option value="2">Fair</option><option value="1">Poor</option></select></div>
                    <div class="form-group"><label>Wait Time & Appointment Punctuality</label><select id="waitTimeRating"><option value="">Select rating</option><option value="5">Excellent - No wait</option><option value="4">Very Good - Minimal wait</option><option value="3">Good - Reasonable wait</option><option value="2">Fair - Longer than expected</option><option value="1">Poor - Excessive wait</option></select></div>
                    <div class="btn-container"><button class="btn btn-secondary" id="prev3"><i class="fas fa-arrow-left"></i> Previous</button><button class="btn btn-primary" id="next3">Next <i class="fas fa-arrow-right"></i></button></div>
                </div>
                
                <div class="survey-card" id="card4">
                    <div class="card-header"><h2><i class="fas fa-comment-dots"></i> Your Feedback</h2><p>Please share any additional comments</p></div>
                    <div class="form-group"><label>Type of Feedback <span class="required">*</span></label><select id="feedbackType" required><option value="">Select feedback type</option><option value="compliment">💖 Compliment</option><option value="suggestion">💡 Suggestion</option><option value="complaint">⚠️ Complaint</option></select></div>
                    <div class="form-group"><label>Your Detailed Feedback <span class="required">*</span></label><textarea id="feedbackText" placeholder="Please share your detailed feedback..." required></textarea></div>
                    <div class="form-group"><label>Would you recommend us to friends or family? <span class="required">*</span></label><select id="recommendation" required><option value="">Select an option</option><option value="yes-definitely">Yes, definitely</option><option value="yes-probably">Yes, probably</option><option value="not-sure">Not sure</option><option value="probably-not">Probably not</option><option value="no">No</option></select></div>
                    <div class="form-group"><label>How can we improve our services?</label><textarea id="improvementSuggestions" placeholder="Any suggestions for improvement?"></textarea></div>
                    <div class="btn-container"><button class="btn btn-secondary" id="prev4"><i class="fas fa-arrow-left"></i> Previous</button><button class="btn btn-primary" id="submitSurvey">Submit Survey <i class="fas fa-paper-plane"></i></button></div>
                </div>
                
                <div class="survey-card thank-you-card" id="thankYouCard">
                    <div class="thank-you-icon"><i class="fas fa-heart"></i></div>
                    <h2>Thank You!</h2>
                    <p>Your feedback has been successfully submitted. We truly value your input!</p>
                    <div class="social-media-section">
                        <div style="font-size:1.5rem; margin-bottom:30px;">Stay Connected With LUNAS</div>
                        <div class="social-icons">
                            <a href="https://www.instagram.com/lunas_parlour?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank" class="social-icon"><div class="social-circle instagram"><i class="fab fa-instagram"></i></div><div class="social-name">Instagram</div><div class="social-handle">@lunas_parlour</div></a>
                            <a href="https://www.tiktok.com/@lunasbeautyparlour?is_from_webapp=1&sender_device=pc" target="_blank" class="social-icon"><div class="social-circle tiktok"><i class="fab fa-tiktok"></i></div><div class="social-name">TikTok</div><div class="social-handle">@lunasbeautyparlour</div></a>
                            <a href="https://wa.me/233700422752" target="_blank" class="social-icon"><div class="social-circle whatsapp"><i class="fab fa-whatsapp"></i></div><div class="social-name">WhatsApp</div><div class="social-handle">0700 422 752</div></a>
                        </div>
                    </div>
                    <button class="btn btn-primary" id="newSurvey" style="max-width:300px; margin:40px auto 0;"><i class="fas fa-redo"></i> Submit Another Feedback</button>
                </div>
            `;
            document.getElementById('surveySection').innerHTML = surveyHTML;
            initializeSurveyWithPerServiceRatings();
        }
        
        function initializeSurveyWithPerServiceRatings() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('visitDate').value = today;
            document.getElementById('visitDate').max = today;
            
            // Service card click toggles checkbox
            document.querySelectorAll('.service-card').forEach(card => {
                const chk = card.querySelector('.service-check');
                const header = card.querySelector('.service-header');
                header.addEventListener('click', (e) => { if(e.target.tagName !== 'INPUT') { chk.checked = !chk.checked; if(chk.checked) card.classList.add('selected'); else card.classList.remove('selected'); } });
                chk.addEventListener('change', (e) => { e.stopPropagation(); if(chk.checked) card.classList.add('selected'); else card.classList.remove('selected'); });
            });
            
            // Star rating per service
            document.querySelectorAll('.star-group').forEach(group => {
                const stars = group.querySelectorAll('.star');
                stars.forEach(star => star.addEventListener('click', function(e) { e.stopPropagation(); const val = parseInt(this.dataset.star); stars.forEach((s, idx) => { if(idx < val) s.classList.add('active'); else s.classList.remove('active'); }); }));
            });
            
            // Overall rating
            document.querySelectorAll('#ratingContainer .rating-option').forEach(opt => {
                opt.addEventListener('click', function() { document.getElementById('overallRating').value = this.dataset.value; document.querySelectorAll('#ratingContainer .rating-option').forEach(o=>o.classList.remove('selected')); this.classList.add('selected'); });
            });
            
            let current = 1;
            const showCard = (n) => { document.querySelectorAll('.survey-card').forEach(c=>c.classList.remove('active')); document.getElementById(`card${n}`).classList.add('active'); document.getElementById('progressFill').style.width = `${((n-1)/4)*100}%`; };
            document.getElementById('next1').onclick = () => { if(document.getElementById('clientType').value && document.getElementById('visitDate').value) showCard(2); else alert('Please select visit type and date.'); };
            document.getElementById('next2').onclick = () => { if(Array.from(document.querySelectorAll('.service-check:checked')).length > 0) showCard(3); else alert('Please select at least one service.'); };
            document.getElementById('next3').onclick = () => { if(document.getElementById('overallRating').value) showCard(4); else alert('Please rate overall service quality.'); };
            document.getElementById('prev2').onclick = () => showCard(1); document.getElementById('prev3').onclick = () => showCard(2); document.getElementById('prev4').onclick = () => showCard(3);
            
            document.getElementById('submitSurvey').onclick = () => { if(document.getElementById('feedbackType').value && document.getElementById('feedbackText').value && document.getElementById('recommendation').value) submitWithPerServiceRatings(); else alert('Please complete all required feedback fields.'); };
            document.getElementById('newSurvey').onclick = () => location.reload();
        }
        
        function submitWithPerServiceRatings() {
            const selectedServices = [];
            const servicePerceptions = [];
            document.querySelectorAll('.service-check:checked').forEach(cb => {
                let svc = cb.value;
                const card = cb.closest('.service-card');
                const starCount = card.querySelectorAll('.star.active').length;
                const comment = card.querySelector('.svc-comment')?.value || '';
                selectedServices.push(svc);
                servicePerceptions.push({ service: svc, rating: starCount, comment: comment });
            });
            
            const otherVal = document.getElementById('otherServiceSpec')?.value;
            if(otherVal && selectedServices.includes('Other')) {
                const idx = selectedServices.indexOf('Other');
                if(idx !== -1) selectedServices[idx] = otherVal;
                const pIdx = servicePerceptions.findIndex(p => p.service === 'Other');
                if(pIdx !== -1) servicePerceptions[pIdx].service = otherVal;
            }
            
            const shoutout = document.getElementById('employeeShoutout')?.value || null;
            const clientId = 'LUN' + Date.now().toString().slice(-8);
            const business = JSON.parse(localStorage.getItem('lunasBusinessData'));
            
            business.clients.push({
                id: clientId, type: document.getElementById('clientType').value, phone: document.getElementById('clientPhone').value,
                visitDate: document.getElementById('visitDate').value, services: selectedServices,
                rating: parseInt(document.getElementById('overallRating').value),
                staffRating: parseInt(document.getElementById('staffRating').value) || null,
                cleanlinessRating: parseInt(document.getElementById('cleanlinessRating').value) || null,
                waitTimeRating: parseInt(document.getElementById('waitTimeRating').value) || null,
                employeeShoutout: shoutout, serviceDetails: servicePerceptions, submissionDate: new Date().toISOString()
            });
            
            if(document.getElementById('clientType').value === 'new') business.newClientsCount++; else business.returningClientsCount++;
            
            selectedServices.forEach(svc => { const ex = business.services.find(s => s.name === svc); if(ex) ex.count++; else business.services.push({ name: svc, count: 1 }); });
            servicePerceptions.forEach(sp => business.servicePerceptions.push({ clientId, service: sp.service, rating: sp.rating, comment: sp.comment }));
            if(shoutout) business.employeeShoutouts = business.employeeShoutouts || []; business.employeeShoutouts?.push({ clientId, employee: shoutout, date: new Date().toISOString() });
            business.feedback.push({ id: clientId, type: document.getElementById('feedbackType').value, text: document.getElementById('feedbackText').value, recommendation: document.getElementById('recommendation').value, improvements: document.getElementById('improvementSuggestions').value, employeeShoutout: shoutout, date: new Date().toISOString() });
            
            localStorage.setItem('lunasBusinessData', JSON.stringify(business));
            document.getElementById('thankYouCard').classList.add('active');
            document.getElementById('card4').classList.remove('active');
            document.getElementById('progressFill').style.width = '100%';
            showSuccessMessage('✨ Thank you for rating each service! Your feedback helps us improve! ✨');
        }
        
        // Dashboard
        function loadDashboard() { if(localStorage.getItem('lunasLoggedIn') === 'true') showDashboard(); else showLogin(); }
        function showLogin() { document.getElementById('dashboardSection').innerHTML = `<div class="login-container"><div class="login-card"><i class="fas fa-chart-line" style="font-size:3rem; color:var(--primary-color);"></i><h2 style="margin:15px 0;">LUNAS Analytics</h2><div class="form-group"><input type="text" id="username" placeholder="Username"></div><div class="form-group"><input type="password" id="password" placeholder="Password"></div><button class="btn btn-primary" id="loginBtn">Login</button><div class="login-error" id="loginError">Username: admin | Password: lunas2025</div></div></div>`; document.getElementById('loginBtn').onclick = () => { if(document.getElementById('username').value === 'admin' && document.getElementById('password').value === 'lunas2025') { localStorage.setItem('lunasLoggedIn','true'); showDashboard(); } else document.getElementById('loginError').style.display = 'block'; }; }
        
        function showDashboard() {
            const data = JSON.parse(localStorage.getItem('lunasBusinessData'));
            const avgRating = data.clients.length ? (data.clients.reduce((a,b)=>a+(b.rating||0),0)/data.clients.length).toFixed(1) : '0.0';
            const perServiceRatingsHtml = (data.servicePerceptions || []).reduce((acc, p) => { if(!acc[p.service]) acc[p.service] = { ratings: [], comments: [] }; acc[p.service].ratings.push(p.rating); if(p.comment) acc[p.service].comments.push(p.comment); return acc; }, {});
            let perServiceRows = ''; for(let [svc, info] of Object.entries(perServiceRatingsHtml)) { const avg = info.ratings.length ? (info.ratings.reduce((a,b)=>a+b,0)/info.ratings.length).toFixed(1) : 'N/A'; perServiceRows += `<div class="per-service-rating-item"><span><strong>${svc}</strong></span><span class="service-rating-stars">${'★'.repeat(Math.round(avg))}${'☆'.repeat(5-Math.round(avg))}</span><span>${avg}/5 (${info.ratings.length} ratings)</span></div>`; }
            
            document.getElementById('dashboardSection').innerHTML = `<div class="dashboard-header"><div><h1>📊 Analytics Dashboard</h1><p>Client Feedback & Per-Service Ratings</p></div><button class="logout-btn" id="logoutBtn">Logout</button></div>
            <div class="stats-container"><div class="stat-card"><div class="stat-icon clients"><i class="fas fa-users"></i></div><div class="stat-info"><h3>${data.clients.length}</h3><p>Total Clients</p></div></div><div class="stat-card"><div class="stat-icon rating"><i class="fas fa-star"></i></div><div class="stat-info"><h3>${avgRating}</h3><p>Avg Rating</p></div></div><div class="stat-card"><div class="stat-icon services"><i class="fas fa-spa"></i></div><div class="stat-info"><h3>${data.clients.reduce((a,c)=>a+(c.services?.length||0),0)}</h3><p>Services Used</p></div></div><div class="stat-card"><div class="stat-icon feedback"><i class="fas fa-comments"></i></div><div class="stat-info"><h3>${data.feedback.length}</h3><p>Feedbacks</p></div></div></div>
            <div class="dashboard-card"><h2><i class="fas fa-chart-bar"></i> Per-Service Satisfaction Ratings</h2>${perServiceRows || '<p>No per-service ratings yet</p>'}</div>
            <div class="dashboard-card"><h2><i class="fas fa-comment-dots"></i> Recent Feedback</h2>${data.feedback.slice(-5).reverse().map(fb => `<div class="feedback-item" style="border-left-color:${fb.type==='compliment'?'#2ecc71':fb.type==='suggestion'?'#f39c12':'#e74c3c'}"><strong>${fb.type}</strong> — ${fb.text.substring(0,120)}${fb.employeeShoutout ? `<br><small>🌟 Shoutout: "${fb.employeeShoutout}"</small>` : ''}</div>`).join('') || '<p>No feedback yet</p>'}</div>
            <div class="dashboard-card"><div style="display:flex; gap:15px; flex-wrap:wrap;"><button class="btn btn-primary" id="exportBtn">Export Data</button><button class="btn btn-danger" id="deleteBtn">Delete All</button><button class="btn btn-secondary" id="refreshBtn">Refresh</button></div></div>`;
            document.getElementById('logoutBtn').onclick = () => { localStorage.removeItem('lunasLoggedIn'); loadDashboard(); };
            document.getElementById('exportBtn').onclick = () => { let csv = "Client,Rating,Employee Shoutout,Services\n"; data.clients.forEach(c => csv += `${c.id},${c.rating},"${c.employeeShoutout || ''}","${c.services.join('; ')}"\n`); const blob = new Blob([csv], {type:'text/csv'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'lunas_data.csv'; a.click(); alert('✅ Data exported!'); };
            document.getElementById('deleteBtn').onclick = () => { if(confirm('Delete all data?')) { localStorage.setItem('lunasBusinessData', JSON.stringify({ clients:[], services:[], feedback:[], servicePerceptions:[], employeeShoutouts:[], newClientsCount:0, returningClientsCount:0, startDate:new Date().toISOString() })); showDashboard(); alert('✅ All data deleted.'); } };
            document.getElementById('refreshBtn').onclick = () => showDashboard();
        }
        
        loadSurveyTool();
    </script>
</body>
</html>
