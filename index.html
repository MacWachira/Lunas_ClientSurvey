<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUNAS Beauty Salon - Cloud Survey System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #006850;
            --secondary-color: #FBB040;
            --dark-color: #000000;
            --light-bg: #f8f9fa;
            --card-bg: #ffffff;
            --text-dark: #333333;
            --text-light: #666666;
            --border-color: #e0e0e0;
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', 'Segoe UI', sans-serif; }
        body { background: linear-gradient(145deg, #f0f4f8 0%, #e8edf2 100%); min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        .main-header { background: linear-gradient(135deg, var(--primary-color), #00875a); padding: 20px 0; margin-bottom: 30px; }
        .header-content { max-width: 1400px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { font-family: 'Playfair Display', serif; font-size: 2.8rem; font-weight: 700; color: white; text-transform: uppercase; }
        .tagline { font-size: 1rem; color: rgba(255,255,255,0.9); letter-spacing: 4px; margin-top: 5px; }
        .nav-buttons { display: flex; gap: 15px; }
        .nav-btn { padding: 12px 25px; background-color: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 40px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .nav-btn.active { background-color: var(--secondary-color); color: var(--dark-color); }
        
        #surveySection { display: block; }
        #dashboardSection { display: none; }
        
        .survey-header { text-align: center; margin-bottom: 40px; padding: 35px; background: linear-gradient(135deg, rgba(0,104,80,0.08), rgba(251,176,64,0.08)); border-radius: 28px; }
        .survey-title { font-size: 2.5rem; color: var(--primary-color); margin-bottom: 15px; }
        
        .progress-container { margin-bottom: 35px; }
        .progress-bar { height: 8px; background-color: var(--border-color); border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(to right, var(--primary-color), var(--secondary-color)); width: 0%; transition: width 0.5s ease; }
        
        .survey-card { background-color: var(--card-bg); border-radius: 32px; padding: 44px 48px; box-shadow: 0 20px 35px -12px rgba(0,0,0,0.12); margin-bottom: 30px; display: none; }
        .survey-card.active { display: block; animation: fadeInUp 0.5s ease; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-header { margin-bottom: 30px; border-left: 4px solid var(--secondary-color); padding-left: 20px; }
        .card-header h2 { font-size: 1.8rem; color: var(--primary-color); }
        
        .form-group { margin-bottom: 25px; }
        label { display: block; font-weight: 600; margin-bottom: 10px; }
        .required { color: var(--danger-color); }
        input, select, textarea { width: 100%; padding: 16px 20px; border: 2px solid var(--border-color); border-radius: 20px; font-size: 1rem; background: white; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary-color); }
        textarea { min-height: 100px; resize: vertical; }
        
        .services-enhanced { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin: 20px 0; }
        .service-card-enh { background: #fafcff; border-radius: 20px; border: 2px solid var(--border-color); overflow: hidden; cursor: pointer; }
        .service-card-enh.selected { border-color: var(--primary-color); background: white; }
        .service-header-enh { display: flex; align-items: center; padding: 16px 18px; }
        .service-header-enh input { width: 22px; height: 22px; margin-right: 14px; cursor: pointer; }
        .service-header-enh span { font-weight: 600; flex: 1; cursor: pointer; }
        .service-rating-enh { padding: 0 18px 18px 18px; background: white; border-top: 1px dashed var(--border-color); display: none; }
        .service-card-enh.selected .service-rating-enh { display: block; }
        .stars-enh { display: flex; gap: 8px; margin: 12px 0 10px 0; }
        .stars-enh span { font-size: 1.6rem; cursor: pointer; color: #cbd5e1; }
        .stars-enh span.active { color: var(--secondary-color); }
        .comment-enh input { width: 100%; padding: 10px 14px; border-radius: 40px; border: 1px solid var(--border-color); }
        
        .rating-container { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin: 15px 0; }
        .rating-option { flex: 1; min-width: 100px; text-align: center; padding: 14px 10px; background: #f8f9fa; border-radius: 50px; cursor: pointer; border: 2px solid var(--border-color); }
        .rating-option.selected { background: var(--primary-color); color: white; }
        
        .btn-container { display: flex; justify-content: space-between; margin-top: 40px; gap: 20px; }
        .btn { padding: 16px 35px; border: none; border-radius: 50px; font-size: 1rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; flex: 1; }
        .btn-primary { background: linear-gradient(135deg, var(--primary-color), #00875a); color: white; }
        .btn-primary:hover { transform: translateY(-3px); }
        .btn-secondary { background: #f0f0f0; color: var(--dark-color); border: 1px solid var(--border-color); }
        
        .thank-you-card { text-align: center; padding: 60px 40px; display: none; }
        .thank-you-card.active { display: block; }
        .thank-you-icon { font-size: 5rem; color: var(--primary-color); margin-bottom: 25px; }
        
        .social-icons { display: flex; justify-content: center; gap: 35px; margin: 30px 0; }
        .social-icon { display: flex; flex-direction: column; align-items: center; text-decoration: none; }
        .social-circle { width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; font-size: 2rem; color: white; }
        .instagram { background: linear-gradient(45deg, #405DE6, #833AB4, #E1306C); }
        .tiktok { background: linear-gradient(45deg, #000000, #25F4EE, #FE2C55); }
        .whatsapp { background: #25D366; }
        
        .dashboard-header { background: linear-gradient(135deg, var(--primary-color), #00875a); border-radius: 28px; padding: 28px 35px; color: white; display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; }
        .logout-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); padding: 12px 25px; border-radius: 40px; cursor: pointer; color: white; }
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 60vh; }
        .login-card { background: white; border-radius: 32px; padding: 50px; width: 100%; max-width: 450px; text-align: center; }
        .login-error { color: var(--danger-color); margin-top: 15px; display: none; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .stat-card { background: white; border-radius: 24px; padding: 22px; border-bottom: 4px solid var(--secondary-color); }
        .stat-number { font-size: 2.5rem; font-weight: 800; color: var(--primary-color); }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 28px; margin-bottom: 35px; }
        .dashboard-card { background: white; border-radius: 28px; padding: 28px; }
        .chart-container { height: 280px; margin-top: 15px; }
        .feedback-item { padding: 18px; border-radius: 20px; margin-bottom: 14px; background: #fafcff; border-left: 5px solid var(--primary-color); }
        
        @media (max-width: 768px) { .container { padding: 15px; } .survey-card { padding: 28px 24px; } .services-enhanced { grid-template-columns: 1fr; } .btn-container { flex-direction: column; } .btn { width: 100%; } }
        
        .toast-success { position: fixed; bottom: 30px; right: 30px; background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; padding: 16px 28px; border-radius: 50px; display: flex; align-items: center; gap: 12px; z-index: 1000; transform: translateX(400px); transition: 0.3s; cursor: pointer; }
        .toast-success.show { transform: translateX(0); }
        .sync-status { position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; z-index: 1000; }
    </style>
</head>
<body>
    <div class="sync-status" id="syncStatus">🔄 Connecting...</div>
    
    <div class="main-header">
        <div class="header-content">
            <div><div class="logo">LUNAS</div><div class="tagline">Beauty Salon & Spa</div></div>
            <div class="nav-buttons">
                <button class="nav-btn active" id="navSurvey"><i class="fas fa-clipboard-list"></i> Client Survey</button>
                <button class="nav-btn" id="navDashboard"><i class="fas fa-chart-line"></i> Analytics Dashboard</button>
            </div>
        </div>
    </div>
    
    <div class="container">
        <section id="surveySection"></section>
        <section id="dashboardSection"></section>
    </div>

    <div id="toastMsg" class="toast-success"><i class="fas fa-check-circle"></i><span>Thank you!</span><i class="fas fa-times-circle" style="margin-left: 12px;"></i></div>

    <script>
        const SUPABASE_URL = "https://jxbyfvghztsnvcixnzlr.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4YnlmdmdoenRzbnZjaXhuemxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NTg3NzUsImV4cCI6MjA5NjIzNDc3NX0.2zweytKYGXnvnnXa2W1t48Rb4f08N8qSIrZuw0ZFEAo";
        
        let supabase;
        let dbConnected = false;
        
        async function initSupabase() {
            const statusEl = document.getElementById('syncStatus');
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            statusEl.innerHTML = '✅ Cloud ready';
            statusEl.style.background = 'rgba(46, 204, 113, 0.9)';
            dbConnected = true;
        }
        
        async function saveToCloud(surveyData, clientId) {
            try {
                await supabase.from('clients').insert([{
                    id: clientId,
                    client_type: surveyData.clientInfo.clientType,
                    phone: surveyData.clientInfo.phone || null,
                    visit_date: surveyData.clientInfo.visitDate,
                    services: JSON.stringify(surveyData.services),
                    rating: parseInt(surveyData.ratings.overall),
                    staff_rating: surveyData.ratings.staff ? parseInt(surveyData.ratings.staff) : null,
                    cleanliness_rating: surveyData.ratings.cleanliness ? parseInt(surveyData.ratings.cleanliness) : null,
                    wait_time_rating: surveyData.ratings.waitTime ? parseInt(surveyData.ratings.waitTime) : null,
                    employee_shoutout: surveyData.employeeShoutout || null,
                    submission_date: new Date().toISOString()
                }]);
                
                await supabase.from('feedback').insert([{
                    id: clientId + '_fb',
                    client_id: clientId,
                    type: surveyData.feedback.type,
                    text: surveyData.feedback.text,
                    recommendation: surveyData.feedback.recommendation,
                    improvements: surveyData.feedback.improvements || null,
                    employee_shoutout: surveyData.employeeShoutout || null,
                    date: new Date().toISOString()
                }]);
                
                for (const sp of surveyData.servicePerceptions) {
                    await supabase.from('service_perceptions').insert([{
                        client_id: clientId,
                        service: sp.service,
                        rating: sp.rating,
                        comment: sp.comment || null
                    }]);
                }
                
                for (const svc of surveyData.services) {
                    const { data: existing } = await supabase.from('service_counts').select('count').eq('service', svc);
                    if (existing && existing.length > 0) {
                        await supabase.from('service_counts').update({ count: existing[0].count + 1 }).eq('service', svc);
                    } else {
                        await supabase.from('service_counts').insert([{ service: svc, count: 1 }]);
                    }
                }
                
                if (surveyData.employeeShoutout) {
                    await supabase.from('employee_shoutouts').insert([{
                        client_id: clientId,
                        employee: surveyData.employeeShoutout,
                        date: new Date().toISOString()
                    }]);
                }
                
                return true;
            } catch (err) {
                console.error("Cloud save error:", err);
                return false;
            }
        }
        
        function showToast(msg) {
            const toast = document.getElementById('toastMsg');
            toast.querySelector('span').textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }
        
        if (!localStorage.getItem('lunasBusinessData')) {
            localStorage.setItem('lunasBusinessData', JSON.stringify({
                clients: [], services: [], feedback: [], servicePerceptions: [], employeeShoutouts: [],
                newClientsCount: 0, returningClientsCount: 0, startDate: new Date().toISOString()
            }));
        }
        
        document.getElementById('navSurvey').onclick = () => switchSection('survey');
        document.getElementById('navDashboard').onclick = () => switchSection('dashboard');
        
        function switchSection(section) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if (section === 'survey') {
                document.getElementById('navSurvey').classList.add('active');
                document.getElementById('surveySection').style.display = 'block';
                document.getElementById('dashboardSection').style.display = 'none';
                loadSurveyTool();
            } else {
                document.getElementById('navDashboard').classList.add('active');
                document.getElementById('surveySection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                loadDashboard();
            }
        }
        
        const SERVICES = ["Gel Polish","Tips","Builder Gel","Gumgel Overlay","Gumgel Sculpting","Pedicure","Manicure","Piercing","Wig Installation and Styling","Wig Laundry","Eyelash Extension","Waxing","Facial","Massage","Braiding","Wash and Blow","Brow Shaping","Dreadlock Installation/Retouch","Flat Ironing","Other"];
        
        function loadSurveyTool() {
            let servicesHtml = `<div class="services-enhanced">`;
            SERVICES.forEach(svc => {
                servicesHtml += `
                    <div class="service-card-enh">
                        <div class="service-header-enh">
                            <input type="checkbox" name="service" class="service-check" value="${svc}">
                            <span>${svc}</span>
                        </div>
                        <div class="service-rating-enh">
                            <div class="stars-enh">${[1,2,3,4,5].map(s => `<span data-star="${s}">★</span>`).join('')}</div>
                            <div class="comment-enh"><input type="text" class="svc-comment" placeholder="Your experience with ${svc}..."></div>
                        </div>
                    </div>
                `;
            });
            servicesHtml += `</div><div class="form-group"><label>If "Other", please specify:</label><input type="text" id="otherServiceField" placeholder="Describe the service"></div>`;
            
            const surveyHTML = `
                <div class="survey-header"><h1 class="survey-title">✨ Client Satisfaction Survey ✨</h1><p>Thank you for choosing LUNAS.</p></div>
                <div class="progress-container"><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div>
                
                <div class="survey-card active" id="card1">
                    <div class="card-header"><h2><i class="fas fa-user"></i> Contact Information</h2></div>
                    <form id="clientInfoForm">
                        <div class="form-group"><label>Phone Number</label><input type="tel" id="clientPhone"></div>
                        <div class="form-group"><label>Date of Visit <span class="required">*</span></label><input type="date" id="visitDate" required></div>
                        <div class="form-group"><label>First visit? <span class="required">*</span></label><select id="clientType" required><option value="">Select</option><option value="new">Yes, first time</option><option value="returning">No, I've been here before</option></select></div>
                    </form>
                    <div class="btn-container"><button class="btn btn-secondary" disabled>Previous</button><button class="btn btn-primary" id="next1">Next →</button></div>
                </div>
                
                <div class="survey-card" id="card2">
                    <div class="card-header"><h2><i class="fas fa-spa"></i> Services & Your Experience</h2><p>Select services, rate with stars, add a comment</p></div>
                    <form id="servicesForm">${servicesHtml}</form>
                    <div class="form-group" style="margin-top:25px; background: #FFF9EF; padding: 22px; border-radius: 24px;">
                        <label>🌟 Shout-out to an amazing employee!</label>
                        <textarea id="employeeShoutoutField" rows="2" placeholder="e.g., Sarah made my nails perfect!"></textarea>
                    </div>
                    <div class="btn-container"><button class="btn btn-secondary" id="prev2">← Back</button><button class="btn btn-primary" id="next2">Next →</button></div>
                </div>
                
                <div class="survey-card" id="card3">
                    <div class="card-header"><h2><i class="fas fa-star"></i> Service Quality</h2></div>
                    <form id="qualityForm">
                        <div class="form-group"><label>Overall Service Quality <span class="required">*</span></label><div class="rating-container" id="ratingContainer"><div class="rating-option" data-value="1">Poor</div><div class="rating-option" data-value="2">Fair</div><div class="rating-option" data-value="3">Good</div><div class="rating-option" data-value="4">Very Good</div><div class="rating-option" data-value="5">Excellent</div></div><input type="hidden" id="overallRating" required></div>
                        <div class="form-group"><label>Staff Friendliness</label><select id="staffRating"><option value="">Select</option><option value="5">Excellent</option><option value="4">Very Good</option><option value="3">Good</option><option value="2">Fair</option><option value="1">Poor</option></select></div>
                        <div class="form-group"><label>Cleanliness</label><select id="cleanlinessRating"><option value="">Select</option><option value="5">Excellent</option><option value="4">Very Good</option><option value="3">Good</option><option value="2">Fair</option><option value="1">Poor</option></select></div>
                        <div class="form-group"><label>Wait Time</label><select id="waitTimeRating"><option value="">Select</option><option value="5">Excellent - No wait</option><option value="4">Very Good - Minimal</option><option value="3">Good - Reasonable</option><option value="2">Fair - Longer</option><option value="1">Poor - Excessive</option></select></div>
                    </form>
                    <div class="btn-container"><button class="btn btn-secondary" id="prev3">← Back</button><button class="btn btn-primary" id="next3">Next →</button></div>
                </div>
                
                <div class="survey-card" id="card4">
                    <div class="card-header"><h2><i class="fas fa-comment-dots"></i> Your Feedback</h2></div>
                    <form id="feedbackForm">
                        <div class="form-group"><label>Feedback Type <span class="required">*</span></label><select id="feedbackType" required><option value="">Select</option><option value="compliment">Compliment</option><option value="suggestion">Suggestion</option><option value="complaint">Complaint</option></select></div>
                        <div class="form-group"><label>Your Feedback <span class="required">*</span></label><textarea id="feedbackText" required></textarea></div>
                        <div class="form-group"><label>Would you recommend us? <span class="required">*</span></label><select id="recommendation" required><option value="">Select</option><option value="yes-definitely">Yes, definitely</option><option value="yes-probably">Yes, probably</option><option value="not-sure">Not sure</option><option value="probably-not">Probably not</option><option value="no">No</option></select></div>
                        <div class="form-group"><label>How can we improve?</label><textarea id="improvementSuggestions"></textarea></div>
                    </form>
                    <div class="btn-container"><button class="btn btn-secondary" id="prev4">← Back</button><button class="btn btn-primary" id="submitSurveyBtn">Submit Survey ✨</button></div>
                </div>
                
                <div class="survey-card thank-you-card" id="thankYouCard">
                    <div class="thank-you-icon"><i class="fas fa-heart"></i></div>
                    <h2>Thank You!</h2>
                    <p>Your feedback has been submitted.</p>
                    <div class="social-icons">
                        <a href="https://www.instagram.com/lunas_parlour" target="_blank" class="social-icon"><div class="social-circle instagram"><i class="fab fa-instagram"></i></div><div>Instagram</div></a>
                        <a href="https://www.tiktok.com/@lunasbeautyparlour" target="_blank" class="social-icon"><div class="social-circle tiktok"><i class="fab fa-tiktok"></i></div><div>TikTok</div></a>
                        <a href="https://wa.me/233700422752" target="_blank" class="social-icon"><div class="social-circle whatsapp"><i class="fab fa-whatsapp"></i></div><div>WhatsApp</div></a>
                    </div>
                    <button class="btn btn-primary" id="newSurveyBtn" style="max-width:300px; margin:30px auto 0;">Submit Another</button>
                </div>
            `;
            document.getElementById('surveySection').innerHTML = surveyHTML;
            initializeSurvey();
        }
        
        function initializeSurvey() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('visitDate').value = today;
            document.getElementById('visitDate').max = today;
            
            document.querySelectorAll('.service-card-enh').forEach(card => {
                const chk = card.querySelector('.service-check');
                card.addEventListener('click', (e) => {
                    if (e.target.tagName !== 'INPUT') {
                        chk.checked = !chk.checked;
                        if (chk.checked) card.classList.add('selected');
                        else card.classList.remove('selected');
                    }
                });
                chk.addEventListener('change', () => {
                    if (chk.checked) card.classList.add('selected');
                    else card.classList.remove('selected');
                });
            });
            
            document.querySelectorAll('.stars-enh').forEach(stars => {
                const starSpans = stars.querySelectorAll('span');
                starSpans.forEach(star => {
                    star.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const val = parseInt(this.dataset.star);
                        starSpans.forEach((s, i) => {
                            if (i < val) s.classList.add('active');
                            else s.classList.remove('active');
                        });
                    });
                });
            });
            
            document.querySelectorAll('#ratingContainer .rating-option').forEach(opt => {
                opt.addEventListener('click', function() {
                    document.getElementById('overallRating').value = this.dataset.value;
                    document.querySelectorAll('#ratingContainer .rating-option').forEach(o => o.classList.remove('selected'));
                    this.classList.add('selected');
                });
            });
            
            const showCard = (n) => {
                document.querySelectorAll('.survey-card').forEach(c => c.classList.remove('active'));
                document.getElementById(`card${n}`).classList.add('active');
                document.getElementById('progressFill').style.width = `${((n-1)/4)*100}%`;
            };
            
            document.getElementById('next1').onclick = () => { if(document.getElementById('clientInfoForm').checkValidity()) showCard(2); else document.getElementById('clientInfoForm').reportValidity(); };
            document.getElementById('next2').onclick = () => { if(document.querySelectorAll('.service-check:checked').length > 0) showCard(3); else alert('Please select at least one service.'); };
            document.getElementById('next3').onclick = () => { if(document.getElementById('overallRating').value) showCard(4); else alert('Please rate overall service quality.'); };
            document.getElementById('prev2').onclick = () => showCard(1);
            document.getElementById('prev3').onclick = () => showCard(2);
            document.getElementById('prev4').onclick = () => showCard(3);
            
            document.getElementById('submitSurveyBtn').onclick = async function() {
                if (document.getElementById('feedbackForm').checkValidity()) {
                    await submitSurveyData();
                } else {
                    document.getElementById('feedbackForm').reportValidity();
                }
            };
            
            document.getElementById('newSurveyBtn').onclick = () => location.reload();
        }
        
        async function submitSurveyData() {
            const serviceRatings = [];
            document.querySelectorAll('.service-check:checked').forEach(cb => {
                let svc = cb.value;
                const card = cb.closest('.service-card-enh');
                const starCount = card.querySelectorAll('.stars-enh span.active').length;
                const comment = card.querySelector('.svc-comment')?.value || '';
                serviceRatings.push({ service: svc, rating: starCount, comment: comment });
            });
            
            const otherVal = document.getElementById('otherServiceField')?.value;
            if (otherVal && serviceRatings.some(s => s.service === 'Other')) {
                const idx = serviceRatings.findIndex(s => s.service === 'Other');
                if (idx !== -1) serviceRatings[idx].service = otherVal;
            }
            
            const surveyData = {
                clientInfo: { phone: document.getElementById('clientPhone').value, visitDate: document.getElementById('visitDate').value, clientType: document.getElementById('clientType').value },
                services: serviceRatings.map(s => s.service),
                ratings: { overall: document.getElementById('overallRating').value, staff: document.getElementById('staffRating').value, cleanliness: document.getElementById('cleanlinessRating').value, waitTime: document.getElementById('waitTimeRating').value },
                feedback: { type: document.getElementById('feedbackType').value, text: document.getElementById('feedbackText').value, recommendation: document.getElementById('recommendation').value, improvements: document.getElementById('improvementSuggestions').value },
                employeeShoutout: document.getElementById('employeeShoutoutField').value,
                servicePerceptions: serviceRatings
            };
            
            const clientId = 'LUN' + Date.now().toString().slice(-8);
            
            const saved = await saveToCloud(surveyData, clientId);
            
            const businessData = JSON.parse(localStorage.getItem('lunasBusinessData'));
            businessData.clients.push({
                id: clientId, type: surveyData.clientInfo.clientType, phone: surveyData.clientInfo.phone, visitDate: surveyData.clientInfo.visitDate,
                services: surveyData.services, rating: parseInt(surveyData.ratings.overall),
                staffRating: surveyData.ratings.staff ? parseInt(surveyData.ratings.staff) : null,
                cleanlinessRating: surveyData.ratings.cleanliness ? parseInt(surveyData.ratings.cleanliness) : null,
                waitTimeRating: surveyData.ratings.waitTime ? parseInt(surveyData.ratings.waitTime) : null,
                employeeShoutout: surveyData.employeeShoutout, submissionDate: new Date().toISOString()
            });
            
            if (surveyData.clientInfo.clientType === 'new') businessData.newClientsCount++; else businessData.returningClientsCount++;
            
            surveyData.services.forEach(svc => { const ex = businessData.services.find(s => s.name === svc); if(ex) ex.count++; else businessData.services.push({ name: svc, count: 1 }); });
            surveyData.servicePerceptions.forEach(sp => businessData.servicePerceptions.push(sp));
            if (surveyData.employeeShoutout) businessData.employeeShoutouts.push({ employee: surveyData.employeeShoutout });
            businessData.feedback.push({ type: surveyData.feedback.type, text: surveyData.feedback.text, recommendation: surveyData.feedback.recommendation });
            
            localStorage.setItem('lunasBusinessData', JSON.stringify(businessData));
            
            document.getElementById('thankYouCard').classList.add('active');
            document.getElementById('card4').classList.remove('active');
            document.getElementById('progressFill').style.width = '100%';
            showToast(saved ? '✨ Saved to cloud! ✨' : '✨ Saved locally! ✨');
        }
        
        async function loadDashboard() {
            if (localStorage.getItem('lunasLoggedIn') === 'true') showDashboard();
            else showLogin();
        }
        
        function showLogin() {
            document.getElementById('dashboardSection').innerHTML = `<div class="login-container"><div class="login-card"><i class="fas fa-chart-line" style="font-size:3rem; color:var(--primary-color);"></i><h2>LUNAS Analytics</h2><div class="form-group"><input type="text" id="username" placeholder="Username"></div><div class="form-group"><input type="password" id="password" placeholder="Password"></div><button class="btn btn-primary" id="loginBtn">Login</button><div class="login-error" id="loginError">Username: admin | Password: lunas2025</div></div></div>`;
            document.getElementById('loginBtn').onclick = () => {
                if (document.getElementById('username').value === 'admin' && document.getElementById('password').value === 'lunas2025') {
                    localStorage.setItem('lunasLoggedIn', 'true');
                    loadDashboard();
                } else document.getElementById('loginError').style.display = 'block';
            };
        }
        
        function showDashboard() {
            const data = JSON.parse(localStorage.getItem('lunasBusinessData'));
            const avgRating = data.clients.length ? (data.clients.reduce((a,b)=>a+(b.rating||0),0)/data.clients.length).toFixed(1) : '0.0';
            
            document.getElementById('dashboardSection').innerHTML = `
                <div class="dashboard-header"><div><h1>Analytics Dashboard</h1><p>Client Feedback Insights</p></div><button class="logout-btn" id="logoutBtn">Logout</button></div>
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-number">${data.clients.length}</div><div>Total Clients</div><small>${data.newClientsCount} new · ${data.returningClientsCount} returning</small></div>
                    <div class="stat-card"><div class="stat-number">${avgRating}</div><div>Average Rating</div></div>
                    <div class="stat-card"><div class="stat-number">${data.clients.reduce((a,c)=>a+(c.services?.length||0),0)}</div><div>Services Used</div></div>
                    <div class="stat-card"><div class="stat-number">${data.feedback.length}</div><div>Feedbacks</div></div>
                </div>
                <div class="dashboard-card"><h2>Recent Feedback</h2>${data.feedback.slice(-5).reverse().map(fb => `<div class="feedback-item"><strong>${fb.type}</strong><br>${fb.text.substring(0,100)}<br><small>👍 ${fb.recommendation}</small></div>`).join('') || '<p>No feedback yet</p>'}</div>
                <div class="dashboard-card"><button class="btn btn-primary" id="exportBtn">Export CSV</button><button class="btn btn-danger" id="deleteBtn" style="margin-left:15px;">Delete All</button></div>
            `;
            
            document.getElementById('logoutBtn').onclick = () => { localStorage.removeItem('lunasLoggedIn'); loadDashboard(); };
            document.getElementById('exportBtn').onclick = () => {
                let csv = "Client,Rating,Shoutout\n";
                data.clients.forEach(c => csv += `${c.id},${c.rating},"${c.employeeShoutout || ''}"\n`);
                const blob = new Blob([csv], {type:'text/csv'});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'lunas_data.csv';
                a.click();
                alert('✅ CSV exported!');
            };
            document.getElementById('deleteBtn').onclick = () => {
                if (confirm('Delete all data?')) {
                    localStorage.setItem('lunasBusinessData', JSON.stringify({ clients:[], services:[], feedback:[], servicePerceptions:[], employeeShoutouts:[], newClientsCount:0, returningClientsCount:0, startDate:new Date().toISOString() }));
                    loadDashboard();
                    alert('✅ All data deleted.');
                }
            };
        }
        
        initSupabase().then(() => loadSurveyTool());
    </script>
</body>
</html>
