<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUNAS Beauty Salon - Client Survey & Analytics System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #006850;
            --secondary-color: #FBB040;
            --dark-color: #000000;
            --light-color: #FFFFFF;
            --light-bg: #f0f4f8;
            --card-bg: #ffffff;
            --text-dark: #1a2a3a;
            --text-light: #5a6e7c;
            --border-color: #e2e8f0;
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
            --warning-color: #f39c12;
            --purple: #8b5cf6;
            --cyan: #06b6d4;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', 'Segoe UI', sans-serif; }
        body { background: linear-gradient(145deg, #f0f4f8 0%, #e6edf4 100%); min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
        
        .main-header { background: linear-gradient(135deg, var(--primary-color), #00875a); padding: 24px 0; margin-bottom: 32px; box-shadow: 0 15px 30px -12px rgba(0,0,0,0.2); }
        .header-content { max-width: 1400px; margin: 0 auto; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { font-family: 'Playfair Display', serif; font-size: 2.8rem; font-weight: 700; color: white; letter-spacing: 2px; text-transform: uppercase; }
        .tagline { font-size: 1rem; color: rgba(255,255,255,0.9); letter-spacing: 4px; text-transform: uppercase; margin-top: 5px; }
        .nav-buttons { display: flex; gap: 15px; }
        .nav-btn { padding: 12px 28px; background-color: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); border-radius: 40px; font-weight: 600; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 10px; color: white; }
        .nav-btn:hover { background-color: rgba(255,255,255,0.25); transform: translateY(-2px); }
        .nav-btn.active { background-color: var(--secondary-color); color: var(--dark-color); }
        
        #surveySection { display: block; }
        #dashboardSection { display: none; }
        
        .survey-header { text-align: center; margin-bottom: 40px; padding: 35px; background: linear-gradient(135deg, rgba(0,104,80,0.08), rgba(251,176,64,0.08)); border-radius: 28px; }
        .survey-title { font-size: 2.5rem; color: var(--primary-color); margin-bottom: 15px; }
        .survey-subtitle { font-size: 1.1rem; color: var(--text-light); max-width: 700px; margin: 0 auto; }
        
        .progress-container { margin-bottom: 40px; }
        .progress-bar { height: 8px; background-color: var(--border-color); border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(to right, var(--primary-color), var(--secondary-color)); width: 0%; transition: width 0.5s ease; }
        
        .survey-card { background-color: var(--card-bg); border-radius: 32px; padding: 44px 48px; box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1); margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.5); display: none; }
        .survey-card.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-header { margin-bottom: 30px; }
        .card-header h2 { font-size: 1.8rem; color: var(--primary-color); margin-bottom: 10px; }
        
        .form-group { margin-bottom: 28px; }
        label { display: block; font-weight: 600; margin-bottom: 10px; color: var(--dark-color); }
        .required { color: var(--danger-color); }
        input, select, textarea { width: 100%; padding: 16px 20px; border: 2px solid var(--border-color); border-radius: 20px; font-size: 1rem; transition: all 0.3s; background: white; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 4px rgba(0,104,80,0.1); }
        textarea { min-height: 100px; resize: vertical; }
        
        /* Per-Service Rating Cards */
        .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; margin: 20px 0; }
        .service-card { background: #f8fafc; border-radius: 24px; border: 2px solid var(--border-color); transition: all 0.3s; overflow: hidden; }
        .service-card.selected { border-color: var(--primary-color); background: white; box-shadow: 0 8px 20px rgba(0,104,80,0.1); }
        .service-header { display: flex; align-items: center; padding: 18px 20px; cursor: pointer; }
        .service-header input { width: 22px; height: 22px; margin-right: 15px; cursor: pointer; accent-color: var(--primary-color); }
        .service-header span { font-weight: 600; font-size: 1rem; flex: 1; cursor: pointer; }
        .service-rating-area { padding: 0 20px 20px 20px; background: white; border-top: 1px dashed var(--border-color); display: none; }
        .service-card.selected .service-rating-area { display: block; }
        .star-group { display: flex; gap: 8px; margin: 15px 0 12px 0; }
        .star-group span { font-size: 1.8rem; cursor: pointer; color: #cbd5e1; transition: 0.1s; }
        .star-group span.active { color: var(--secondary-color); text-shadow: 0 0 4px rgba(251,176,64,0.4); }
        .service-comment-input input { width: 100%; padding: 12px 16px; border-radius: 40px; border: 1px solid var(--border-color); }
        
        .rating-container { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin: 15px 0; }
        .rating-option { flex: 1; min-width: 100px; text-align: center; padding: 14px 10px; background: #f8fafc; border-radius: 60px; cursor: pointer; border: 2px solid var(--border-color); font-weight: 500; transition: 0.2s; }
        .rating-option.selected { background: var(--primary-color); color: white; border-color: var(--primary-color); }
        .rating-option i { font-size: 1.4rem; margin-bottom: 4px; display: block; }
        
        .btn-container { display: flex; justify-content: space-between; margin-top: 45px; gap: 20px; }
        .btn { padding: 16px 35px; border-radius: 60px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 12px; flex: 1; border: none; }
        .btn-primary { background: linear-gradient(to right, var(--primary-color), #00875a); color: white; }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,104,80,0.3); }
        .btn-secondary { background: #f1f5f9; color: var(--dark-color); border: 1px solid var(--border-color); }
        .btn-danger { background: linear-gradient(to right, var(--danger-color), #c0392b); color: white; }
        
        .thank-you-card { text-align: center; padding: 60px 40px; display: none; }
        .thank-you-card.active { display: block; }
        .thank-you-icon { font-size: 5rem; color: var(--primary-color); margin-bottom: 30px; }
        
        .social-icons { display: flex; justify-content: center; gap: 35px; flex-wrap: wrap; margin: 30px 0; }
        .social-icon { text-decoration: none; text-align: center; transition: 0.3s; }
        .social-icon:hover { transform: translateY(-5px); }
        .social-circle { width: 75px; height: 75px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; color: white; margin: 0 auto 12px; }
        .instagram { background: linear-gradient(45deg, #405DE6, #E1306C); }
        .tiktok { background: linear-gradient(45deg, #000000, #25F4EE); }
        .whatsapp { background: #25D366; }
        .social-name { font-weight: 600; color: var(--text-dark); }
        .social-handle { font-size: 0.8rem; color: var(--text-light); }
        
        /* Modern Dashboard */
        .dashboard-header { background: linear-gradient(135deg, var(--primary-color), #00875a); border-radius: 28px; padding: 28px 35px; color: white; display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; }
        .logout-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); padding: 12px 25px; border-radius: 40px; cursor: pointer; color: white; font-weight: 600; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 25px; margin-bottom: 35px; }
        .stat-card { background: white; border-radius: 24px; padding: 22px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); transition: 0.3s; border-bottom: 4px solid var(--secondary-color); }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .stat-number { font-size: 2.5rem; font-weight: 800; color: var(--primary-color); line-height: 1; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 28px; margin-bottom: 35px; }
        .dashboard-card { background: white; border-radius: 28px; padding: 28px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        .chart-container { height: 260px; margin-top: 15px; }
        .feedback-item { padding: 18px; border-radius: 20px; margin-bottom: 14px; background: #fafcff; border-left: 5px solid var(--primary-color); transition: 0.2s; }
        .feedback-item:hover { transform: translateX(5px); background: white; }
        .per-service-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eef2f8; }
        
        @media (max-width: 768px) { .container { padding: 16px; } .survey-card { padding: 28px 24px; } .btn-container { flex-direction: column; } .btn { width: 100%; } .dashboard-grid { grid-template-columns: 1fr; } }
        
        .success-toast { position: fixed; bottom: 30px; right: 30px; background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; padding: 16px 28px; border-radius: 50px; display: flex; align-items: center; gap: 12px; font-weight: 600; z-index: 1000; transform: translateX(400px); transition: 0.3s; cursor: pointer; }
        .success-toast.show { transform: translateX(0); }
    </style>
</head>
<body>
    <div class="main-header">
        <div class="header-content">
            <div><div class="logo">LUNAS</div><div class="tagline">Beauty Salon & Spa</div></div>
            <div class="nav-buttons">
                <button class="nav-btn active" id="navSurvey"><i class="fas fa-clipboard-list"></i> Client Survey</button>
                <button class="nav-btn" id="navDashboard"><i class="fas fa-chart-line"></i> Analytics Dashboard</button>
            </div>
        </div>
    </div>
    
    <div class="container">
        <section id="surveySection"></section>
        <section id="dashboardSection"></section>
    </div>

    <div id="successToast" class="success-toast"><i class="fas fa-check-circle"></i><span>Thank you! Your feedback has been recorded.</span><i class="fas fa-times-circle" style="margin-left: 10px;"></i></div>

    <script>
        function showSuccessMessage(msg) {
            const toast = document.getElementById('successToast');
            toast.querySelector('span').textContent = msg || '✨ Thank you! Your feedback has been recorded! ✨';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
            toast.onclick = (e) => { if(e.target.classList.contains('fa-times-circle')) toast.classList.remove('show'); };
        }
        
        if (!localStorage.getItem('lunasBusinessData')) {
            localStorage.setItem('lunasBusinessData', JSON.stringify({
                clients: [], services: [], feedback: [], servicePerceptions: [], employeeShoutouts: [],
                newClientsCount: 0, returningClientsCount: 0, startDate: new Date().toISOString()
            }));
        }
        
        // Navigation
        document.getElementById('navSurvey').onclick = () => switchSection('survey');
        document.getElementById('navDashboard').onclick = () => switchSection('dashboard');
        
        function switchSection(section) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if (section === 'survey') {
                document.getElementById('navSurvey').classList.add('active');
                document.getElementById('surveySection').style.display = 'block';
                document.getElementById('dashboardSection').style.display = 'none';
                loadSurveyTool();
            } else {
                document.getElementById('navDashboard').classList.add('active');
                document.getElementById('surveySection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                loadDashboard();
            }
        }
        
        const SERVICES = ["Gel Polish","Tips","Builder Gel","Gumgel Overlay","Gumgel Sculpting","Pedicure","Manicure","Piercing","Wig Installation and Styling","Wig Laundry","Eyelash Extension","Waxing","Facial","Massage","Braiding","Wash and Blow","Brow Shaping","Dreadlock Installation/Retouch","Flat Ironing","Other"];
        
        function loadSurveyTool() {
            let servicesHtml = `<div class="services-grid">`;
            SERVICES.forEach(svc => {
                servicesHtml += `
                    <div class="service-card" data-service="${svc}">
                        <div class="service-header">
                            <input type="checkbox" class="service-check" name="service" value="${svc}">
                            <span>${svc}</span>
                        </div>
                        <div class="service-rating-area">
                            <div class="star-group">${[1,2,3,4,5].map(s => `<span data-star="${s}">★</span>`).join('')}</div>
                            <div class="service-comment-input"><input type="text" class="svc-comment" placeholder="Share your experience with ${svc}..."></div>
                        </div>
                    </div>
                `;
            });
            servicesHtml += `</div><div class="form-group"><label for="otherService">If "Other", please specify:</label><input type="text" id="otherService" placeholder="Describe the service"></div>`;
            
            const surveyHTML = `
                <div class="survey-header"><h1 class="survey-title">Client Satisfaction Survey</h1><p class="survey-subtitle">Thank you for choosing LUNAS. Your feedback helps us improve.</p></div>
                <div class="progress-container"><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div>
                
                <div class="survey-card active" id="card1">
                    <div class="card-header"><h2><i class="fas fa-user"></i> Contact Information</h2><p>We'd love to stay in touch</p></div>
                    <form id="clientInfoForm">
                        <div class="form-group"><label>Phone Number</label><input type="tel" id="clientPhone" placeholder="Enter your phone number"></div>
                        <div class="form-group"><label>Date of Visit <span class="required">*</span></label><input type="date" id="visitDate" required></div>
                        <div class="form-group"><label>Is this your first visit to LUNAS? <span class="required">*</span></label><select id="clientType" required><option value="">Select</option><option value="new">Yes, first time</option><option value="returning">No, I've been here before</option></select></div>
                    </form>
                    <div class="btn-container"><button class="btn btn-secondary" disabled>Previous</button><button class="btn btn-primary" id="next1">Next <i class="fas fa-arrow-right"></i></button></div>
                </div>
                
                <div class="survey-card" id="card2">
                    <div class="card-header"><h2><i class="fas fa-spa"></i> Services Received</h2><p>Select services & rate each one with stars</p></div>
                    <form id="servicesForm">${servicesHtml}</form>
                    <div class="form-group" style="background:#FFF9EF; padding:20px; border-radius:24px; margin-top:20px;">
                        <label><i class="fas fa-star-of-life" style="color:var(--secondary-color);"></i> 🌟 Shout-out to an amazing employee!</label>
                        <textarea id="employeeShoutout" rows="2" placeholder="e.g., Sarah made my nails perfect!"></textarea>
                    </div>
                    <div class="btn-container"><button class="btn btn-secondary" id="prev2"><i class="fas fa-arrow-left"></i> Previous</button><button class="btn btn-primary" id="next2">Next <i class="fas fa-arrow-right"></i></button></div>
                </div>
                
                <div class="survey-card" id="card3">
                    <div class="card-header"><h2><i class="fas fa-star"></i> Service Quality</h2><p>How would you rate the quality of services you received?</p></div>
                    <form id="qualityForm">
                        <div class="form-group"><label>Overall Service Quality <span class="required">*</span></label><div class="rating-container" id="ratingContainer"><div class="rating-option poor" data-value="1"><i class="fas fa-frown"></i>Poor</div><div class="rating-option fair" data-value="2"><i class="fas fa-meh"></i>Fair</div><div class="rating-option good" data-value="3"><i class="fas fa-smile"></i>Good</div><div class="rating-option very-good" data-value="4"><i class="fas fa-smile-beam"></i>Very Good</div><div class="rating-option excellent" data-value="5"><i class="fas fa-grin-stars"></i>Excellent</div></div><input type="hidden" id="overallRating" required></div>
                        <div class="form-group"><label>Staff Friendliness & Professionalism</label><select id="staffRating"><option value="">Select</option><option value="5">Excellent</option><option value="4">Very Good</option><option value="3">Good</option><option value="2">Fair</option><option value="1">Poor</option></select></div>
                        <div class="form-group"><label>Cleanliness of the Salon/Spa</label><select id="cleanlinessRating"><option value="">Select</option><option value="5">Excellent</option><option value="4">Very Good</option><option value="3">Good</option><option value="2">Fair</option><option value="1">Poor</option></select></div>
                        <div class="form-group"><label>Wait Time & Appointment Punctuality</label><select id="waitTimeRating"><option value="">Select</option><option value="5">Excellent - No wait</option><option value="4">Very Good - Minimal wait</option><option value="3">Good - Reasonable</option><option value="2">Fair - Longer</option><option value="1">Poor - Excessive</option></select></div>
                    </form>
                    <div class="btn-container"><button class="btn btn-secondary" id="prev3"><i class="fas fa-arrow-left"></i> Previous</button><button class="btn btn-primary" id="next3">Next <i class="fas fa-arrow-right"></i></button></div>
                </div>
                
                <div class="survey-card" id="card4">
                    <div class="card-header"><h2><i class="fas fa-comment-dots"></i> Your Feedback</h2><p>Please share any additional comments</p></div>
                    <form id="feedbackForm">
                        <div class="form-group"><label>Type of Feedback <span class="required">*</span></label><select id="feedbackType" required><option value="">Select</option><option value="compliment">Compliment</option><option value="suggestion">Suggestion</option><option value="complaint">Complaint</option></select></div>
                        <div class="form-group"><label>Your Detailed Feedback <span class="required">*</span></label><textarea id="feedbackText" required></textarea></div>
                        <div class="form-group"><label>Would you recommend us? <span class="required">*</span></label><select id="recommendation" required><option value="">Select</option><option value="yes-definitely">Yes, definitely</option><option value="yes-probably">Yes, probably</option><option value="not-sure">Not sure</option><option value="probably-not">Probably not</option><option value="no">No</option></select></div>
                        <div class="form-group"><label>How can we improve?</label><textarea id="improvementSuggestions"></textarea></div>
                    </form>
                    <div class="btn-container"><button class="btn btn-secondary" id="prev4"><i class="fas fa-arrow-left"></i> Previous</button><button class="btn btn-primary" id="submitSurvey">Submit Survey <i class="fas fa-paper-plane"></i></button></div>
                </div>
                
                <div class="survey-card thank-you-card" id="thankYouCard">
                    <div class="thank-you-icon"><i class="fas fa-heart"></i></div>
                    <h2>Thank You!</h2>
                    <p>Your feedback has been successfully submitted. We truly value your input!</p>
                    <div class="social-icons">
                        <a href="https://www.instagram.com/lunas_parlour" target="_blank" class="social-icon"><div class="social-circle instagram"><i class="fab fa-instagram"></i></div><div class="social-name">Instagram</div><div class="social-handle">@lunas_parlour</div></a>
                        <a href="https://www.tiktok.com/@lunasbeautyparlour" target="_blank" class="social-icon"><div class="social-circle tiktok"><i class="fab fa-tiktok"></i></div><div class="social-name">TikTok</div><div class="social-handle">@lunasbeautyparlour</div></a>
                        <a href="https://wa.me/233700422752" target="_blank" class="social-icon"><div class="social-circle whatsapp"><i class="fab fa-whatsapp"></i></div><div class="social-name">WhatsApp</div><div class="social-handle">0700 422 752</div></a>
                    </div>
                    <button class="btn btn-primary" id="newSurvey" style="max-width:300px; margin:30px auto 0;"><i class="fas fa-redo"></i> Submit Another Feedback</button>
                </div>
            `;
            document.getElementById('surveySection').innerHTML = surveyHTML;
            initializeSurvey();
        }
        
        function initializeSurvey() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('visitDate').value = today;
            document.getElementById('visitDate').max = today;
            
            // Service card click handlers
            document.querySelectorAll('.service-card').forEach(card => {
                const chk = card.querySelector('.service-check');
                const header = card.querySelector('.service-header');
                header.onclick = (e) => { if(e.target.tagName !== 'INPUT') { chk.checked = !chk.checked; if(chk.checked) card.classList.add('selected'); else card.classList.remove('selected'); } };
                chk.onchange = (e) => { e.stopPropagation(); if(chk.checked) card.classList.add('selected'); else card.classList.remove('selected'); };
            });
            
            // Star ratings
            document.querySelectorAll('.star-group').forEach(group => {
                const stars = group.querySelectorAll('span');
                stars.forEach(star => star.onclick = function(e) { e.stopPropagation(); const val = parseInt(this.dataset.star); stars.forEach((s, i) => { if(i < val) s.classList.add('active'); else s.classList.remove('active'); }); });
            });
            
            // Overall rating
            document.querySelectorAll('#ratingContainer .rating-option').forEach(opt => {
                opt.onclick = function() { document.getElementById('overallRating').value = this.dataset.value; document.querySelectorAll('#ratingContainer .rating-option').forEach(o => o.classList.remove('selected')); this.classList.add('selected'); };
            });
            
            let current = 1;
            const showCard = (n) => { document.querySelectorAll('.survey-card').forEach(c => c.classList.remove('active')); document.getElementById(`card${n}`).classList.add('active'); document.getElementById('progressFill').style.width = `${((n-1)/4)*100}%`; };
            
            document.getElementById('next1').onclick = () => { if(document.getElementById('clientInfoForm').checkValidity()) showCard(2); else document.getElementById('clientInfoForm').reportValidity(); };
            document.getElementById('next2').onclick = () => { if(Array.from(document.querySelectorAll('.service-check:checked')).length > 0) showCard(3); else alert('Please select at least one service.'); };
            document.getElementById('next3').onclick = () => { if(document.getElementById('overallRating').value) showCard(4); else alert('Please rate overall service quality.'); };
            document.getElementById('prev2').onclick = () => showCard(1);
            document.getElementById('prev3').onclick = () => showCard(2);
            document.getElementById('prev4').onclick = () => showCard(3);
            
            // WORKING SUBMIT BUTTON - Uses checkValidity like your original
            document.getElementById('submitSurvey').onclick = function() {
                if (document.getElementById('feedbackForm').checkValidity()) {
                    submitSurveyData();
                } else {
                    document.getElementById('feedbackForm').reportValidity();
                }
            };
            
            document.getElementById('newSurvey').onclick = () => location.reload();
        }
        
        function submitSurveyData() {
            // Collect selected services with per-service ratings
            const serviceRatings = [];
            document.querySelectorAll('.service-check:checked').forEach(cb => {
                let svc = cb.value;
                const card = cb.closest('.service-card');
                const starCount = card.querySelectorAll('.star-group span.active').length;
                const comment = card.querySelector('.svc-comment')?.value || '';
                serviceRatings.push({ service: svc, rating: starCount, comment: comment });
            });
            
            const surveyData = {
                clientInfo: { phone: document.getElementById('clientPhone').value, visitDate: document.getElementById('visitDate').value, clientType: document.getElementById('clientType').value },
                services: serviceRatings.map(s => s.service),
                ratings: { overall: document.getElementById('overallRating').value, staff: document.getElementById('staffRating').value, cleanliness: document.getElementById('cleanlinessRating').value, waitTime: document.getElementById('waitTimeRating').value },
                feedback: { type: document.getElementById('feedbackType').value, text: document.getElementById('feedbackText').value, recommendation: document.getElementById('recommendation').value, improvements: document.getElementById('improvementSuggestions').value, date: new Date().toISOString() },
                employeeShoutout: document.getElementById('employeeShoutout').value,
                servicePerceptions: serviceRatings
            };
            
            const clientId = 'LUN' + Date.now().toString().slice(-8);
            const businessData = JSON.parse(localStorage.getItem('lunasBusinessData'));
            
            businessData.clients.push({
                id: clientId, type: surveyData.clientInfo.clientType, phone: surveyData.clientInfo.phone, visitDate: surveyData.clientInfo.visitDate,
                services: surveyData.services, rating: parseInt(surveyData.ratings.overall),
                staffRating: surveyData.ratings.staff ? parseInt(surveyData.ratings.staff) : null,
                cleanlinessRating: surveyData.ratings.cleanliness ? parseInt(surveyData.ratings.cleanliness) : null,
                waitTimeRating: surveyData.ratings.waitTime ? parseInt(surveyData.ratings.waitTime) : null,
                employeeShoutout: surveyData.employeeShoutout, submissionDate: new Date().toISOString()
            });
            
            if (surveyData.clientInfo.clientType === 'new') businessData.newClientsCount++; else businessData.returningClientsCount++;
            
            surveyData.services.forEach(svc => { const ex = businessData.services.find(s => s.name === svc); if(ex) ex.count++; else businessData.services.push({ name: svc, count: 1 }); });
            surveyData.servicePerceptions.forEach(sp => businessData.servicePerceptions.push({ clientId, service: sp.service, rating: sp.rating, comment: sp.comment }));
            if (surveyData.employeeShoutout) businessData.employeeShoutouts.push({ clientId, employee: surveyData.employeeShoutout, date: new Date().toISOString() });
            businessData.feedback.push({ id: clientId, type: surveyData.feedback.type, text: surveyData.feedback.text, recommendation: surveyData.feedback.recommendation, improvements: surveyData.feedback.improvements, employeeShoutout: surveyData.employeeShoutout, date: new Date().toISOString() });
            
            localStorage.setItem('lunasBusinessData', JSON.stringify(businessData));
            
            document.getElementById('thankYouCard').classList.add('active');
            document.getElementById('card4').classList.remove('active');
            document.getElementById('progressFill').style.width = '100%';
            showSuccessMessage('✨ Thank you! Your feedback with service ratings has been recorded! ✨');
        }
        
        // DASHBOARD
        function loadDashboard() { if(localStorage.getItem('lunasLoggedIn') === 'true') showDashboard(); else showLogin(); }
        
        function showLogin() {
            document.getElementById('dashboardSection').innerHTML = `<div class="login-container" style="display:flex; justify-content:center; min-height:60vh;"><div class="login-card" style="background:white; border-radius:32px; padding:50px; max-width:450px; text-align:center;"><i class="fas fa-chart-line" style="font-size:3rem; color:var(--primary-color);"></i><h2 style="margin:15px 0;">LUNAS Analytics</h2><div class="form-group"><input type="text" id="username" placeholder="Username"></div><div class="form-group"><input type="password" id="password" placeholder="Password"></div><button class="btn btn-primary" id="loginBtn" style="width:100%;">Login</button><div class="login-error" id="loginError" style="color:red; margin-top:15px; display:none;">Username: admin | Password: lunas2025</div></div></div>`;
            document.getElementById('loginBtn').onclick = () => { if(document.getElementById('username').value === 'admin' && document.getElementById('password').value === 'lunas2025') { localStorage.setItem('lunasLoggedIn','true'); showDashboard(); } else document.getElementById('loginError').style.display = 'block'; };
        }
        
        function showDashboard() {
            const data = JSON.parse(localStorage.getItem('lunasBusinessData'));
            const avgRating = data.clients.length ? (data.clients.reduce((a,b)=>a+(b.rating||0),0)/data.clients.length).toFixed(1) : '0.0';
            
            // Per-service ratings summary
            const perServiceMap = new Map();
            (data.servicePerceptions || []).forEach(p => { if(!perServiceMap.has(p.service)) perServiceMap.set(p.service, []); perServiceMap.get(p.service).push(p.rating); });
            let perServiceHtml = '';
            for(let [svc, ratings] of perServiceMap.entries()) {
                const avg = ratings.length ? (ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1) : 'N/A';
                perServiceHtml += `<div class="per-service-row"><span><strong>${svc}</strong></span><span style="color:var(--secondary-color);">${'★'.repeat(Math.round(avg))}${'☆'.repeat(5-Math.round(avg))}</span><span>${avg}/5 (${ratings.length})</span></div>`;
            }
            
            const shoutoutsHtml = (data.employeeShoutouts || []).slice(-5).reverse().map(s => `<div style="padding:12px; background:#fef5e8; border-radius:16px; margin-bottom:10px;"><i class="fas fa-user-check" style="color:var(--secondary-color);"></i> "${s.employee}"<br><small>${new Date(s.date).toLocaleDateString()}</small></div>`).join('') || '<p>No shoutouts yet</p>';
            
            document.getElementById('dashboardSection').innerHTML = `
                <div class="dashboard-header"><div><h1><i class="fas fa-chart-line"></i> Analytics Dashboard</h1><p>Client Feedback & Service Intelligence</p></div><button class="logout-btn" id="logoutBtn">Logout</button></div>
                <div class="stats-grid"><div class="stat-card"><div class="stat-number">${data.clients.length}</div><p>Total Clients</p></div><div class="stat-card"><div class="stat-number">${avgRating}</div><p>⭐ Avg Rating</p></div><div class="stat-card"><div class="stat-number">${data.clients.reduce((a,c)=>a+(c.services?.length||0),0)}</div><p>Services Used</p></div><div class="stat-card"><div class="stat-number">${data.feedback.length}</div><p>Feedbacks</p></div></div>
                <div class="dashboard-grid"><div class="dashboard-card"><h2><i class="fas fa-chart-pie"></i> Client Demographics</h2><div class="chart-container"><canvas id="clientChart"></canvas></div></div><div class="dashboard-card"><h2><i class="fas fa-chart-bar"></i> Most Popular Services</h2><div class="chart-container"><canvas id="serviceChart"></canvas></div></div></div>
                <div class="dashboard-card"><h2><i class="fas fa-star-half-alt"></i> Per-Service Satisfaction Ratings</h2>${perServiceHtml || '<p>No per-service ratings yet</p>'}</div>
                <div class="dashboard-grid"><div class="dashboard-card"><h2><i class="fas fa-medal"></i> Employee Shoutouts</h2>${shoutoutsHtml}</div><div class="dashboard-card"><h2><i class="fas fa-comment-dots"></i> Recent Feedback</h2>${data.feedback.slice(-4).reverse().map(fb => `<div class="feedback-item" style="border-left-color:${fb.type==='compliment'?'#2ecc71':fb.type==='suggestion'?'#f39c12':'#e74c3c'}"><strong>${fb.type}</strong> — ${fb.text.substring(0,100)}</div>`).join('') || '<p>No feedback yet</p>'}</div></div>
                <div class="dashboard-card"><div style="display:flex; gap:15px; flex-wrap:wrap;"><button class="btn btn-primary" id="exportBtn"><i class="fas fa-download"></i> Export Data</button><button class="btn btn-danger" id="deleteBtn"><i class="fas fa-trash"></i> Delete All</button><button class="btn btn-secondary" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button></div></div>`;
            
            document.getElementById('logoutBtn').onclick = () => { localStorage.removeItem('lunasLoggedIn'); loadDashboard(); };
            document.getElementById('exportBtn').onclick = () => { let csv = "Client,Rating,Shoutout\n"; data.clients.forEach(c => csv += `${c.id},${c.rating},"${c.employeeShoutout || ''}"\n`); const blob = new Blob([csv],{type:'text/csv'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'lunas_data.csv'; a.click(); alert('✅ Exported!'); };
            document.getElementById('deleteBtn').onclick = () => { if(confirm('Delete ALL data?')) { localStorage.setItem('lunasBusinessData', JSON.stringify({ clients:[], services:[], feedback:[], servicePerceptions:[], employeeShoutouts:[], newClientsCount:0, returningClientsCount:0, startDate:new Date().toISOString() })); showDashboard(); alert('✅ All data deleted.'); } };
            document.getElementById('refreshBtn').onclick = () => showDashboard();
            
            // Charts
            const newC = data.clients.filter(c=>c.type==='new').length;
            const retC = data.clients.filter(c=>c.type==='returning').length;
            new Chart(document.getElementById('clientChart'), { type: 'doughnut', data: { labels: ['New Clients', 'Returning'], datasets: [{ data: [newC, retC], backgroundColor: ['#006850', '#FBB040'] }] }, options: { responsive: true } });
            const topSvcs = data.services.sort((a,b)=>b.count-a.count).slice(0,6);
            new Chart(document.getElementById('serviceChart'), { type: 'bar', data: { labels: topSvcs.map(s=>s.name), datasets: [{ label: 'Times Received', data: topSvcs.map(s=>s.count), backgroundColor: '#006850', borderRadius: 10 }] }, options: { responsive: true, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } } });
        }
        
        loadSurveyTool();
    </script>
</body>
</html>
