<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>LUNAS Beauty | Signature Experience Suite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        :root {
            --primary-color: #006850;
            --secondary-color: #FBB040;
            --dark-color: #1a2a2a;
            --light-color: #FFFFFF;
            --light-bg: #f4f8fb;
            --card-bg: #ffffff;
            --text-dark: #1e2f2f;
            --text-light: #5a6e6e;
            --border-color: #eef2f5;
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
            --warning-color: #f39c12;
            --shadow-sm: 0 12px 30px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 20px 35px -10px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 25px 45px -12px rgba(0, 0, 0, 0.15);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Montserrat', system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #f5f9ff 0%, #eef3f8 100%); min-height: 100vh; }
        .container { max-width: 1280px; margin: 0 auto; padding: 20px 28px; }
        
        /* Header - Luxurious */
        .main-header { background: linear-gradient(115deg, #006850 0%, #0a7a60 100%); padding: 28px 0; margin-bottom: 40px; box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2); position: relative; overflow: hidden; }
        .main-header::before { content: ''; position: absolute; top: -30%; right: -10%; width: 50%; height: 150%; background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%); transform: rotate(20deg); pointer-events: none; }
        .header-content { max-width: 1280px; margin: 0 auto; padding: 0 32px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; position: relative; z-index: 2; }
        .logo { font-family: 'Playfair Display', serif; font-size: 3rem; font-weight: 800; background: linear-gradient(135deg, #FFFFFF, #FFE6B3); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: -0.5px; }
        .tagline { font-size: 0.9rem; letter-spacing: 3px; color: #FFE6C7; margin-top: 6px; font-weight: 400; }
        .nav-buttons { display: flex; gap: 18px; }
        .nav-btn { padding: 12px 32px; border-radius: 50px; font-weight: 600; background: rgba(255,255,255,0.12); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.3); cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 12px; color: white; font-size: 1rem; }
        .nav-btn.active { background: var(--secondary-color); color: #1e2a2a; border-color: transparent; box-shadow: 0 10px 20px rgba(251,176,64,0.3); transform: translateY(-2px); }
        .nav-btn:hover { transform: translateY(-3px); background: rgba(255,255,255,0.25); }
        
        /* Survey Cards - Spacious & Airy */
        .survey-card { background: var(--card-bg); border-radius: 48px; padding: 52px 56px; box-shadow: var(--shadow-lg); transition: all 0.4s cubic-bezier(0.2,0.9,0.4,1.1); display: none; border: 1px solid rgba(255,255,255,0.8); }
        .survey-card.active { display: block; animation: cardReveal 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes cardReveal { 0% { opacity: 0; transform: scale(0.98) translateY(25px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        
        .progress-container { margin-bottom: 45px; }
        .progress-bar { height: 8px; background: #e4e9f0; border-radius: 20px; overflow: hidden; }
        .progress-fill { background: linear-gradient(95deg, var(--primary-color), var(--secondary-color), #FFDA88); border-radius: 20px; transition: width 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.2); height: 100%; }
        
        /* Form Layout - Breathe */
        .form-row { display: flex; gap: 28px; margin-bottom: 32px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 220px; }
        .form-group label { font-weight: 600; margin-bottom: 12px; display: block; color: var(--text-dark); font-size: 0.95rem; letter-spacing: -0.2px; }
        .input-icon { position: relative; }
        .input-icon i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--primary-color); font-size: 1.1rem; }
        .input-icon input, .input-icon select { width: 100%; padding: 16px 20px 16px 48px; border: 2px solid var(--border-color); border-radius: 32px; font-size: 1rem; background: white; transition: all 0.2s; }
        .input-icon input:focus, .input-icon select:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 0 4px rgba(0,104,80,0.08); }
        
        /* Welcome card special styling */
        .welcome-badge { background: linear-gradient(120deg, #FDF8ED, #FFF8EE); border-radius: 28px; padding: 28px 32px; margin-bottom: 32px; text-align: center; border: 1px solid rgba(251,176,64,0.3); }
        
        /* Services Grid - Spacious cards */
        .services-scroll { max-height: 520px; overflow-y: auto; padding-right: 12px; margin: 28px 0 20px; display: flex; flex-direction: column; gap: 18px; }
        .service-card { background: #fefefe; border-radius: 32px; padding: 24px 28px; border: 1px solid #eef2f8; transition: all 0.25s; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .service-card:hover { border-color: var(--primary-color); box-shadow: 0 12px 24px -12px rgba(0,104,80,0.12); transform: translateX(4px); }
        .service-check-label { display: flex; align-items: center; gap: 16px; font-weight: 600; cursor: pointer; font-size: 1.05rem; }
        .service-check-label input { width: 22px; height: 22px; accent-color: var(--primary-color); }
        .star-rating { display: flex; gap: 10px; margin: 14px 0 12px 38px; }
        .star-rating span { font-size: 1.8rem; cursor: pointer; color: #dce2e8; transition: 0.1s; letter-spacing: 4px; }
        .star-rating span.active, .star-rating span:hover { color: var(--secondary-color); text-shadow: 0 0 5px rgba(251,176,64,0.4); }
        .service-comment { width: 100%; border-radius: 40px; border: 1px solid #e2e8f0; padding: 14px 20px; margin-top: 12px; margin-left: 38px; width: calc(100% - 38px); background: #fafcff; }
        
        /* Shoutout box */
        .shoutout-box { background: linear-gradient(115deg, #FFF9EF, #FFF5E6); border-radius: 36px; padding: 28px 32px; margin: 25px 0 15px; border: 1px solid #FFE2A4; }
        .shoutout-box label { font-weight: 700; font-size: 1.1rem; }
        .shoutout-box input { width: 100%; padding: 16px 24px; border-radius: 60px; border: 1px solid #FFD89C; background: white; font-size: 1rem; margin-top: 12px; }
        
        /* Rating options - modern */
        .rating-group { display: flex; gap: 14px; flex-wrap: wrap; margin: 12px 0 20px; }
        .rating-option { flex: 1; text-align: center; padding: 16px 12px; border-radius: 60px; background: #f7fafd; border: 1px solid #eef2f8; cursor: pointer; transition: all 0.2s; font-weight: 500; }
        .rating-option.selected { background: var(--primary-color); color: white; border-color: var(--primary-color); transform: scale(1.02); box-shadow: 0 8px 18px rgba(0,104,80,0.15); }
        
        /* Buttons */
        .btn-container { display: flex; justify-content: space-between; gap: 24px; margin-top: 48px; }
        .btn { padding: 16px 36px; border-radius: 60px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.25s; border: none; display: inline-flex; align-items: center; gap: 12px; justify-content: center; }
        .btn-primary { background: linear-gradient(105deg, var(--primary-color), #01856a); color: white; box-shadow: 0 10px 20px rgba(0,104,80,0.2); }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 18px 28px rgba(0,104,80,0.28); }
        .btn-secondary { background: #f1f5f9; color: #2c4a4a; border: 1px solid #e2e8f0; }
        .btn-secondary:hover { background: #e9eef3; }
        
        /* Thank you */
        .thank-you-card { text-align: center; background: linear-gradient(125deg, #ffffff, #FFFCF5); }
        
        /* Dashboard spacing */
        .dashboard-card { background: white; border-radius: 36px; padding: 32px; margin-bottom: 28px; box-shadow: var(--shadow-sm); }
        
        @media (max-width: 880px) { .survey-card { padding: 32px 28px; } .form-row { flex-direction: column; gap: 18px; } .rating-group { flex-direction: column; } }
        @media (max-width: 640px) { .survey-card { padding: 28px 20px; } .btn-container { flex-direction: column; } .btn { width: 100%; } }
    </style>
</head>
<body>
    <div class="main-header">
        <div class="header-content">
            <div><div class="logo">LUNAS</div><div class="tagline">ATELIER OF BEAUTY</div></div>
            <div class="nav-buttons"><button class="nav-btn active" id="navSurvey"><i class="fas fa-feather-alt"></i> Client Journey</button><button class="nav-btn" id="navDashboard"><i class="fas fa-chart-scatter"></i> Insights Studio</button></div>
        </div>
    </div>
    <div class="container"><section id="surveySection"></section><section id="dashboardSection"></section></div>

    <script>
        if (!localStorage.getItem('lunasBusinessData')) {
            localStorage.setItem('lunasBusinessData', JSON.stringify({
                clients: [], services: [], feedback: [], serviceQualityDetails: [], employeeShoutouts: [],
                newClientsCount: 0, returningClientsCount: 0, startDate: new Date().toISOString()
            }));
        }
        // Navigation
        document.getElementById('navSurvey').addEventListener('click', () => switchSection('survey'));
        document.getElementById('navDashboard').addEventListener('click', () => switchSection('dashboard'));
        function switchSection(section) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if (section === 'survey') {
                document.getElementById('navSurvey').classList.add('active');
                document.getElementById('surveySection').style.display = 'block';
                document.getElementById('dashboardSection').style.display = 'none';
                renderSpaciousSurvey();
            } else {
                document.getElementById('navDashboard').classList.add('active');
                document.getElementById('surveySection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                authDashboard();
            }
        }

        const servicesCatalog = ["Gel Polish","Tips","Builder Gel","Gumgel Overlay","Gumgel Sculpting","Pedicure","Manicure","Piercing","Wig Installation and Styling","Wig Laundry","Eyelash Extension","Waxing","Facial","Massage","Braiding","Wash and Blow","Brow Shaping","Dreadlock Installation/Retouch","Flat Ironing","Other"];

        function renderSpaciousSurvey() {
            let servicesMarkup = `<div class="services-scroll">`;
            servicesCatalog.forEach(svc => {
                servicesMarkup += `
                    <div class="service-card" data-service="${svc}">
                        <div class="service-header"><label class="service-check-label"><input type="checkbox" class="service-check" value="${svc}"> <span>${svc}</span></label></div>
                        <div class="rating-mini" style="display:none;"><div class="star-rating" data-svc="${svc}">${[1,2,3,4,5].map(s => `<span data-star="${s}" class="star">★</span>`).join('')}</div><input type="text" class="service-comment" placeholder="How was ${svc}? (e.g., flawless, relaxing, expert technique)"></div>
                    </div>
                `;
            });
            servicesMarkup += `</div><div class="form-group" style="margin-top:10px;"><label>If you selected "Other", please specify</label><input type="text" id="otherServiceField" placeholder="Service name" style="border-radius:40px; padding:14px 20px;"></div>`;

            const fullHtml = `
                <div style="text-align:center; margin-bottom:32px;"><h1 style="color:var(--primary-color); font-size:3rem; font-weight:700;">✨ Share Your Radiance ✨</h1><p style="color:var(--text-light); font-size:1.1rem;">Every detail, every service, every moment — we value your voice</p></div>
                <div class="progress-container"><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div>
                
                <!-- CARD 1 - CLIENT INFO with spacious design -->
                <div class="survey-card active" id="card1">
                    <div class="welcome-badge"><i class="fas fa-leaf" style="font-size:2rem; color:var(--primary-color);"></i><h2 style="margin-top:8px;">Hello, Beautiful</h2><p>Tell us about your LUNAS moment</p></div>
                    <div class="form-row">
                        <div class="form-group"><label><i class="fas fa-phone-alt"></i> Phone (optional)</label><div class="input-icon"><i class="fas fa-mobile-alt"></i><input type="tel" id="clientPhone" placeholder="For exclusive updates"></div></div>
                        <div class="form-group"><label><i class="fas fa-calendar-check"></i> Visit Date *</label><div class="input-icon"><i class="fas fa-calendar-day"></i><input type="date" id="visitDate" required></div></div>
                    </div>
                    <div class="form-group"><label><i class="fas fa-spa"></i> Is this your first visit to LUNAS? *</label><div class="input-icon"><i class="fas fa-user-tag"></i><select id="clientType" required><option value="">Select one</option><option value="new">✨ Yes, first time — I'm new to LUNAS</option><option value="returning">🌟 No, I'm a returning client</option></select></div></div>
                    <div class="btn-container"><button class="btn btn-primary" id="next1" style="margin-left:auto;">Next Step →</button></div>
                </div>
                
                <!-- CARD 2: SERVICES + PER SERVICE RATING + SHOUTOUT TEXTBOX -->
                <div class="survey-card" id="card2">
                    <div><h2 style="font-size:1.9rem;"><i class="fas fa-hand-sparkles"></i> Your Services & Experience</h2><p style="margin-bottom:20px;">Select all services you received, rate each (stars), and add a quick note</p></div>
                    ${servicesMarkup}
                    <div class="shoutout-box"><i class="fas fa-star-of-life" style="color:var(--secondary-color); font-size:1.4rem;"></i> <label>🌟 Shout-out to an amazing team member</label><input type="text" id="employeeShoutoutText" placeholder="e.g., Jessica made my facial unforgettable! ✨" style="width:100%;"><small style="display:block; margin-top:8px;">Recognize any staff who went above and beyond</small></div>
                    <div class="btn-container"><button class="btn btn-secondary" id="prev2">← Back</button><button class="btn btn-primary" id="next2">Next →</button></div>
                </div>
                
                <!-- CARD 3: OVERALL SATISFACTION + SHOP/EMPLOYEES ALL QUESTIONS -->
                <div class="survey-card" id="card3">
                    <h2 style="font-size:1.9rem;"><i class="fas fa-crown"></i> Your Overall Impression</h2>
                    <div class="form-group"><label>🌟 Final Overall Satisfaction *</label><div class="rating-group" id="overallGroup">${[5,4,3,2,1].map(v => `<div class="rating-option" data-val="${v}">${v} ${v===5?'⭐️⭐️⭐️⭐️⭐️':v===4?'⭐️⭐️⭐️⭐️':v===3?'⭐️⭐️⭐️':v===2?'⭐️⭐️':'⭐️'}<div style="font-size:0.8rem;">${v===5?'Excellent':v===4?'Very Good':v===3?'Good':v===2?'Fair':'Poor'}</div></div>`).join('')}</div><input type="hidden" id="finalOverallRating" required></div>
                    <div class="form-row"><div class="form-group"><label>👥 Staff Friendliness & Professionalism</label><select id="staffRating" style="border-radius:40px; padding:14px;"><option value="">Select rating</option><option value="5">Excellent - Warm & skilled</option><option value="4">Very Good</option><option value="3">Good</option><option value="2">Fair</option><option value="1">Poor</option></select></div>
                    <div class="form-group"><label>🧼 Cleanliness of the Salon/Spa</label><select id="cleanlinessRating" style="border-radius:40px; padding:14px;"><option value="">Select</option><option value="5">Immaculate & serene</option><option value="4">Very clean</option><option value="3">Acceptable</option><option value="2">Could improve</option><option value="1">Needs attention</option></select></div></div>
                    <div class="form-group"><label>⏱️ Wait Time & Appointment Punctuality</label><select id="waitTimeRating" style="border-radius:40px; padding:14px;"><option value="">Select</option><option value="5">Seamless - no wait</option><option value="4">Minimal wait</option><option value="3">Reasonable</option><option value="2">Longer than expected</option><option value="1">Excessive delay</option></select></div>
                    <div class="btn-container"><button class="btn btn-secondary" id="prev3">← Back</button><button class="btn btn-primary" id="next3">Next →</button></div>
                </div>
                
                <!-- CARD 4: FEEDBACK -->
                <div class="survey-card" id="card4">
                    <h2><i class="fas fa-comment-heart"></i> Your Voice, Our Growth</h2>
                    <div class="form-group"><label>Feedback Type *</label><select id="feedbackType" required style="border-radius:40px; padding:14px;"><option value="">Select type</option><option value="compliment">💖 Compliment</option><option value="suggestion">💡 Suggestion</option><option value="complaint">⚠️ Improvement area</option></select></div>
                    <div class="form-group"><label>Your Detailed Feedback *</label><textarea id="feedbackText" rows="3" placeholder="Share your thoughts with us..." style="border-radius:28px; padding:18px;"></textarea></div>
                    <div class="form-group"><label>Would you recommend LUNAS to friends/family? *</label><select id="recommendation" required style="border-radius:40px; padding:14px;"><option value="">Select</option><option value="yes-definitely">Yes, definitely</option><option value="yes-probably">Yes, probably</option><option value="not-sure">Not sure</option><option value="probably-not">Probably not</option><option value="no">No</option></select></div>
                    <div class="form-group"><label>How can we improve our services? (optional)</label><textarea id="improvementSuggestions" rows="2" placeholder="We're always listening..." style="border-radius:28px;"></textarea></div>
                    <div class="btn-container"><button class="btn btn-secondary" id="prev4">← Back</button><button class="btn btn-primary" id="submitSurvey">✨ Submit My LUNAS Story ✨</button></div>
                </div>
                
                <div class="survey-card thank-you-card" id="thankYouCard"><i class="fas fa-heart" style="font-size: 4.5rem; color: var(--secondary-color);"></i><h2 style="margin:20px 0;">Gratitude, Glowing One!</h2><p>Your feedback & shoutouts inspire our artistry.</p><div style="margin:35px 0;"><i class="fab fa-instagram fa-2x" style="margin:0 16px; color:#E1306C;"></i><i class="fab fa-tiktok fa-2x" style="margin:0 16px;"></i><i class="fab fa-whatsapp fa-2x" style="margin:0 16px; color:#25D366;"></i></div><button class="btn btn-primary" id="newSurvey">Submit Another Response</button></div>
            `;
            document.getElementById('surveySection').innerHTML = fullHtml;
            initSurveyActions();
        }

        function initSurveyActions() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('visitDate').value = today;
            document.getElementById('visitDate').max = today;
            // per service toggles
            document.querySelectorAll('.service-check').forEach(cb => {
                cb.addEventListener('change', function() { const parentDiv = this.closest('.service-card'); const ratingArea = parentDiv.querySelector('.rating-mini'); ratingArea.style.display = this.checked ? 'block' : 'none'; if(!this.checked){ parentDiv.querySelectorAll('.star').forEach(s=>s.classList.remove('active')); if(parentDiv.querySelector('.service-comment')) parentDiv.querySelector('.service-comment').value = ''; } });
            });
            document.querySelectorAll('.star-rating').forEach(rating => {
                const stars = rating.querySelectorAll('.star');
                stars.forEach(star => star.addEventListener('click', function() { const val = parseInt(this.dataset.star); stars.forEach((s,idx) => { if(idx < val) s.classList.add('active'); else s.classList.remove('active'); }); }));
            });
            document.querySelectorAll('#overallGroup .rating-option').forEach(opt => { opt.addEventListener('click', function() { document.querySelectorAll('#overallGroup .rating-option').forEach(o=>o.classList.remove('selected')); this.classList.add('selected'); document.getElementById('finalOverallRating').value = this.dataset.val; }); });
            
            let current = 1;
            const showCard = (n) => { document.querySelectorAll('.survey-card').forEach(c=>c.classList.remove('active')); document.getElementById(`card${n}`).classList.add('active'); document.getElementById('progressFill').style.width = `${((n-1)/4)*100}%`; current=n; gsap.fromTo(`#card${n}`, {opacity:0, y:30}, {opacity:1, y:0, duration:0.5}); };
            document.getElementById('next1').onclick = () => { if(document.getElementById('clientType').value && document.getElementById('visitDate').value) showCard(2); else alert("Please select visit type and date."); };
            document.getElementById('next2').onclick = () => { const anyChecked = Array.from(document.querySelectorAll('.service-check')).some(c=>c.checked); if(anyChecked) showCard(3); else alert("Please select at least one service you received."); };
            document.getElementById('next3').onclick = () => { if(document.getElementById('finalOverallRating').value) showCard(4); else alert("Please rate overall satisfaction."); };
            document.getElementById('prev2').onclick = () => showCard(1); document.getElementById('prev3').onclick = () => showCard(2); document.getElementById('prev4').onclick = () => showCard(3);
            document.getElementById('submitSurvey').onclick = () => { if(document.getElementById('feedbackType').value && document.getElementById('feedbackText').value && document.getElementById('recommendation').value) submitFinalSurvey(); else alert("Please complete feedback & recommendation."); };
            document.getElementById('newSurvey').onclick = () => location.reload();
        }

        function submitFinalSurvey() {
            const chosenServices = []; const detailedRatings = [];
            document.querySelectorAll('.service-check').forEach(cb => {
                if(cb.checked) {
                    let sName = cb.value;
                    const parentCard = cb.closest('.service-card');
                    const starCount = parentCard.querySelectorAll('.star.active').length;
                    const commentTxt = parentCard.querySelector('.service-comment')?.value || '';
                    chosenServices.push(sName);
                    detailedRatings.push({ service: sName, rating: starCount, comment: commentTxt });
                }
            });
            const otherVal = document.getElementById('otherServiceField')?.value;
            if(otherVal && chosenServices.includes('Other')) { const idx = chosenServices.indexOf('Other'); if(idx !== -1) chosenServices[idx] = otherVal; const detIdx = detailedRatings.findIndex(d=>d.service==='Other'); if(detIdx !== -1) detailedRatings[detIdx].service = otherVal; }
            const shoutoutVal = document.getElementById('employeeShoutoutText')?.value.trim() || null;
            const clientId = 'LUN' + Date.now().toString().slice(-8);
            const business = JSON.parse(localStorage.getItem('lunasBusinessData'));
            const newClient = {
                id: clientId, type: document.getElementById('clientType').value, phone: document.getElementById('clientPhone').value, visitDate: document.getElementById('visitDate').value,
                services: chosenServices, rating: parseInt(document.getElementById('finalOverallRating').value),
                staffRating: parseInt(document.getElementById('staffRating').value) || null, cleanlinessRating: parseInt(document.getElementById('cleanlinessRating').value) || null,
                waitTimeRating: parseInt(document.getElementById('waitTimeRating').value) || null, employeeShoutout: shoutoutVal, serviceDetails: detailedRatings, submissionDate: new Date().toISOString()
            };
            business.clients.push(newClient);
            if(newClient.type === 'new') business.newClientsCount++; else business.returningClientsCount++;
            chosenServices.forEach(svc => { const exist = business.services.find(s=>s.name===svc); if(exist) exist.count++; else business.services.push({ name: svc, count:1 }); });
            detailedRatings.forEach(d => business.serviceQualityDetails.push({ clientId, service: d.service, rating: d.rating, comment: d.comment }));
            if(shoutoutVal) business.employeeShoutouts.push({ clientId, employee: shoutoutVal, date: new Date().toISOString() });
            business.feedback.push({ id: clientId, type: document.getElementById('feedbackType').value, text: document.getElementById('feedbackText').value, recommendation: document.getElementById('recommendation').value, improvements: document.getElementById('improvementSuggestions').value, date: new Date().toISOString() });
            localStorage.setItem('lunasBusinessData', JSON.stringify(business));
            document.getElementById('thankYouCard').classList.add('active');
            document.getElementById('card4').classList.remove('active');
            document.getElementById('progressFill').style.width = '100%';
            setTimeout(() => alert("💎 Thank you! Your voice makes LUNAS shine."), 400);
        }

        // DASHBOARD AUTH & RENDER
        function authDashboard() {
            if(localStorage.getItem('lunasLoggedIn') === 'true') renderAdminDashboard();
            else showLoginModal();
        }
        function showLoginModal() {
            document.getElementById('dashboardSection').innerHTML = `<div style="display:flex; justify-content:center; min-height:70vh; align-items:center;"><div class="dashboard-card" style="max-width:480px; text-align:center;"><i class="fas fa-lock" style="font-size:3rem; color:var(--primary-color);"></i><h2>Analytics Access</h2><div class="form-group"><input type="text" id="loginUser" placeholder="Username" style="border-radius:60px; padding:14px 20px;"></div><div class="form-group"><input type="password" id="loginPass" placeholder="Password" style="border-radius:60px; padding:14px 20px;"></div><button class="btn btn-primary" id="authBtn">Enter Dashboard</button><p id="errorMsg" style="color:red; display:none; margin-top:15px;">admin / lunas2025</p></div></div>`;
            document.getElementById('authBtn').onclick = () => { const u = document.getElementById('loginUser').value, p = document.getElementById('loginPass').value; if(u === 'admin' && p === 'lunas2025') { localStorage.setItem('lunasLoggedIn','true'); renderAdminDashboard(); } else document.getElementById('errorMsg').style.display = 'block'; };
        }
        function renderAdminDashboard() {
            const data = JSON.parse(localStorage.getItem('lunasBusinessData'));
            const avgRating = data.clients.length ? (data.clients.reduce((a,b)=>a+(b.rating||0),0)/data.clients.length).toFixed(1) : '0.0';
            const totalRec = data.clients.reduce((a,c)=>a+(c.services?.length||0),0);
            let qualityRows = '';
            const svcRatingsMap = new Map();
            data.serviceQualityDetails?.forEach(d => { if(!svcRatingsMap.has(d.service)) svcRatingsMap.set(d.service, []); svcRatingsMap.get(d.service).push(d.rating); });
            for(let [svc, arr] of svcRatingsMap.entries()) { const avg = (arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1); qualityRows += `<tr><td style="padding:12px;">${svc}</td><td>⭐ ${avg}/5</td><td>${arr.length} ratings</td></tr>`; }
            const shoutoutsHtml = data.employeeShoutouts?.slice(-6).reverse().map(s => `<div style="padding:12px 0; border-bottom:1px solid #eef2f8;">🙌 "${s.employee}" — ${new Date(s.date).toLocaleDateString()}</div>`).join('') || '<div>No shoutouts yet</div>';
            const feedbackHtml = data.feedback.slice(-6).reverse().map(fb => `<div class="feedback-item" style="padding:18px; border-left:5px solid ${fb.type==='compliment'?'#2ecc71':fb.type==='suggestion'?'#f39c12':'#e74c3c'}; background:#fbfdff; margin-bottom:12px; border-radius:20px;"><strong>${fb.type.toUpperCase()}</strong> — ${fb.text.substring(0,140)}<div style="font-size:12px; margin-top:8px;">Recommends: ${fb.recommendation}</div></div>`).join('');
            const dashboardContent = `
                <div class="dashboard-header" style="display:flex; justify-content:space-between;"><div><h1>📈 LUNAS Insight Studio</h1><p>Service intelligence & client love</p></div><button id="logoutDash" class="btn" style="background:rgba(255,255,255,0.2);">Exit</button></div>
                <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:24px; margin-bottom:40px;"><div class="dashboard-card"><h3>${data.clients.length}</h3><p>Total Surveys</p></div><div class="dashboard-card"><h3>${avgRating}</h3><p>Avg Overall Rating</p></div><div class="dashboard-card"><h3>${totalRec}</h3><p>Services Used</p></div><div class="dashboard-card"><h3>${data.feedback.length}</h3><p>Feedbacks</p></div></div>
                <div class="dashboard-card"><h2><i class="fas fa-chart-simple"></i> Per-Service Satisfaction (avg)</h2><canvas id="qualityChartCanvas" height="220"></canvas></div>
                <div class="dashboard-card"><h2><i class="fas fa-star-of-life"></i> Employee Shoutouts</h2><div style="max-height:260px; overflow:auto;">${shoutoutsHtml}</div></div>
                <div class="dashboard-card"><h2><i class="fas fa-table"></i> Service Quality Breakdown</h2><table style="width:100%;"><thead><tr style="background:#f1f5f9;"><th>Service</th><th>Avg Rating</th><th>Count</th></tr></thead><tbody>${qualityRows || '<tr><td colspan="3">No data yet</td></tr>'}</tbody></table></div>
                <div class="dashboard-card"><h2><i class="fas fa-message"></i> Recent Client Feedback</h2>${feedbackHtml}</div>
                <div class="dashboard-card" style="display:flex; gap:20px; flex-wrap:wrap;"><button id="exportDataBtn" class="btn btn-primary">📎 Export CSV</button><button id="resetDataBtn" class="btn btn-danger">🗑️ Reset All Data</button><button id="refreshDashBtn" class="btn btn-secondary">⟳ Refresh</button></div>
            `;
            document.getElementById('dashboardSection').innerHTML = dashboardContent;
            document.getElementById('logoutDash').onclick = () => { localStorage.removeItem('lunasLoggedIn'); authDashboard(); };
            document.getElementById('resetDataBtn')?.addEventListener('click', () => { if(confirm("Permanently delete all responses?")) { localStorage.setItem('lunasBusinessData', JSON.stringify({ clients:[], services:[], feedback:[], serviceQualityDetails:[], employeeShoutouts:[], newClientsCount:0, returningClientsCount:0, startDate:new Date().toISOString() })); renderAdminDashboard(); } });
            document.getElementById('refreshDashBtn')?.addEventListener('click', () => renderAdminDashboard());
            document.getElementById('exportDataBtn')?.addEventListener('click', () => { let csv="Client,Type,Rating,Shoutout\n"; data.clients.forEach(c=>{ csv+=`${c.id},${c.type},${c.rating},"${c.employeeShoutout || ''}"\n`; }); const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='lunas_data.csv'; a.click(); });
            const labels = Array.from(svcRatingsMap.keys()).slice(0,7); const avgVals = labels.map(l => (svcRatingsMap.get(l).reduce((a,b)=>a+b,0)/svcRatingsMap.get(l).length).toFixed(1));
            const ctx = document.getElementById('qualityChartCanvas')?.getContext('2d'); if(ctx) new Chart(ctx, { type: 'bar', data: { labels, datasets: [{ label: 'Rating (1-5)', data: avgVals, backgroundColor: '#006850CC', borderRadius: 10 }] }, options: { scales: { y: { max:5, min:0 } } } });
        }
        switchSection('survey');
    </script>
</body>
</html>
