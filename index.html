<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUNAS Beauty Salon - Client Survey</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', 'Segoe UI', sans-serif;
        }
        body {
            background: #f0f4f8;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Header */
        .main-header {
            background: linear-gradient(135deg, #006850, #00875a);
            padding: 20px 0;
            margin-bottom: 30px;
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
        }
        .tagline {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.8);
            letter-spacing: 3px;
            margin-top: 5px;
        }
        .nav-buttons {
            display: flex;
            gap: 15px;
        }
        .nav-btn {
            padding: 10px 20px;
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .nav-btn.active {
            background: #FBB040;
            color: #000;
        }
        
        /* Survey */
        .survey-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            display: none;
        }
        .survey-card.active {
            display: block;
        }
        .card-header {
            margin-bottom: 25px;
            border-left: 4px solid #FBB040;
            padding-left: 15px;
        }
        .card-header h2 {
            color: #006850;
            font-size: 1.5rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .required {
            color: #e74c3c;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #006850;
        }
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }
        .service-checkbox {
            display: flex;
            align-items: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #ddd;
        }
        .service-checkbox input {
            width: auto;
            margin-right: 10px;
        }
        .rating-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .rating-option {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 30px;
            cursor: pointer;
            border: 2px solid #ddd;
            transition: all 0.2s;
        }
        .rating-option.selected {
            background: #006850;
            color: white;
            border-color: #006850;
        }
        .btn-container {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 30px;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }
        .btn-primary {
            background: linear-gradient(135deg, #006850, #00875a);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }
        .progress-bar {
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #006850, #FBB040);
            width: 0%;
            transition: width 0.3s;
        }
        .thank-you-card {
            text-align: center;
            padding: 50px;
            display: none;
        }
        .thank-you-card.active {
            display: block;
        }
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        .social-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
        }
        .instagram { background: linear-gradient(45deg, #405DE6, #E1306C); }
        .tiktok { background: #000; }
        .whatsapp { background: #25D366; }
        
        @media (max-width: 768px) {
            .container { padding: 15px; }
            .services-grid { grid-template-columns: 1fr; }
            .btn-container { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="main-header">
        <div class="header-content">
            <div>
                <div class="logo">LUNAS</div>
                <div class="tagline">BEAUTY SALON & SPA</div>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn active" id="navSurvey">Client Survey</button>
                <button class="nav-btn" id="navDashboard">Analytics Dashboard</button>
            </div>
        </div>
    </div>
    
    <div class="container">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <!-- Card 1 -->
        <div class="survey-card active" id="card1">
            <div class="card-header">
                <h2><i class="fas fa-user"></i> Contact Information</h2>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="clientPhone" placeholder="Enter your phone number">
            </div>
            <div class="form-group">
                <label>Date of Visit <span class="required">*</span></label>
                <input type="date" id="visitDate" required>
            </div>
            <div class="form-group">
                <label>Is this your first visit? <span class="required">*</span></label>
                <select id="clientType" required>
                    <option value="">Select an option</option>
                    <option value="new">Yes, first time</option>
                    <option value="returning">No, I've been here before</option>
                </select>
            </div>
            <div class="btn-container">
                <button class="btn btn-secondary" disabled>Previous</button>
                <button class="btn btn-primary" id="next1">Next →</button>
            </div>
        </div>
        
        <!-- Card 2: Services -->
        <div class="survey-card" id="card2">
            <div class="card-header">
                <h2><i class="fas fa-spa"></i> Services Received</h2>
                <p>Select all that apply</p>
            </div>
            <div class="services-grid" id="servicesGrid"></div>
            <div class="form-group">
                <label>If "Other", please specify:</label>
                <input type="text" id="otherService" placeholder="Describe the service">
            </div>
            <div class="form-group" style="background: #FFF9EF; padding: 15px; border-radius: 12px;">
                <label><i class="fas fa-star-of-life"></i> Shout-out to an amazing employee!</label>
                <textarea id="employeeShoutout" rows="2" placeholder="e.g., Sarah made my experience amazing!"></textarea>
            </div>
            <div class="btn-container">
                <button class="btn btn-secondary" id="prev2">← Back</button>
                <button class="btn btn-primary" id="next2">Next →</button>
            </div>
        </div>
        
        <!-- Card 3: Quality -->
        <div class="survey-card" id="card3">
            <div class="card-header">
                <h2><i class="fas fa-star"></i> Service Quality</h2>
            </div>
            <div class="form-group">
                <label>Overall Service Quality <span class="required">*</span></label>
                <div class="rating-container" id="ratingContainer">
                    <div class="rating-option" data-value="1">Poor</div>
                    <div class="rating-option" data-value="2">Fair</div>
                    <div class="rating-option" data-value="3">Good</div>
                    <div class="rating-option" data-value="4">Very Good</div>
                    <div class="rating-option" data-value="5">Excellent</div>
                </div>
                <input type="hidden" id="overallRating" required>
            </div>
            <div class="form-group">
                <label>Staff Friendliness</label>
                <select id="staffRating">
                    <option value="">Select</option>
                    <option value="5">Excellent</option>
                    <option value="4">Very Good</option>
                    <option value="3">Good</option>
                    <option value="2">Fair</option>
                    <option value="1">Poor</option>
                </select>
            </div>
            <div class="form-group">
                <label>Cleanliness</label>
                <select id="cleanlinessRating">
                    <option value="">Select</option>
                    <option value="5">Excellent</option>
                    <option value="4">Very Good</option>
                    <option value="3">Good</option>
                    <option value="2">Fair</option>
                    <option value="1">Poor</option>
                </select>
            </div>
            <div class="form-group">
                <label>Wait Time</label>
                <select id="waitTimeRating">
                    <option value="">Select</option>
                    <option value="5">Excellent - No wait</option>
                    <option value="4">Very Good - Minimal</option>
                    <option value="3">Good - Reasonable</option>
                    <option value="2">Fair - Longer</option>
                    <option value="1">Poor - Excessive</option>
                </select>
            </div>
            <div class="btn-container">
                <button class="btn btn-secondary" id="prev3">← Back</button>
                <button class="btn btn-primary" id="next3">Next →</button>
            </div>
        </div>
        
        <!-- Card 4: Feedback -->
        <div class="survey-card" id="card4">
            <div class="card-header">
                <h2><i class="fas fa-comment-dots"></i> Your Feedback</h2>
            </div>
            <div class="form-group">
                <label>Feedback Type <span class="required">*</span></label>
                <select id="feedbackType" required>
                    <option value="">Select</option>
                    <option value="compliment">Compliment</option>
                    <option value="suggestion">Suggestion</option>
                    <option value="complaint">Complaint</option>
                </select>
            </div>
            <div class="form-group">
                <label>Your Feedback <span class="required">*</span></label>
                <textarea id="feedbackText" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label>Would you recommend us? <span class="required">*</span></label>
                <select id="recommendation" required>
                    <option value="">Select</option>
                    <option value="yes-definitely">Yes, definitely</option>
                    <option value="yes-probably">Yes, probably</option>
                    <option value="not-sure">Not sure</option>
                    <option value="probably-not">Probably not</option>
                    <option value="no">No</option>
                </select>
            </div>
            <div class="form-group">
                <label>How can we improve?</label>
                <textarea id="improvementSuggestions" rows="2"></textarea>
            </div>
            <div class="btn-container">
                <button class="btn btn-secondary" id="prev4">← Back</button>
                <button class="btn btn-primary" id="submitSurvey">Submit Survey →</button>
            </div>
        </div>
        
        <!-- Thank You Card -->
        <div class="survey-card thank-you-card" id="thankYouCard">
            <div class="thank-you-icon"><i class="fas fa-heart" style="font-size: 4rem; color: #006850;"></i></div>
            <h2>Thank You!</h2>
            <p>Your feedback has been successfully submitted. We truly value your input!</p>
            <div class="social-icons">
                <a href="https://www.instagram.com/lunas_parlour" target="_blank" class="social-icon"><div class="social-circle instagram"><i class="fab fa-instagram"></i></div></a>
                <a href="https://www.tiktok.com/@lunasbeautyparlour" target="_blank" class="social-icon"><div class="social-circle tiktok"><i class="fab fa-tiktok"></i></div></a>
                <a href="https://wa.me/233700422752" target="_blank" class="social-icon"><div class="social-circle whatsapp"><i class="fab fa-whatsapp"></i></div></a>
            </div>
            <button class="btn btn-primary" id="newSurvey" style="max-width: 250px; margin: 20px auto 0;">Submit Another</button>
        </div>
    </div>
    
    <div id="dashboardSection" style="display: none;"></div>

    <script>
        // Supabase config
        const SUPABASE_URL = "https://jxbyfvghztsnvcixnzlr.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4YnlmdmdoenRzbnZjaXhuemxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NTg3NzUsImV4cCI6MjA5NjIzNDc3NX0.2zweytKYGXnvnnXa2W1t48Rb4f08N8qSIrZuw0ZFEAo";
        
        let supabase;
        let dbConnected = false;
        
        // Services list
        const SERVICES = ["Gel Polish", "Tips", "Builder Gel", "Gumgel Overlay", "Gumgel Sculpting", "Pedicure", "Manicure", "Piercing", "Wig Installation and Styling", "Wig Laundry", "Eyelash Extension", "Waxing", "Facial", "Massage", "Braiding", "Wash and Blow", "Brow Shaping", "Dreadlock Installation/Retouch", "Flat Ironing", "Other"];
        
        // Load services grid
        function loadServicesGrid() {
            const grid = document.getElementById('servicesGrid');
            grid.innerHTML = '';
            SERVICES.forEach(service => {
                const label = document.createElement('label');
                label.className = 'service-checkbox';
                label.innerHTML = `<input type="checkbox" name="service" value="${service}"><span>${service}</span>`;
                grid.appendChild(label);
            });
        }
        
        // Navigation
        let currentCard = 1;
        const totalCards = 4;
        
        function showCard(n) {
            for(let i = 1; i <= totalCards; i++) {
                const card = document.getElementById(`card${i}`);
                if(card) card.classList.remove('active');
            }
            document.getElementById(`card${n}`).classList.add('active');
            document.getElementById('progressFill').style.width = `${((n-1)/totalCards)*100}%`;
            currentCard = n;
        }
        
        // Initialize
        function init() {
            // Set today's date
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('visitDate').value = today;
            document.getElementById('visitDate').max = today;
            
            // Load services
            loadServicesGrid();
            
            // Rating options
            document.querySelectorAll('.rating-option').forEach(opt => {
                opt.addEventListener('click', function() {
                    document.querySelectorAll('.rating-option').forEach(o => o.classList.remove('selected'));
                    this.classList.add('selected');
                    document.getElementById('overallRating').value = this.dataset.value;
                });
            });
            
            // Navigation buttons
            document.getElementById('next1').onclick = () => {
                if(document.getElementById('clientType').value && document.getElementById('visitDate').value) {
                    showCard(2);
                } else {
                    alert('Please select visit type and date.');
                }
            };
            document.getElementById('next2').onclick = () => {
                const selected = document.querySelectorAll('input[name="service"]:checked');
                if(selected.length > 0) {
                    showCard(3);
                } else {
                    alert('Please select at least one service.');
                }
            };
            document.getElementById('next3').onclick = () => {
                if(document.getElementById('overallRating').value) {
                    showCard(4);
                } else {
                    alert('Please rate the overall service quality.');
                }
            };
            document.getElementById('prev2').onclick = () => showCard(1);
            document.getElementById('prev3').onclick = () => showCard(2);
            document.getElementById('prev4').onclick = () => showCard(3);
            
            // Submit
            document.getElementById('submitSurvey').onclick = () => {
                if(document.getElementById('feedbackType').value && document.getElementById('feedbackText').value && document.getElementById('recommendation').value) {
                    submitSurvey();
                } else {
                    alert('Please complete all required feedback fields.');
                }
            };
            
            document.getElementById('newSurvey').onclick = () => location.reload();
            
            // Dashboard navigation
            document.getElementById('navDashboard').onclick = () => {
                document.getElementById('surveySection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                loadDashboard();
            };
            document.getElementById('navSurvey').onclick = () => {
                document.getElementById('surveySection').style.display = 'block';
                document.getElementById('dashboardSection').style.display = 'none';
            };
        }
        
        // Submit survey
        async function submitSurvey() {
            const selectedServices = Array.from(document.querySelectorAll('input[name="service"]:checked')).map(cb => {
                if(cb.value === 'Other') {
                    const other = document.getElementById('otherService').value;
                    return other || cb.value;
                }
                return cb.value;
            });
            
            const surveyData = {
                clientInfo: {
                    phone: document.getElementById('clientPhone').value,
                    visitDate: document.getElementById('visitDate').value,
                    clientType: document.getElementById('clientType').value
                },
                services: selectedServices,
                ratings: {
                    overall: document.getElementById('overallRating').value,
                    staff: document.getElementById('staffRating').value,
                    cleanliness: document.getElementById('cleanlinessRating').value,
                    waitTime: document.getElementById('waitTimeRating').value
                },
                feedback: {
                    type: document.getElementById('feedbackType').value,
                    text: document.getElementById('feedbackText').value,
                    recommendation: document.getElementById('recommendation').value,
                    improvements: document.getElementById('improvementSuggestions').value
                },
                employeeShoutout: document.getElementById('employeeShoutout').value
            };
            
            const clientId = 'LUN' + Date.now().toString().slice(-8);
            
            // Save to Supabase
            if(supabase && dbConnected) {
                try {
                    await supabase.from('clients').insert([{
                        id: clientId,
                        client_type: surveyData.clientInfo.clientType,
                        phone: surveyData.clientInfo.phone,
                        visit_date: surveyData.clientInfo.visitDate,
                        services: JSON.stringify(surveyData.services),
                        rating: parseInt(surveyData.ratings.overall),
                        staff_rating: surveyData.ratings.staff ? parseInt(surveyData.ratings.staff) : null,
                        cleanliness_rating: surveyData.ratings.cleanliness ? parseInt(surveyData.ratings.cleanliness) : null,
                        wait_time_rating: surveyData.ratings.waitTime ? parseInt(surveyData.ratings.waitTime) : null,
                        employee_shoutout: surveyData.employeeShoutout,
                        submission_date: new Date().toISOString()
                    }]);
                    
                    await supabase.from('feedback').insert([{
                        id: clientId + '_fb',
                        client_id: clientId,
                        type: surveyData.feedback.type,
                        text: surveyData.feedback.text,
                        recommendation: surveyData.feedback.recommendation,
                        improvements: surveyData.feedback.improvements,
                        employee_shoutout: surveyData.employeeShoutout,
                        date: new Date().toISOString()
                    }]);
                    
                    console.log("Saved to Supabase!");
                } catch(e) {
                    console.error("Supabase error:", e);
                }
            }
            
            // Show thank you
            document.getElementById('thankYouCard').classList.add('active');
            document.getElementById('card4').classList.remove('active');
            document.getElementById('progressFill').style.width = '100%';
            alert('Thank you for your feedback!');
        }
        
        // Dashboard (simple version)
        function loadDashboard() {
            const data = JSON.parse(localStorage.getItem('lunasBusinessData') || '{"clients":[],"feedback":[]}');
            document.getElementById('dashboardSection').innerHTML = `
                <div style="background: white; border-radius: 20px; padding: 30px;">
                    <h2>Analytics Dashboard</h2>
                    <p>Total Clients: ${data.clients.length}</p>
                    <p>Total Feedback: ${data.feedback.length}</p>
                    <button class="btn btn-primary" id="logoutDashboard" style="margin-top: 20px;">Back to Survey</button>
                </div>
            `;
            document.getElementById('logoutDashboard').onclick = () => {
                document.getElementById('surveySection').style.display = 'block';
                document.getElementById('dashboardSection').style.display = 'none';
                document.getElementById('navSurvey').click();
            };
        }
        
        // Initialize Supabase
        async function initSupabase() {
            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                const { error } = await supabase.from('clients').select('id').limit(1);
                dbConnected = !error;
                console.log(dbConnected ? "Supabase connected" : "Supabase not ready");
            } catch(e) {
                console.error("Supabase init error:", e);
            }
        }
        
        // Initialize localStorage
        if (!localStorage.getItem('lunasBusinessData')) {
            localStorage.setItem('lunasBusinessData', JSON.stringify({
                clients: [], services: [], feedback: [], servicePerceptions: [], employeeShoutouts: [],
                newClientsCount: 0, returningClientsCount: 0
            }));
        }
        
        // Start
        initSupabase();
        init();
    </script>
</body>
</html>
