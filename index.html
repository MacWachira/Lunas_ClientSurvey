<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LUNAS Beauty Salon - Client Survey & Analytics System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --primary-color: #006850;
            --secondary-color: #FBB040;
            --accent-color: #9b59b6;
            --gradient-start: #006850;
            --gradient-end: #00875a;
            --dark-color: #1a1a2e;
            --light-color: #FFFFFF;
            --light-bg: #f0f2f5;
            --card-bg: #ffffff;
            --text-dark: #16213e;
            --text-light: #6c757d;
            --border-color: #e9ecef;
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
            --warning-color: #f39c12;
            --info-color: #3498db;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', 'Segoe UI', sans-serif; }
        body { background: linear-gradient(145deg, #f0f2f5 0%, #e8ecf1 100%); min-height: 100vh; position: relative; padding-bottom: 80px; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; width: 100%; }
        
        .main-header { position: sticky; top: 0; z-index: 100; background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end)); padding: 20px 0; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .header-content { max-width: 1400px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .logo { font-family: 'Playfair Display', serif; font-size: 2.5rem; font-weight: 700; color: white; letter-spacing: 2px; text-transform: uppercase; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .tagline { font-size: 0.9rem; color: rgba(255,255,255,0.9); letter-spacing: 4px; text-transform: uppercase; margin-top: 5px; }
        .nav-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
        .nav-btn { padding: 10px 20px; background-color: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 40px; font-weight: 600; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .nav-btn:hover { background-color: rgba(255,255,255,0.25); transform: translateY(-2px); }
        .nav-btn.active { background-color: var(--secondary-color); color: var(--dark-color); border-color: transparent; }
        
        #surveySection { display: block; }
        #dashboardSection { display: none; }
        
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 10000; backdrop-filter: blur(5px); }
        .login-container { background: white; border-radius: 32px; padding: 40px; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.3); }
        .login-container h2 { color: var(--primary-color); margin-bottom: 10px; }
        .login-container input { width: 100%; padding: 14px; margin: 12px 0; border: 2px solid var(--border-color); border-radius: 50px; font-size: 1rem; }
        .login-container input:focus { outline: none; border-color: var(--primary-color); }
        .login-error { color: var(--danger-color); margin-top: 10px; display: none; font-size: 0.9rem; }
        .logout-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); padding: 10px 22px; border-radius: 40px; font-weight: 600; cursor: pointer; color: white; transition: 0.2s; }
        .logout-btn:hover { background: rgba(255,255,255,0.3); transform: translateY(-2px); }
        
        .survey-header { text-align: center; margin-bottom: 40px; padding: 35px 20px; background: linear-gradient(135deg, rgba(0,104,80,0.1), rgba(251,176,64,0.1)); border-radius: 28px; }
        .survey-title { font-size: 2rem; color: var(--primary-color); margin-bottom: 15px; }
        .survey-subtitle { font-size: 1rem; color: var(--text-light); max-width: 700px; margin: 0 auto; }
        
        .progress-container { margin-bottom: 35px; }
        .progress-bar { height: 8px; background-color: var(--border-color); border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(to right, var(--gradient-start), var(--secondary-color)); width: 0%; transition: width 0.5s ease; border-radius: 10px; }
        
        .survey-card { background-color: var(--card-bg); border-radius: 32px; padding: 35px 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.6); display: none; }
        .survey-card.active { display: block; animation: fadeInUp 0.5s ease; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-header { margin-bottom: 30px; border-left: 4px solid var(--secondary-color); padding-left: 20px; }
        .card-header h2 { font-size: 1.6rem; color: var(--primary-color); margin-bottom: 8px; }
        
        .form-group { margin-bottom: 25px; }
        label { display: block; font-weight: 600; margin-bottom: 10px; color: var(--dark-color); }
        .required { color: var(--danger-color); }
        input, select, textarea { width: 100%; padding: 14px 18px; border: 2px solid var(--border-color); border-radius: 20px; font-size: 1rem; transition: all 0.3s; background: white; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 4px rgba(0,104,80,0.1); }
        
        .employee-choice-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; margin-top: 12px; }
        .employee-option { background: #f9fafc; border: 2px solid var(--border-color); border-radius: 60px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: all 0.2s ease; }
        .employee-option input { width: 20px; height: 20px; margin: 0; cursor: pointer; accent-color: var(--primary-color); }
        .employee-option label { margin: 0; cursor: pointer; font-weight: 500; font-size: 1rem; flex: 1; color: var(--text-dark); }
        .employee-option:hover { background: #fff3e0; border-color: var(--secondary-color); transform: translateY(-2px); }
        .employee-option.selected { background: linear-gradient(115deg, #eef9f5, #e6f3ee); border-color: var(--primary-color); }
        
        .services-enhanced { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin: 20px 0; }
        .service-card-enh { background: #fafcff; border-radius: 20px; border: 2px solid var(--border-color); transition: all 0.25s ease; overflow: hidden; cursor: pointer; }
        .service-card-enh:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        .service-card-enh.selected { border-color: var(--primary-color); background: white; box-shadow: 0 8px 20px rgba(0,104,80,0.12); }
        .service-header-enh { display: flex; align-items: center; padding: 14px 16px; }
        .service-header-enh input { width: 22px; height: 22px; margin-right: 14px; cursor: pointer; accent-color: var(--primary-color); }
        .service-header-enh span { font-weight: 600; font-size: 0.95rem; flex: 1; cursor: pointer; }
        .service-rating-enh { padding: 0 16px 16px 16px; background: white; border-top: 1px dashed var(--border-color); display: none; }
        .service-card-enh.selected .service-rating-enh { display: block; animation: slideDown 0.25s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .stars-enh { display: flex; gap: 6px; margin: 12px 0 10px 0; flex-wrap: wrap; }
        .stars-enh span { font-size: 1.6rem; cursor: pointer; color: #cbd5e1; transition: 0.1s; }
        .stars-enh span.active { color: var(--secondary-color); text-shadow: 0 0 3px rgba(251,176,64,0.4); }
        .comment-enh input { width: 100%; padding: 10px 14px; border-radius: 40px; border: 1px solid var(--border-color); font-size: 0.85rem; }
        
        .rating-container { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin: 15px 0; }
        .rating-option { flex: 1; min-width: 90px; text-align: center; padding: 12px 8px; background: #f8f9fa; border-radius: 50px; cursor: pointer; border: 2px solid var(--border-color); font-weight: 500; transition: 0.2s; }
        .rating-option.selected { background: var(--primary-color); color: white; border-color: var(--primary-color); }
        .rating-option i { font-size: 1.3rem; margin-bottom: 4px; display: block; }

        .service-category { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin: 12px 0 0; color: var(--primary-color); font-size: 1.05rem; }
        .service-category::after { content: ''; height: 1px; background: var(--border-color); flex: 1; }
        .quality-grid { display: grid; gap: 20px; }
        .quality-question { background: linear-gradient(145deg, #fbfdfc, #f5f8f7); border: 1px solid var(--border-color); border-radius: 24px; padding: 20px; }
        .quality-question label { display: flex; align-items: center; gap: 9px; }
        .quality-options { display: grid; grid-template-columns: repeat(5, minmax(90px, 1fr)); gap: 10px; }
        .quality-option { border: 2px solid var(--border-color); background: white; border-radius: 18px; padding: 12px 8px; color: var(--text-dark); cursor: pointer; font-weight: 600; transition: 0.2s; text-align: center; }
        .quality-option i { display: block; color: var(--secondary-color); font-size: 1.25rem; margin-bottom: 5px; }
        .quality-option:hover { border-color: var(--secondary-color); transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,0.07); }
        .quality-option.selected { color: white; border-color: var(--primary-color); background: linear-gradient(135deg, var(--primary-color), var(--gradient-end)); box-shadow: 0 7px 18px rgba(0,104,80,0.2); }
        .quality-option.selected i { color: var(--secondary-color); }
        .loyalty-banner { background: linear-gradient(135deg, #fff8e8, #eef9f5); border: 2px solid rgba(251,176,64,0.45); border-radius: 24px; padding: 20px; margin-bottom: 24px; display: flex; gap: 16px; align-items: flex-start; }
        .loyalty-banner > i { color: var(--secondary-color); font-size: 2rem; }
        .loyalty-banner h3 { color: var(--primary-color); margin-bottom: 5px; }
        .consent-row { display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px; background: #f8faf9; border-radius: 16px; }
        .consent-row input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--primary-color); }
        .consent-row label { margin: 0; font-weight: 500; }
        .points-earned { display: inline-flex; align-items: center; gap: 10px; background: linear-gradient(135deg, var(--primary-color), var(--gradient-end)); color: white; padding: 14px 22px; border-radius: 50px; margin: 20px 0 4px; font-weight: 700; }
        
        .btn-container { display: flex; justify-content: space-between; margin-top: 40px; gap: 20px; flex-wrap: wrap; }
        .btn { padding: 14px 28px; border: none; border-radius: 50px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; flex: 1; min-width: 140px; }
        .btn-primary { background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end)); color: white; box-shadow: 0 5px 15px rgba(0,104,80,0.3); }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,104,80,0.4); }
        .btn-secondary { background: #f0f0f0; color: var(--dark-color); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: #e0e0e0; transform: translateY(-2px); }
        .btn-danger { background: linear-gradient(135deg, var(--danger-color), #c0392b); color: white; }
        
        .thank-you-card { text-align: center; padding: 50px 30px; display: none; }
        .thank-you-card.active { display: block; }
        .thank-you-icon { font-size: 4.5rem; color: var(--primary-color); margin-bottom: 25px; }
        .social-icons { display: flex; justify-content: center; gap: 25px; flex-wrap: wrap; margin: 30px 0; }
        .social-icon { display: flex; flex-direction: column; align-items: center; text-decoration: none; transition: 0.3s; }
        .social-icon:hover { transform: translateY(-5px); }
        .social-circle { width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; font-size: 1.8rem; color: white; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .instagram { background: linear-gradient(45deg, #405DE6, #833AB4, #E1306C); }
        .tiktok { background: linear-gradient(45deg, #000000, #25F4EE, #FE2C55); }
        .whatsapp { background: linear-gradient(45deg, #25D366, #128C7E); }
        
        .dashboard-header { background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end)); border-radius: 28px; padding: 30px 35px; color: white; display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; flex-wrap: wrap; gap: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .refresh-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); padding: 10px 22px; border-radius: 40px; font-weight: 600; cursor: pointer; color: white; transition: 0.2s; }
        .refresh-btn:hover { background: rgba(255,255,255,0.3); transform: translateY(-2px); }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .stat-card { background: white; border-radius: 24px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); transition: all 0.3s; border-bottom: 4px solid var(--secondary-color); position: relative; overflow: hidden; }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--primary-color), var(--secondary-color), var(--accent-color)); }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .stat-number { font-size: 2.5rem; font-weight: 800; background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1; margin-bottom: 8px; }
        .stat-label { color: var(--text-light); font-weight: 600; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 30px; margin-bottom: 35px; }
        @media (max-width: 1000px) { .dashboard-grid { grid-template-columns: 1fr; } .survey-card { padding: 24px 20px; } .logo { font-size: 2rem; } }
        @media (max-width: 700px) { .quality-options { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 550px) { .stats-grid { grid-template-columns: 1fr; } .employee-choice-grid { grid-template-columns: 1fr; } .btn-container { flex-direction: column; } .btn { width: 100%; } .services-enhanced { grid-template-columns: 1fr; } .loyalty-banner { flex-direction: column; } }
        
        .dashboard-card { background: white; border-radius: 28px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); transition: all 0.3s; border: 1px solid rgba(0,0,0,0.05); }
        .dashboard-card:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .dashboard-card h2 { color: var(--primary-color); font-size: 1.3rem; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; border-left: 3px solid var(--secondary-color); padding-left: 15px; }
        .chart-container { height: 260px; margin-top: 15px; position: relative; }
        .feedback-item { padding: 18px; border-radius: 20px; margin-bottom: 14px; background: linear-gradient(115deg, #f8f9fa, #ffffff); border-left: 5px solid var(--primary-color); transition: 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .feedback-item:hover { transform: translateX(5px); background: linear-gradient(115deg, #fef9e6, #ffffff); }
        .per-service-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eef2f8; flex-wrap: wrap; gap: 8px; }
        .shoutout-item { background: linear-gradient(115deg, #fef9e6, #fff4e0); border-radius: 18px; padding: 14px; margin-bottom: 12px; border-left: 4px solid var(--secondary-color); transition: 0.2s; }
        .shoutout-item:hover { transform: translateX(5px); }
        
        .bottom-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            z-index: 1000;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            white-space: nowrap;
        }
        .bottom-toast.show {
            transform: translateX(-50%) translateY(0);
        }
        
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 2000; flex-direction: column; color: white; }
        .loading-overlay.active { display: flex; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.3); border-top-color: var(--secondary-color); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .empty-state { text-align: center; padding: 40px; color: var(--text-light); }
        .sync-status { background: #e8f5e8; padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; color: var(--primary-color); display: inline-block; font-weight: 500; }
        .loyalty-toolbar { display: flex; gap: 12px; align-items: center; margin: 18px 0; flex-wrap: wrap; }
        .loyalty-toolbar input { flex: 1; min-width: 220px; }
        #loyaltyMembersCard { scroll-margin-top: 130px; }
        .loyalty-table-wrap { overflow-x: auto; }
        .loyalty-table { width: 100%; border-collapse: collapse; min-width: 760px; }
        .loyalty-table th, .loyalty-table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border-color); }
        .loyalty-table th { background: #f6faf8; color: var(--primary-color); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; }
        .loyalty-table tbody tr:hover { background: #fffaf0; }
        .points-badge { display: inline-block; min-width: 64px; padding: 6px 10px; border-radius: 30px; background: #fff3d9; color: #8a5a00; font-weight: 700; text-align: center; }
        
        .hear-options { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 10px; }
        .hear-option { display: flex; align-items: center; gap: 8px; padding: 10px 20px; background: #f8f9fa; border-radius: 50px; cursor: pointer; border: 2px solid var(--border-color); transition: 0.2s; }
        .hear-option input { width: auto; margin: 0; padding: 0; }
        .hear-option.selected { background: linear-gradient(135deg, var(--primary-color), var(--gradient-end)); color: white; border-color: var(--primary-color); }
        .hear-option.selected label { color: white; }
        .hear-option label { margin: 0; cursor: pointer; font-weight: 500; }
        
        .other-text-input { margin-top: 12px; display: none; }
        .other-text-input input { width: 100%; padding: 12px 16px; border: 2px solid var(--border-color); border-radius: 20px; font-size: 0.9rem; }
        .other-text-input.show { display: block; }
        
        /* Rating bar styles */
        .rating-bars { margin-top: 10px; }
        .rating-bar-item { margin-bottom: 15px; }
        .rating-bar-label { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.85rem; }
        .rating-bar-bg { background: #e9ecef; border-radius: 10px; overflow: hidden; height: 25px; }
        .rating-bar-fill { background: linear-gradient(90deg, var(--primary-color), var(--secondary-color)); height: 100%; border-radius: 10px; display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; color: white; font-size: 0.75rem; font-weight: bold; }
    </style>
</head>
<body>

        async function apiRequest(path, options = {}) {
            if (!API_BASE_URL || API_BASE_URL.includes('YOUR-RENDER-SERVICE')) {
                throw new Error('The backend URL has not been configured in config.js.');
            }
            const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
            if (adminToken) headers.Authorization = `Bearer ${adminToken}`;
            const response = await fetch(`${API_BASE_URL}${path}`, { ...options, headers });
            const result = await response.json().catch(() => ({}));
            if (!response.ok) {
                if (response.status === 401) {
                    adminToken = '';
                    isLoggedIn = false;
                    sessionStorage.removeItem('lunasAdminToken');
                }
                throw new Error(result.error || `Request failed (${response.status})`);
            }
            return result;
        }

        function normalizePhone(value) {
            let digits = String(value || '').replace(/\D/g, '');
            if (digits.startsWith('0') && digits.length === 10) digits = `254${digits.slice(1)}`;
            if (digits.startsWith('7') && digits.length === 9) digits = `254${digits}`;
            return /^254\d{9}$/.test(digits) ? digits : '';
        }

        function normalizeVisitDate(value) {
            const raw = String(value || '');
            if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
            const date = new Date(raw);
            if (Number.isNaN(date.getTime())) return raw;
            const parts = new Intl.DateTimeFormat('en-GB', {
                timeZone: 'Africa/Nairobi', year: 'numeric', month: '2-digit', day: '2-digit'
            }).formatToParts(date).reduce((result, part) => ({ ...result, [part.type]: part.value }), {});
            return `${parts.year}-${parts.month}-${parts.day}`;
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        async function submitSurveyData() {
            showLoading();
            
            const serviceRatings = [];
            document.querySelectorAll('.service-check:checked').forEach(cb => {
                let svc = cb.value;
                const card = cb.closest('.service-card-enh');
                const starCount = card.querySelectorAll('.stars-enh span.active').length;
                const comment = card.querySelector('.svc-comment')?.value || '';
                serviceRatings.push({ service: svc, section: card.dataset.section, rating: starCount, comment: comment });
            });
            
            let selectedEmployee = '';
            const selectedRadio = document.querySelector('input[name="employeeShoutoutRadio"]:checked');
            if(selectedRadio) selectedEmployee = selectedRadio.value;
            const customShout = document.getElementById('employeeShoutoutFieldCustom')?.value || '';
            const finalShoutout = customShout ? `${selectedEmployee ? selectedEmployee + ': ' : ''}${customShout}` : (selectedEmployee || '');
            
            const hearSelected = document.querySelector('input[name="howDidYouHear"]:checked');
            let howDidYouHear = hearSelected ? hearSelected.value : '';
            if (howDidYouHear === 'Other') {
                const otherText = document.getElementById('otherHearValue')?.value.trim();
                if (otherText) howDidYouHear = `Other: ${otherText}`;
            }
            
            const clientPhone = document.getElementById('clientPhone').value.trim();
            const visitDate = document.getElementById('visitDate').value;
            const surveyData = {
                idempotencyKey: crypto.randomUUID(),
                clientName: document.getElementById('clientName').value.trim(),
                clientPhone: clientPhone,
                visitDate: visitDate,
                clientType: document.getElementById('clientType').value,
                services: serviceRatings.map(s => s.service),
                serviceRatings,
                overallRating: Number(document.getElementById('overallRating').value),

                            options: { 
                                responsive: true, 
                                maintainAspectRatio: true,
                                plugins: { legend: { position: 'bottom', labels: { font: { size: 12 } } } }
                            } 
                        });
                    }
                    
                    const topSvcs = Array.from(serviceCountMap.entries()).sort((a,b) => b[1] - a[1]).slice(0, 6);
                    const serviceCtx = document.getElementById('serviceChart')?.getContext('2d');
                    if (serviceCtx && topSvcs.length > 0) {
                        new Chart(serviceCtx, { 
                            type: 'bar', 
                            data: { 
                                labels: topSvcs.map(s => s[0].length > 15 ? s[0].substring(0,12)+'...' : s[0]), 
                                datasets: [{ 
                                    label: 'Times Booked', 
                                    data: topSvcs.map(s => s[1]), 
                                    backgroundColor: '#006850',
                                    borderRadius: 8,
                                    barPercentage: 0.7
                                }] 
                            }, 
                            options: { 
                                responsive: true,
                                maintainAspectRatio: true,
                                plugins: { legend: { position: 'top' } },
                                scales: { y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } } } 
                            } 
                        });
                    }
                    
                    const employeeCtx = document.getElementById('employeeChart')?.getContext('2d');
                    if (employeeCtx) {
                        const employeeLabels = Object.keys(employeeShoutoutCounts);
                        const employeeData = Object.values(employeeShoutoutCounts);
                        new Chart(employeeCtx, { 
                            type: 'bar', 
                            data: { 
                                labels: employeeLabels, 
                                datasets: [{ 
                                    label: 'Number of Shoutouts', 
                                    data: employeeData, 
                                    backgroundColor: '#FBB040',
                                    borderRadius: 8,
                                    barPercentage: 0.7
                                }] 
                            }, 
                            options: { 
                                responsive: true,
                                maintainAspectRatio: true,
                                plugins: { legend: { position: 'top' } },
                                scales: { y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } } } 
                            } 
                        });
                    }
                    
                    const hearCtx = document.getElementById('hearChart')?.getContext('2d');
                    if (hearCtx) {
                        const hearLabels = Object.keys(hearCounts);
                        const hearData = Object.values(hearCounts);
                        const hearColors = ['#006850', '#FBB040', '#9b59b6', '#3498db', '#e74c3c', '#2ecc71'];
                        new Chart(hearCtx, { 
                            type: 'bar', 
                            data: { 
                                labels: hearLabels, 
                                datasets: [{ 
                                    label: 'Number of Clients', 
                                    data: hearData, 
                                    backgroundColor: hearColors.slice(0, hearLabels.length),
                                    borderRadius: 8,
                                    barPercentage: 0.7
                                }] 
                            }, 
                            options: { 
                                responsive: true,
                                maintainAspectRatio: true,
                                plugins: { legend: { position: 'top' } },
                                scales: { y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } } } 
                            } 
                        });
                    }
                } catch (error) {
                    console.error("Chart creation error:", error);
                }
            }, 200);
            
            hideLoading();
        }
        
        function exportToCSV(data) {
            if(data.length === 0) {
                alert('No data to export!');
                return;
            }
            
            let csvRows = [["Timestamp", "Submission Date", "Client Name", "Phone Number", "Visit Date", "Client Type", "Services", "Overall Rating", "Staff Rating", "Cleanliness", "Wait Time", "Feedback Type", "Feedback Text", "Recommendation", "Improvements", "Employee Shoutout", "How Did You Hear", "Marketing Consent", "Points Earned", "Loyalty Balance", "Loyalty Status"]];
            
            data.forEach(row => {
                csvRows.push([
                    row.timestamp || '',
                    row.submissionDate || '',
                    row.clientName || '',
                    row.clientPhone || '',
                    row.visitDate || '',
                    row.clientType || '',
                    row.services || '',
                    row.overallRating || '',
                    row.staffRating || '',
                    row.cleanlinessRating || '',
                    row.waitTimeRating || '',
                    row.feedbackType || '',
                    row.feedbackText || '',
                    row.recommendation || '',
                    row.improvements || '',
                    row.employeeShoutout || '',
                    row.howDidYouHear || '',
                    row.marketingConsent || 'No',
                    row.loyaltyPointsEarned || 0,
                    row.loyaltyBalance || 0,
                    row.loyaltyStatus || ''
                ]);
            });
            
            const csvContent = csvRows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(",")).join("\n");
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.setAttribute('download', `lunas_survey_data_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showToast('📊 CSV exported successfully!');
        }

        function exportLoyaltyToCSV(members) {
            if (!members.length) {
                alert('No loyalty members to export!');
                return;
            }
            const rows = [['Customer Name', 'Phone Number', 'Rewarded Visits', 'Points Balance', 'Last Visit', 'Marketing Consent']];
            members.forEach(member => rows.push([
                member.name || 'Unnamed customer', member.phone, member.rewardedVisits,
                member.balance, member.lastVisit || '', member.marketingConsent ? 'Yes' : 'No'
            ]));
            const csvContent = rows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');
            const url = URL.createObjectURL(new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }));
            const link = document.createElement('a');
            link.href = url;
            link.download = `lunas_loyalty_members_${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);
            showToast('🎁 Loyalty members exported successfully!');
        }
        
        loadSurveyTool();
    </script>
</body>
